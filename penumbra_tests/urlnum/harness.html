     booted through the REAL run path (a stubbed query.php) on the vldigit suite's fixture: a
     60-row result shaped like a PIVOT query's, two columns named only in digits (2021, 2022)
     beside plain ones, and 0042 (digits with a leading zero: jQuery's data() keeps that one as
     text). data('colname') hands the 2021 heading back as the NUMBER 2021, and a header click
     keeps that number as the sort level's colIdentifier.
     The page is opened as harness.html?scn=S&id=unfix[&view=TOKEN][&sort=...] - the ?id= is
     what makes a view link apply (saved reports only). pA's report opens as a PIVOT; every
     other scenario's report is flat with no sort of its own. -->

<script>
  (function () { try { localStorage.clear(); } catch (e) {} })();
  window.PENUMBRA_THEMES = { 'theme-default': { label: 'Default' } };
  window.PENUMBRA_THEME_IDS = ['theme-default'];
  window.PENUMBRA_THEME_ALIASES = {};
  window.PENUMBRA_LANDING_DEFAULT_THEME = 'theme-default';
  (function () {
    var P = new URLSearchParams(location.search);
    window.__SCN = P.get('scn') || 'fA';
    // --- the fixture: vldigit's PIVOT-shaped result, and 0042 --------------------------------
    // Integer-like keys come first in a JS object's key order, as they do when the browser
    // parses query.php's JSON - so 2021 and 2022 lead the table. 0042 is no integer-like key
    // (a leading zero): it keeps its place, last. 2021 holds three values (many ties: the
    // second sort level decides between them), V_STATUS three, 0042 four.
    var COLS = ['2021', '2022', 'V_ID', 'V_NAME', 'V_STATUS', '0042'];
    // uJ: a column named [1] too, last - jQuery's data() parses that name as JSON (an array)
    if (window.__SCN === 'uJ') COLS.push('[1]');
    window.__COLS = COLS;
    var seed = 20261025;
    function rnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }
    function pick(a) { return a[Math.floor(rnd() * a.length)]; }
    var W = ['Alpha', 'Bravo', 'Charlie', 'Delta', 'Echo', 'Foxtrot'];
    var rows = [];
    for (var i = 1; i <= 60; i++) {
      var r = {};
      r['2021'] = pick(['100', '250', '975.5']);
      r['2022'] = pick(['10', '20', '30', '40']);
      r.V_ID = 'ID-' + String(1000 + i);
      r.V_NAME = pick(W) + ' ' + pick(W);
      r.V_STATUS = pick(['Open', 'Closed', 'Pending']);
      r['0042'] = pick(['3', '5', '7', '9']);
      if (window.__SCN === 'uJ') r['[1]'] = pick(['10', '20', '30']);
      rows.push(r);
    }
    window.__rowsFixture = rows;
    // --- the scenario's stored report ------------------------------------------
    var order = []; for (var c = 0; c < COLS.length; c++) order.push(c);
    var st = {
      name: 'unfix', query: 'SELECT * FROM UN_FIXTURE', reportTitle: 'URL sort digit fixture',
      theme: 'theme-default', density: 'standard',
      visibleColumns: ['#'].concat(order), columnOrder: order,
      sortCriteria: [], noLimit: true, rowExpandDefault: false, resolverLinksDefault: true,
      rowsPerPage: '200', reportSnippet: ''
    };
    // pA: the report opens as a pivot (V_NAME by V_STATUS, the rows counted)
    if (window.__SCN === 'pA') {
      st.pivot = { v: 2, rows: ['V_NAME'], cols: ['V_STATUS'], vals: 'V_ID', agg: ['count'], aggLabels: ['Count'], aggColOverrides: ['V_ID'],
                   aggFilters: null, aggFormulas: null, rowLayout: 'flat', colLayout: 'nested', sortOrder: 'asc', colSortOrder: 'asc',
                   stickyColCount: 1, totalColAggs: null, totalRowAggs: null, totalRowAggLabels: null, totalRowAggBaseIdx: null,
                   rankN: null, rankDir: null, rankAgg: null, rankOther: true, rankScope: null, noBreakdown: false, startExpanded: false, hideEmpty: false };
    }
    window.__STORED = st;
    window.penumbra_vars = {
      isAdmin: true, isGlobalAdmin: true, canEditReport: true, currentUserKey: 'harness', shibboleth: { ouc: '', dept: '' },
      tables: { oracle: [], pins: [], infoed: [], hr: [], fin: [] },
      imports: [], reports: [], themes: {}, prompts: {}, grants: [],
      totalExemptions: [],
      preloadedState: st
    };
    window.__queryResponse = { data: rows };
  })();
  window.__T = {};
  window.__queryDone = 0;
  window.__ajaxLog = [];
  window.__clip = [];
</script>

<script>
  jQuery.ajax = function (a, b) {
    var opts = (typeof a === 'string') ? jQuery.extend({ url: a }, b || {}) : (a || {});
    var url = String(opts.url || '');
    window.__ajaxLog.push(url);
    var d = jQuery.Deferred();
    var isQuery = /query\.php/.test(url);
    var resp = isQuery ? window.__queryResponse : (/help_content\.php/.test(url) ? '' : {});
    setTimeout(function () {
      try { if (opts.success) opts.success(resp, 'success', { status: 200 }); } catch (e) { window.__errors.push('ajax success threw: ' + String(e)); }
      try { if (opts.complete) opts.complete({ status: 200 }, 'success'); } catch (e) { window.__errors.push('ajax complete threw: ' + String(e)); }
      d.resolve(resp, 'success', { status: 200 });
      if (isQuery) window.__queryDone++;
    }, 0);
    var p = d.promise(); p.abort = function () {}; return p;
  };
  jQuery.getJSON = function (u, x, cb) { return jQuery.ajax({ url: u, success: (typeof x === 'function') ? x : cb }); };
  jQuery.post = function (u, x, cb) { return jQuery.ajax({ url: u, success: (typeof x === 'function') ? x : cb }); };
  jQuery.get = jQuery.post;
  jQuery.fx.off = true;
  window.__errors = [];
  window.__rejections = [];
  window.onerror = function (m, src, line) { window.__errors.push(String(m) + ' @' + String(src).split('/').pop() + ':' + line); return true; };
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    window.__rejections.push(String((r && r.message) || r) + ' @' + String((r && r.stack) || '').split('\n').slice(1, 2).join('').trim());
    e.preventDefault();
  });
  // the link's Copy writes the clipboard: keep what it would write
  try { Object.defineProperty(navigator.clipboard, 'writeText', { configurable: true, value: function (s) { window.__clip.push(String(s)); return Promise.resolve(); } }); } catch (e) { window.__clipErr = String(e); }
  window.confirm = function () { return true; };
  window.alert = function (m) { window.__errors.push('alert: ' + m); };
  window.prompt = function () { return null; };
  if (typeof window.stackHeaders !== 'function') window.stackHeaders = function () {};
</script>
