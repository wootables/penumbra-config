<body>
<!-- COMBO STACK GROUPS (2026-10-06). run.ps1 builds harness_built.html from this
     file: the chart builder's REAL markup (the #visualizationLightbox block of the
     index.php under test) replaces the marker below, so the builder that is driven
     here is the one the app ships. main.js binds builder elements at ready time, so
     the markup must be in the page before main.js loads. -->
<div id="editorTabs"></div><div id="reportHeaderContainer"></div><div id="mainReportSubtitle"></div>

</tr></thead><tbody></tbody></table>

<script>
  window.penumbra_vars = {
    isAdmin: true, isGlobalAdmin: true, currentUserKey: 'harness', shibboleth: { ouc: '', dept: '' },
    tables: { oracle: [], pins: [], infoed: [], hr: [], fin: [] },
    imports: [], reports: [], themes: {}, prompts: {}, grants: []
  };
  jQuery.ajax = function () { var d = jQuery.Deferred(); d.resolve({}); return d.promise(); };
  jQuery.getJSON = jQuery.ajax; jQuery.post = jQuery.ajax; jQuery.get = jQuery.ajax;
  jQuery.fx.off = true;
  window.ResizeObserver = function () { this.observe = function () {}; this.unobserve = function () {}; this.disconnect = function () {}; };
  if (!window.matchMedia) {
    window.matchMedia = function () { return { matches: false, addListener: function () {}, removeListener: function () {}, addEventListener: function () {}, removeEventListener: function () {} }; };
  }
  // A native dialog would stall a headless run; nothing on these paths should raise one.
  window.alert = function (m) { (window.__dialogs = window.__dialogs || []).push('alert: ' + m); };
  window.confirm = function (m) { (window.__dialogs = window.__dialogs || []).push('confirm: ' + m); return true; };
  window.__errors = [];
  window.onerror = function (m, src, line) { window.__errors.push(String(m) + ' @' + String(src).split('/').pop() + ':' + line); return true; };
  window.addEventListener('unhandledrejection', function (e) { window.__errors.push('unhandled rejection: ' + (e.reason && e.reason.message ? e.reason.message : e.reason)); });
</script>
<script src="main_patched.js"></script>
<script>
(function () {
  function report(txt) { document.getElementById('out').textContent = txt; }
  var results = [];
  function assert(name, cond, detail) { results.push({ name: name, pass: !!cond, detail: detail === undefined ? '' : String(detail) }); }
  function eq(name, got, want) {
    var g = JSON.stringify(got), w = JSON.stringify(want);
    assert(name, g === w, 'got ' + g + ' | want ' + w);
  }
  function section(tag, fn) {
    try { return fn(); } catch (e) { assert(tag + ' section ran to the end', false, String(e) + ' ' + String(e.stack || '').split('\n').slice(1, 3).join(' | ')); }
  }
  async function asection(tag, fn) {
    try { return await fn(); } catch (e) { assert(tag + ' section ran to the end', false, String(e) + ' ' + String(e.stack || '').split('\n').slice(1, 3).join(' | ')); }
  }
  function M(o) { var m = new Map(); Object.keys(o).forEach(function (k) { m.set(k, o[k]); }); return m; }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }
  function tick(ms) { return new Promise(function (r) { setTimeout(r, ms || 0); }); }

  // Evidence rows shaped like ?id=dodnsa: DOD_DOW = Award / Expenditure on every
  // row, NSA = the same word on NSA rows and empty otherwise, AMOUNT formatted the
  // way the report's TO_CHAR prints it, AWARD_ID the TEXT ids the report carries.
  function r(fy, kind, nsa, amt, id) {
    return M({ FY: fy, DOD_DOW: kind, NSA: nsa ? kind : '', AMOUNT: amt, AWARD_ID: id });
  }
  var ROWS = [
    r('FY 2024', 'Award', true, '$30', 'PAM-P24-000001'), r('FY 2024', 'Award', true, '$10', 'PAM-P24-000002'),
    r('FY 2024', 'Award', false, '$70', 'PAM-P24-000003'),
    r('FY 2024', 'Expenditure', true, '$20', 'PAM-P24-000001'), r('FY 2024', 'Expenditure', false, '$50', 'PAM-P24-000003'),
    r('FY 2025', 'Award', true, '$40', 'PAM-P24-000001'), r('FY 2025', 'Award', false, '$60', 'P25-000004-01'),
    r('FY 2025', 'Award', false, '$0', 'P25-000005-01'),
    r('FY 2025', 'Expenditure', true, '$25', 'PAM-P24-000001'), r('FY 2025', 'Expenditure', false, '$55', 'P25-000004-01'),
    r('FY 2026', 'Award', true, '$35', '2026-0006'), r('FY 2026', 'Award', false, '$80', 'PAM-P24-000003'),
    r('FY 2026', 'Expenditure', true, '$22', '2026-0006'), r('FY 2026', 'Expenditure', false, '$66', 'PAM-P24-000003')
  ];
  // The ?id=dodnsa design: two stacked bars a year (awards, R&D), NSA the darker
  // part of each, award counts as lines on the right axis.
  var SERIES = [
    { col: 'AMOUNT', type: 'bar', agg: 'sum', color: '#1f4e9c', filterExpression: 'DOD_DOW = Award AND NSA = Award', label: 'NSA awards', values: 'none' },
    { col: 'AMOUNT', type: 'bar', agg: 'sum', color: '#6f9fe0', filterExpression: 'DOD_DOW = Award AND NSA = empty', label: 'Other DOD/DOW awards', values: 'none' },
    { col: 'AMOUNT', type: 'bar', agg: 'sum', color: '#a33f17', filterExpression: 'DOD_DOW = Expenditure AND NSA = Expenditure', label: 'NSA R&D', values: 'none', stack: '2' },
    { col: 'AMOUNT', type: 'bar', agg: 'sum', color: '#f08e67', filterExpression: 'DOD_DOW = Expenditure AND NSA = empty', label: 'Other DOD/DOW R&D', values: 'none', stack: '2' },
    { col: 'AWARD_ID', type: 'line', agg: 'distinct', color: '#333333', filterExpression: 'DOD_DOW = Award AND AMOUNT > 0', label: 'DOD/DOW awards (#)', values: 'none' },
    { col: 'AWARD_ID', type: 'line', agg: 'distinct', color: '#777777', filterExpression: 'NSA = Award AND AMOUNT > 0', label: 'NSA awards (#)', values: 'none' }
  ];
  var WANT_SUMS = [[40, 40, 35], [70, 60, 80], [20, 25, 22], [50, 55, 66]];
  var WANT_COUNTS = [[3, 2, 2], [2, 1, 1]];

  function build(series, opts, rows) {
    return window.__CS.chartData(rows || ROWS, 'FY', 'none', 'none', 'sum', 10, 'combo', 'label', 'asc', 'default',
      false, false, clone(series), '', { vizOptions: opts || '' });
  }
  // renderSnippetChart(canvasId, type, data, title, showLegend, showValues, legendPosition, valuePos, animate,
  //   stacked, horizontal, titlePos, isCurrency, normalize, subtitle, xAxisLabel, yAxisLabel, logScale, yMin, yMax,
  //   comboSeriesArr, comboFill, referenceLine)
  function renderSnip(id, data, stacked, dual) {
    var old = Chart.getChart(id); if (old) old.destroy();
    window.__CS.renderSnip(id, 'combo', data, 'T', true, false, 'top', 'end', false, stacked, dual, 'top', true, false,
      '', '', '', false, '', '', clone(SERIES), false, '');
    return Chart.getChart(id);
  }
  function fin(ch, di, i) { var el = ch.getDatasetMeta(di).data[i]; return el.getProps(['x', 'y', 'base'], true); }
  function dsSig(ch) {
    return ch.data.datasets.map(function (ds) {
      return [ds.label, ds.type || 'bar', ds.stack === undefined ? null : ds.stack, ds.yAxisID || 'y', ds.data];
    });
  }
  function scaleSig(ch) {
    var s = ch.options.scales, y2 = s.y2;
    return [!!s.x.stacked, !!s.y.stacked, y2 ? [!!y2.title.display, y2.title.text || ''] : null];
  }
  function rows$() { return $('#vizComboSeriesList .viz-combo-series-row'); }
  // Wrapped in an outer array: jQuery's .map() flattens a returned array.
  function stackCells() { return rows$().map(function () { var $s = $(this).find('.viz-combo-stack'); return [$s.length ? [$s.val(), $s.css('visibility'), $s.prop('disabled')] : null]; }).get(); }
  function openBuilder() {
    // What the Chart button does on open (#visualizeBtn), minus the AJAX:
    // rows cached, form reset (attaches the live listeners), columns listed.
    window.vizCachedData = ROWS;
    window.__CS.resetViz();
    window.__CS.populateCols();
    $('.viz-type-option[data-type="bar"]').addClass('active');
  }

  async function run() {
    var F = window.__CS;
    if (!F || typeof F.chartData !== 'function') {
      report('RESULTS_JSON:' + JSON.stringify({ fatal: 'hooks unavailable: ' + (window.__CS_ERR || 'n/a'), pageErrors: window.__errors.slice(0, 6) }));
      return;
    }
    $('#visualizationLightbox').css('display', 'block');   // a sized preview, as when the dialog is open

    // ---------------- L: the libraries, loaded the way the builder's open handler loads them
    await asection('L', async function () {
      await F.loadScript('js/chart-4.5.1.min.js');
      await F.loadScript('js/chartjs-plugin-datalabels-2.0.0.min.js');
      await F.loadScript('js/chartjs-chart-treemap-3.1.0.min.js');
      await F.loadChartModule();
      if (window.ChartDataLabels) Chart.register(ChartDataLabels);
      assert('L1 Chart.js and the chart module are up', typeof Chart === 'function' && window.PenumbraCharts && window.PenumbraCharts.armed,
        typeof Chart + ' / ' + !!window.PenumbraCharts);
    });

    // ---------------- D: the data builder ------------------------------------------------
    section('D', function () {
      var d = build(SERIES, '{"y2Label":"Number of awards"}');
      eq('D1 one category per fiscal year, in order', d.labels, ['FY 2024', 'FY 2025', 'FY 2026']);
      eq('D2 the four dollar series sum their rows', d.datasets.slice(0, 4).map(function (ds) { return ds.data; }), WANT_SUMS);
      eq('D3 a distinct count of TEXT award ids counts the ids (a $0 action excluded by its filter)',
        d.datasets.slice(4).map(function (ds) { return ds.data; }), WANT_COUNTS);
      eq('D4 bars record their stack group, default group 1; lines record none',
        d.datasets.map(function (ds) { return ds._comboStack === undefined ? null : ds._comboStack; }),
        ['grp1', 'grp1', 'grp2', 'grp2', null, null]);
      eq('D5 the data builder sets no Chart.js stack id itself (that is the renderer\'s call)',
        d.datasets.map(function (ds) { return Object.prototype.hasOwnProperty.call(ds, 'stack'); }), [false, false, false, false, false, false]);
      var j = build([
        { col: 'AMOUNT', type: 'bar', agg: 'sum', color: '#111111', stack: '7' },
        { col: 'AMOUNT', type: 'bar', agg: 'sum', color: '#222222', stack: ' 3 ' },
        { col: 'AMOUNT', type: 'bar', agg: 'sum', color: '#333333', stack: 'x' },
        { col: 'AMOUNT', type: 'bar', agg: 'sum', color: '#444444', stack: 4 }
      ]);
      eq('D6 an out-of-range or junk stack is group 1; " 3 " and the number 4 are read',
        j.datasets.map(function (ds) { return ds._comboStack; }), ['grp1', 'grp3', 'grp1', 'grp4']);
      eq('D7 options y2Label rides the data (trimmed); none = empty',
        [d._y2Label, build(SERIES, '{"y2Label":"  N  "}')._y2Label, build(SERIES, '')._y2Label, build(SERIES, '{bad json')._y2Label],
        ['Number of awards', 'N', '', '']);
      // The first series decides the category order when sorting by value: a distinct
      // count of text must count the text there too.
      var sortRows = [
        M({ K: 'b', ID: 'X-1' }), M({ K: 'b', ID: 'X-1' }), M({ K: 'b', ID: 'X-1' }),
        M({ K: 'a', ID: 'X-1' }), M({ K: 'a', ID: 'X-2' }), M({ K: 'a', ID: 'X-3' })
      ];
      var so = F.chartData(sortRows, 'K', 'none', 'none', 'sum', 10, 'combo', 'value', 'desc', 'default', false, false,
        [{ col: 'ID', type: 'bar', agg: 'distinct', color: '#111111' }, { col: 'ID', type: 'line', agg: 'count', color: '#222222' }], '', {});
      eq('D8 sorting by a distinct count of text orders by the real counts (a = 3 ids, b = 1)', [so.labels, so.datasets[0].data], [['a', 'b'], [3, 1]]);
    });

    // ---------------- R: the report renderer (renderSnippetChart) ---------------------------
    section('R', function () {
      var ch = renderSnip('cs_a', build(SERIES, '{"y2Label":"Number of awards"}'), true, true);
      eq('R1 stacked: both axes stack', [ch.options.scales.x.stacked, ch.options.scales.y.stacked], [true, true]);
      eq('R2 stacked: bars take their group, every line a stack of its own, lines on the right axis',
        ch.data.datasets.map(function (ds) { return [ds.stack, ds.yAxisID || 'y']; }),
        [['grp1', 'y'], ['grp1', 'y'], ['grp2', 'y'], ['grp2', 'y'], ['__line4', 'y2'], ['__line5', 'y2']]);
      eq('R3 the right axis carries the y2Label title', [ch.options.scales.y2.title.display, ch.options.scales.y2.title.text], [true, 'Number of awards']);
      // Geometry, final (post-animation) element positions.
      var x = function (di, i) { return Math.round(fin(ch, di, i).x); };
      var okCols = [0, 1, 2].every(function (i) { return x(0, i) === x(1, i) && x(2, i) === x(3, i) && x(0, i) !== x(2, i); });
      assert('R4 per year: the award bars share one column, the R&D bars another, side by side', okCols,
        JSON.stringify([0, 1, 2].map(function (i) { return [x(0, i), x(1, i), x(2, i), x(3, i)]; })));
      var yS = ch.scales.y, y2S = ch.scales.y2;
      var near = function (a, b) { return Math.abs(a - b) < 1.5; };
      assert('R5 the top award segment ends at the stack total (FY 2024: 40 + 70)', near(fin(ch, 1, 0).y, yS.getPixelForValue(110)),
        fin(ch, 1, 0).y + ' vs ' + yS.getPixelForValue(110));
      assert('R6 ...and starts where the NSA segment ends', near(fin(ch, 1, 0).base, yS.getPixelForValue(40)), fin(ch, 1, 0).base + ' vs ' + yS.getPixelForValue(40));
      assert('R7 the top R&D segment ends at its own stack total (20 + 50), not the awards\'', near(fin(ch, 3, 0).y, yS.getPixelForValue(70)),
        fin(ch, 3, 0).y + ' vs ' + yS.getPixelForValue(70));
      assert('R8 a count line sits at its own value on the right axis (NSA FY 2024 = 2, not 3 + 2)', near(fin(ch, 5, 0).y, y2S.getPixelForValue(2)),
        fin(ch, 5, 0).y + ' vs ' + y2S.getPixelForValue(2));
      var y2Ticks = (y2S.ticks || []).map(function (t) { return t.label; }).join(' ');
      assert('R9 the right axis prints plain counts (no $)', y2Ticks && y2Ticks.indexOf('$') === -1, y2Ticks);

      // Unstacked: no stack ids at all, one bar per series side by side (as before).
      var un = renderSnip('cs_b', build(SERIES), false, true);
      eq('R10 unstacked: no dataset carries a stack id', un.data.datasets.map(function (ds) { return ds.stack === undefined; }), [true, true, true, true, true, true]);
      var ux = [0, 1, 2, 3].map(function (di) { return Math.round(fin(un, di, 0).x); });
      assert('R11 unstacked: four bars, four columns', new Set(ux).size === 4, JSON.stringify(ux));
      // Re-render the SAME data object unstacked after a stacked render: stale ids go.
      var dd = build(SERIES);
      renderSnip('cs_a', dd, true, true);
      var re = renderSnip('cs_a', dd, false, true);
      eq('R12 a stacked then unstacked render of the same data leaves no stale stack id',
        re.data.datasets.map(function (ds) { return ds.stack === undefined; }), [true, true, true, true, true, true]);
      // Stacked WITHOUT the dual axis: lines share the left axis and still never stack.
      var nd = renderSnip('cs_b', build(SERIES), true, false);
      assert('R13 stacked, one axis: the second line sits at its own value (2), not on the first', near(fin(nd, 5, 0).y, nd.scales.y.getPixelForValue(2)),
        fin(nd, 5, 0).y + ' vs ' + nd.scales.y.getPixelForValue(2));
      eq('R14 no y2Label = no right-axis title', [renderSnip('cs_b', build(SERIES), true, true).options.scales.y2.title.display], [false]);
      // An older stacked combo (no "stack" keys): every bar in one stack, as before.
      var old = SERIES.map(function (s) { var c = clone(s); delete c.stack; return c; });
      var od = renderSnip('cs_b', build(old), true, true);
      var oxs = [0, 1, 2, 3].map(function (di) { return Math.round(fin(od, di, 0).x); });
      assert('R15 a stacked combo saved before stack groups still stacks all its bars together', new Set(oxs).size === 1, JSON.stringify(oxs));
    });

    // ---------------- B: the chart builder, driven through its own controls --------------
    var code = '', pv = null;
    section('B', function () {
      openBuilder();
      $('#vizXAxis').val('FY').trigger('change');
      $('.viz-type-option[data-type="combo"]').trigger('click');
      eq('B1 Stack Data is offered on a combo (enabled, unticked, chip not dimmed)',
        [$('#vizStacked').prop('disabled'), $('#vizStacked').is(':checked'), $('#vizStackedWrap .viz-chip').hasClass('viz-chip-dim')], [false, false, false]);
      eq('B2 no Stack column until Stack Data is ticked',
        [$('#vizComboSeriesList').hasClass('viz-combo-stacked'), $('#vizComboSeriesList .viz-combo-series-header .viz-combo-stack').css('display') || 'missing'], [false, 'none']);
      while (rows$().length < SERIES.length) $('#vizAddComboSeries').trigger('click');
      SERIES.forEach(function (s, i) {
        var $r = rows$().eq(i);
        $r.find('.viz-combo-label').val(s.label).trigger('input');
        $r.find('.viz-combo-type').val(s.type).trigger('change');
        $r.find('.viz-combo-col').val(s.col).trigger('change');
        $r.find('.viz-combo-agg').val(s.agg).trigger('change');
        $r.find('.viz-combo-fexpr').val(s.filterExpression).trigger('input');
        $r.find('.viz-combo-values').val('none').trigger('change');
        $r.find('.viz-combo-color').val(s.color).trigger('change');
      });
      // Fiscal years in order, as the ?id=dodnsa chart sorts them.
      $('#vizSortBy').val('label').trigger('change');
      $('#vizSortDir').val('asc').trigger('change');
      $('#vizStacked').prop('checked', true).trigger('change');
      eq('B3 ticking Stack Data shows the Stack column (header and rows)',
        [$('#vizComboSeriesList').hasClass('viz-combo-stacked'), $('#vizComboSeriesList .viz-combo-series-header .viz-combo-stack').css('display') || 'missing',
         rows$().eq(0).find('.viz-combo-stack').css('display') || 'missing'], [true, 'block', 'block']);
      // 2026-10-06: at 46px the "STACK" header's ? icon overran the "AGG" header.
      // The series list lives on the type tab ("Combo options") - open it, as a
      // user does, or nothing on it is laid out.
      $('#vizTabType').trigger('click');
      var hS = document.querySelector('#vizComboSeriesList .viz-combo-series-header .viz-combo-stack');
      var hI = hS && hS.querySelector('.bld-help-icon');
      var hA = document.querySelector('#vizComboSeriesList .viz-combo-series-header .viz-combo-agg');
      var hGap = (hI && hA) ? Math.round(hA.getBoundingClientRect().left - hI.getBoundingClientRect().right) : null;
      // >= 4px of clear space: at 46px the icon ran right up to "AGG" (gap 0).
      var hR = function (e) { if (!e) return null; var r = e.getBoundingClientRect(); return [Math.round(r.left), Math.round(r.right)]; };
      assert('B3b the Stack header and its ? icon end at least 4px before the Agg header', hGap !== null && hGap >= 4,
        'gap ' + hGap + 'px; stack cell ' + JSON.stringify(hR(hS)) + ' icon ' + JSON.stringify(hR(hI)) + ' agg ' + JSON.stringify(hR(hA)) +
        ' stack text w ' + (hS ? hS.scrollWidth : null) + ' icon css ' + (hI ? getComputedStyle(hI).position + '/' + getComputedStyle(hI).display + '/' + getComputedStyle(hI).width : null));
      eq('B4 every row starts on Stack 1; a line row hides and disables its picker',
        stackCells(), [['1', 'visible', false], ['1', 'visible', false], ['1', 'visible', false], ['1', 'visible', false], ['1', 'hidden', true], ['1', 'hidden', true]]);
      eq('B5 Stack to 100% stays hidden on a combo', $('#vizStackOptionsWrap').css('display'), 'none');
      rows$().eq(2).find('.viz-combo-stack').val('2').trigger('change');
      rows$().eq(3).find('.viz-combo-stack').val('2').trigger('change');
      // Bar -> Line -> Bar on a row shows, hides and shows its picker again.
      var $t = rows$().eq(1).find('.viz-combo-type');
      $t.val('line').trigger('change'); var hidLine = rows$().eq(1).find('.viz-combo-stack').css('visibility');
      $t.val('bar').trigger('change'); var shownBar = rows$().eq(1).find('.viz-combo-stack').css('visibility');
      eq('B6 switching a row to Line hides its picker, back to Bar shows it', [hidLine, shownBar], ['hidden', 'visible']);
      eq('B7 Right Y Label is hidden until Dual Y-Axis is ticked', $('#vizY2AxisLabelWrap').length ? $('#vizY2AxisLabelWrap')[0].style.display : 'missing', 'none');
      $('#vizDualAxis').prop('checked', true).trigger('change');
      eq('B8 ...and shown once it is', $('#vizY2AxisLabelWrap').length ? $('#vizY2AxisLabelWrap')[0].style.display !== 'none' : 'missing', true);
      $('#vizY2AxisLabel').val('Number of awards').trigger('input');
      var cfg = window.getComboSeriesConfig();
      eq('B9 the series list saves "stack" only for bars off Stack 1', cfg.map(function (s) { return s.stack === undefined ? null : s.stack; }), [null, null, '2', '2', null, null]);
      eq('B10 the options carry y2Label', F.collectOpts('combo').y2Label, 'Number of awards');
      window.vizRunLiveUpdate();
      pv = Chart.getChart('vizChart');
      assert('B11 the builder drew a preview', !!pv, 'no chart on #vizChart');
      if (pv) {
        eq('B12 the PREVIEW stacks (it used to force a combo unstacked)', [pv.options.scales.x.stacked, pv.options.scales.y.stacked], [true, true]);
        eq('B13 the preview groups the bars by stack and keeps each line alone on the right axis',
          pv.data.datasets.map(function (ds) { return [ds.stack, ds.yAxisID || 'y']; }),
          [['grp1', 'y'], ['grp1', 'y'], ['grp2', 'y'], ['grp2', 'y'], ['__line4', 'y2'], ['__line5', 'y2']]);
        eq('B14 the preview titles the right axis', [pv.options.scales.y2.title.display, pv.options.scales.y2.title.text], [true, 'Number of awards']);
      }
      code = window.vizBuildCodeFromForm();
      F.setSnippet(code);
      var en = F.enumVis();
      var c0 = en && en[0] && en[0].config;
      assert('B15 the builder emits one vis() call the app can parse', !!c0, code.slice(0, 200));
      if (c0) {
        eq('B16 ...stacked, Dual Y-Axis, Stack 2 on the R&D bars, y2Label in the options, no Group By stack options',
          [c0.type, c0.stacked, c0.horizontal, (c0.comboSeries || []).map(function (s) { return s.stack || null; }),
           JSON.parse(c0.vizOptions || '{}').y2Label || null, c0.normalize, c0.stackOrder],
          ['combo', true, true, [null, null, '2', '2', null, null], 'Number of awards', false, 'default']);
      }
    });

    // ---------------- X: the report renders exactly what the builder previewed -----------
    var rc = null, rcv = null;
    await asection('X', async function () {
      if (!code) { assert('X0 a vis() call to render', false, 'section B produced none'); return; }
      $('#reportSnippetOutput').empty();
      F.setSnippet(code);
      await F.renderSnippet(ROWS, false, { ignorePendingViewState: true });
      for (var w = 0; w < 40 && !document.querySelector('#reportSnippetOutput canvas'); w++) await tick(50);
      rcv = document.querySelector('#reportSnippetOutput canvas');
      rc = rcv && Chart.getChart(rcv);
      assert('X1 the report rendered the chart', !!rc, $('#reportSnippetOutput').text().slice(0, 200));
      if (rc && pv) {
        eq('X2 report datasets = preview datasets (label, type, stack, axis, values)', dsSig(rc), dsSig(pv));
        eq('X3 report axes = preview axes (stacking, right-axis title)', scaleSig(rc), scaleSig(pv));
        eq('X4 ...and both are the design: stacked, titled right axis', scaleSig(rc), [true, true, [true, 'Number of awards']]);
        var rx = function (di) { return Math.round(fin(rc, di, 1).x); };
        assert('X5 in the report, FY 2025 shows two stacked columns', rx(0) === rx(1) && rx(2) === rx(3) && rx(0) !== rx(2),
          JSON.stringify([rx(0), rx(1), rx(2), rx(3)]));
        eq('X6 the report\'s years run in order and its count lines read 3/2/2 and 2/1/1',
          [rc.data.labels, rc.data.datasets.slice(4).map(function (ds) { return ds.data; })], [['FY 2024', 'FY 2025', 'FY 2026'], WANT_COUNTS]);
      }
    });

    // ---------------- O: re-open the rendered chart in the builder (the double-click path) -
    section('O', function () {
      var cfg = rcv && $(rcv).data('vizConfig');
      if (!cfg) { assert('O0 the rendered canvas carries its config', false, 'no vizConfig on the canvas'); return; }
      openBuilder();
      F.restore(cfg);
      eq('O1 re-opened: Stack Data and Dual Y-Axis ticked, Stack Data enabled, Stack column shown',
        [$('#vizStacked').is(':checked'), $('#vizStacked').prop('disabled'), $('#vizDualAxis').is(':checked'), $('#vizComboSeriesList').hasClass('viz-combo-stacked')],
        [true, false, true, true]);
      eq('O2 re-opened: every row\'s Stack number is back (lines hidden)',
        stackCells(), [['1', 'visible', false], ['1', 'visible', false], ['2', 'visible', false], ['2', 'visible', false], ['1', 'hidden', true], ['1', 'hidden', true]]);
      eq('O3 re-opened: Right Y Label is back and shown',
        [$('#vizY2AxisLabel').val(), $('#vizY2AxisLabelWrap').length ? $('#vizY2AxisLabelWrap')[0].style.display !== 'none' : 'missing'], ['Number of awards', true]);
      F.setSnippet(window.vizBuildCodeFromForm());
      var again = F.enumVis()[0].config, first = (function () { F.setSnippet(code); return F.enumVis()[0].config; })();
      eq('O4 re-opened and re-emitted: the same chart (type, stacking, axis, series, options)',
        [again.type, again.stacked, again.horizontal, again.comboSeries, again.vizOptions],
        [first.type, first.stacked, first.horizontal, first.comboSeries, first.vizOptions]);
      // Unticking Stack Data drops the stack keys and the column.
      $('#vizStacked').prop('checked', false).trigger('change');
      eq('O5 unticking Stack Data hides the column and saves no stack keys',
        [$('#vizComboSeriesList').hasClass('viz-combo-stacked'), window.getComboSeriesConfig().some(function (s) { return 'stack' in s; })], [false, false]);
      // Dual Y-Axis off: the label hides and is not emitted.
      $('#vizDualAxis').prop('checked', false).trigger('change');
      eq('O6 Dual Y-Axis off: Right Y Label hidden and not in the options',
        [$('#vizY2AxisLabelWrap')[0].style.display, F.collectOpts('combo').y2Label === undefined], ['none', true]);
    });

    // ---------------- N: Group By's stack options never ride a combo ----------------------
    section('N', function () {
      openBuilder();
      $('#vizXAxis').val('FY').trigger('change');
      $('.viz-type-option[data-type="bar"]').trigger('click');
      $('#vizGroupBy').val('NSA').trigger('change');
      $('#vizStacked').prop('checked', true).trigger('change');
      $('#vizStackNormalize').prop('checked', true).trigger('change');
      var nonDefault = $('#vizStackOrder option').map(function () { return this.value; }).get().filter(function (v) { return v && v !== 'default'; })[0];
      if (nonDefault) $('#vizStackOrder').val(nonDefault).trigger('change');
      $('.viz-type-option[data-type="combo"]').trigger('click');
      eq('N1 arriving at a combo clears Stack to 100% and Stack Order', [$('#vizStackNormalize').is(':checked'), $('#vizStackOrder').val()], [false, 'default']);
      // Force both back on behind the form's back: the emitted call still carries neither.
      $('#vizStacked').prop('checked', true).trigger('change');
      $('#vizStackNormalize').prop('checked', true);
      if (nonDefault) $('#vizStackOrder').val(nonDefault);
      F.setSnippet(window.vizBuildCodeFromForm());
      var c = F.enumVis()[0].config;
      eq('N2 a stacked combo\'s vis() call never carries Stack to 100% or a Stack Order', [c.stacked, c.normalize, c.stackOrder], [true, false, 'default']);
      F.updateStackOptions();
      eq('N3 updateStackOptions keeps Stack to 100% hidden on a stacked combo', $('#vizStackOptionsWrap').css('display'), 'none');
    });

    // ---------------- T: the Stack Data tip ------------------------------------------------
    section('T', function () {
      openBuilder();
      var $chip = $('#vizStackedWrap .viz-chip');
      var orig = $chip.attr('data-tip');
      $('#vizXAxis').val('FY').trigger('change');
      $('.viz-type-option[data-type="bar"]').trigger('click');
      $('#vizGroupBy').val('').trigger('change');   // bar with no group: the "Disabled - ..." tip goes on
      var disabledTip = $chip.attr('data-tip');
      $('.viz-type-option[data-type="combo"]').trigger('click');
      eq('T1 a combo puts the real Stack Data tip back (not the Group By "Disabled" one)',
        [/^Disabled/.test(disabledTip || ''), $chip.attr('data-tip') === orig], [true, true]);
      assert('T2 the Stack Data tip explains the combo case', /Combo/.test($chip.attr('data-tip') || ''), $chip.attr('data-tip'));
    });

    report('RESULTS_JSON:' + JSON.stringify({ pageErrors: window.__errors.slice(0, 8), dialogs: (window.__dialogs || []).slice(0, 4), results: results }));
  }

  var tries = 0;
  (function wait() {
    tries++;
    if (window.__CS || tries > 60) {
      setTimeout(function () {
        run().catch(function (e) { report('RESULTS_JSON:' + JSON.stringify({ fatal: 'run threw: ' + e + ' ' + String(e.stack || '').split('\n').slice(0, 3).join(' | '), pageErrors: window.__errors.slice(0, 6) })); });
      }, 300);
    } else { setTimeout(wait, 100); }
  })();
})();
</script>
</body></html>
