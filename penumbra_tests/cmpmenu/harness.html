<script>

<script>
  // The live side. ID is the comparison key; AMOUNT and QTY are summarized by
  // default (totalExemptions below is the app's name whitelist) and NAME sits
  // between ID and AMOUNT, so a footer cell that reads its neighbour's header
  // lands on a column that has NO summary.
  window.__COLS = ['ID', 'NAME', 'AMOUNT', 'QTY', 'NOTE'];
  window.__LIVE = [
    { ID: '1', NAME: 'Alpha',   AMOUNT: '$100.00', QTY: '1', NOTE: 'x' },
    { ID: '2', NAME: 'Bravo',   AMOUNT: '$200.00', QTY: '2', NOTE: 'y' },
    { ID: '3', NAME: 'Charlie', AMOUNT: '$300.00', QTY: '3', NOTE: 'z' },
    { ID: '4', NAME: 'Delta',   AMOUNT: '$400.00', QTY: '4', NOTE: 'w' },
    { ID: '5', NAME: 'Echo',    AMOUNT: '$500.00', QTY: '5', NOTE: 'v' },
    { ID: '6', NAME: 'Foxtrot', AMOUNT: '$600.00', QTY: '6', NOTE: 'u' }
  ];
  // The snapshot: 1-2 identical (Unchanged), 3 had another AMOUNT and 4 another
  // QTY (Modified - one modified cell in each summarized column), 5-6 absent
  // (New), 7-8 gone since (Removed).
  window.__SNAP = [
    { ID: '1', NAME: 'Alpha',   AMOUNT: '$100.00', QTY: '1',  NOTE: 'x' },
    { ID: '2', NAME: 'Bravo',   AMOUNT: '$200.00', QTY: '2',  NOTE: 'y' },
    { ID: '3', NAME: 'Charlie', AMOUNT: '$150.00', QTY: '3',  NOTE: 'z' },
    { ID: '4', NAME: 'Delta',   AMOUNT: '$400.00', QTY: '40', NOTE: 'w' },
    { ID: '7', NAME: 'Golf',    AMOUNT: '$700.00', QTY: '7',  NOTE: 't' },
    { ID: '8', NAME: 'Hotel',   AMOUNT: '$800.00', QTY: '8',  NOTE: 's' }
  ];
  window.__QUERY = 'SELECT ID, NAME, AMOUNT, QTY, NOTE FROM CMPFOOT_FIXTURE';
  window.penumbra_vars = {
    isAdmin: true, isGlobalAdmin: true, currentUserKey: 'harness', shibboleth: { ouc: '', dept: '' },
    tables: { oracle: [], pins: [], infoed: [], hr: [], fin: [] },
    imports: [], reports: [], themes: {}, prompts: {}, grants: [],
    totalExemptions: ['AMOUNT', 'QTY']
  };
  window.penumbra_vars.preloadedState = {
    name: 'cmpfoot', query: window.__QUERY, reportTitle: 'Comparison footer fixture',
    theme: 'theme-default', density: 'standard', sortCriteria: [], noLimit: true,
    rowExpandDefault: false, resolverLinksDefault: false, rowsPerPage: '200', reportSnippet: ''
  };
  // query.php answers with the live rows; nothing else is expected to be asked.
  window.__queryDone = 0;
  window.__ajaxLog = [];
  jQuery.ajax = function (a, b) {
    var opts = (typeof a === 'string') ? jQuery.extend({ url: a }, b || {}) : (a || {});
    var url = String(opts.url || '');
    window.__ajaxLog.push(url);
    var d = jQuery.Deferred();
    var isQuery = /query\.php/.test(url);
    var resp = isQuery ? { data: JSON.parse(JSON.stringify(window.__LIVE)) } : {};
    setTimeout(function () {
      try { if (opts.success) opts.success(resp, 'success', { status: 200 }); } catch (e) { window.__errors.push('ajax success threw: ' + String(e)); }
      try { if (opts.complete) opts.complete({ status: 200 }, 'success'); } catch (e) { window.__errors.push('ajax complete threw: ' + String(e)); }
      d.resolve(resp, 'success', { status: 200 });
      if (isQuery) window.__queryDone++;
    }, 0);
    var p = d.promise(); p.abort = function () {}; return p;
  };
  jQuery.getJSON = function (u, x, cb) { return jQuery.ajax({ url: u, success: (typeof x === 'function') ? x : cb }); };
  jQuery.post = function (u, x, cb) { return jQuery.ajax({ url: u, success: (typeof x === 'function') ? x : cb }); };
  jQuery.get = jQuery.post;
  jQuery.fx.off = true;
  window.ResizeObserver = function () { this.observe = function () {}; this.unobserve = function () {}; this.disconnect = function () {}; };
  window.IntersectionObserver = function () { this.observe = function () {}; this.unobserve = function () {}; this.disconnect = function () {}; };
  if (!window.matchMedia) {
    window.matchMedia = function () { return { matches: false, addListener: function () {}, removeListener: function () {}, addEventListener: function () {}, removeEventListener: function () {} }; };
  }
  // Uncaught errors are RECORDED (a real click's handler throwing lands here).
  window.__errors = [];
  window.__rejections = [];
  window.onerror = function (m, src, line) { window.__errors.push(String(m) + ' @' + String(src).split('/').pop() + ':' + line); return true; };
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    window.__rejections.push(String((r && r.message) || r) + ' @' + String((r && r.stack) || '').split('\n').slice(1, 2).join('').trim());
    e.preventDefault();
  });
  window.confirm = function () { return true; };
  window.alert = function () {};
  window.prompt = function () { return null; };
</script>
