<script>
  (function () { try { localStorage.clear(); } catch (e) {} })();
  // ccpill: this browser holds a column layout of its own for the report that is
  // IDENTICAL to the report's saved one - the "custom layout" pill must stay off.
  (function () {
    if (new URLSearchParams(location.search).get('scn') !== 'ccpill') return;
    var names = ['PROTOCOL NO.', 'PROTOCOL TYPE', 'TITLE', 'APPROVAL DATE', 'STATUS', 'AMOUNT'];
    try { localStorage.setItem('penumbra_column_prefs', JSON.stringify({ jrfix: { order: names, visible: names.slice(0, 5), isNumVisible: true } })); } catch (e) {}
  })();
  window.PENUMBRA_THEMES = { 'theme-default': { label: 'Default' } };
  window.PENUMBRA_THEME_IDS = ['theme-default'];
  window.PENUMBRA_THEME_ALIASES = {};
  window.PENUMBRA_LANDING_DEFAULT_THEME = 'theme-default';
  (function () {
    var P = new URLSearchParams(location.search);
    window.__SCN = P.get('scn') || 'flat';
    var S = window.__SCN;
    var SEP = '␟';
    window.__SEP = SEP;
    // --- the fixture: 36 IRB-protocol-like rows ---------------------------
    // PROTOCOL NO. repeats across types (25401 is both Exempt and Expedited), so
    // the key needs PROTOCOL TYPE too - exactly eirbprotsum's composite key.
    var COLS = ['PROTOCOL NO.', 'PROTOCOL TYPE', 'TITLE', 'APPROVAL DATE', 'STATUS', 'AMOUNT'];
    window.__COLS = COLS;
    var W = ['Alpha', 'Bravo', 'Charlie', 'Delta', 'Echo', 'Foxtrot', 'Golf', 'Hotel', 'India'];
    var rows = [];
    for (var i = 1; i <= 36; i++) {
      var r = {};
      r['PROTOCOL NO.'] = String(25400 + (i % 18));
      r['PROTOCOL TYPE'] = i <= 18 ? 'Exempt' : (i <= 30 ? 'Expedited' : 'Amendment/Renewal');
      r['TITLE'] = W[i % W.length] + ' study ' + i;
      r['APPROVAL DATE'] = (1 + (i % 12)) + '/' + (1 + (i % 27)) + '/2026';
      r['STATUS'] = (i % 4 === 0) ? 'Closed' : 'Approved';
      r['AMOUNT'] = '$' + (1000 + i * 37) + '.00';   // currency: the footer sums it when shown
      rows.push(r);
    }
    window.__rowsFixture = rows;
    window.__keyOf = function (r) { return r['PROTOCOL NO.'] + SEP + r['PROTOCOL TYPE']; };
    // --- the journal "server" -------------------------------------------
    // Two rows already marked Reviewed, one row with two notes.
    var K3 = window.__keyOf(rows[2]), K5 = window.__keyOf(rows[22]);   // 25403 Exempt, 25405 Expedited
    window.__J = {
      toggles: { toggle1: {} },
      counts: {}, notes: {},
      posts: []
    };
    window.__J.toggles.toggle1[K3] = { by: 'pat', at: '2026-10-01 09:00:00' };
    window.__J.toggles.toggle1[K5] = { by: 'lee', at: '2026-10-01 10:30:00' };
    window.__J.counts[K3] = 2;
    window.__J.notes[K3] = [
      { ID: 901, REPORT_ID: 7, SCOPE: 'row', ROW_KEY: K3, NOTE_TEXT: 'First look done.', CREATED_BY: 'pat', CREATED_AT: '2026-10-01 09:05:00', PARENT_ID: null },
      { ID: 902, REPORT_ID: 7, SCOPE: 'row', ROW_KEY: K3, NOTE_TEXT: 'Follow up next week.', CREATED_BY: 'lee', CREATED_AT: '2026-10-01 11:00:00', PARENT_ID: null }
    ];
    window.__MARKED = [K3, K5];
    window.__NOTED = K3;
    // --- the scenario's stored report ------------------------------------
    var order = []; for (var c = 0; c < COLS.length; c++) order.push(c);
    var vo = { journalEnabled: true, journalKeyColumns: ['PROTOCOL NO.', 'PROTOCOL TYPE'],
               journalToggles: [{ key: 'toggle1', label: 'Reviewed' }], journalRowNotes: true };
    var st = {
      name: 'jrfix', query: 'SELECT * FROM JR_FIXTURE', reportTitle: 'Journal row features fixture',
      theme: 'theme-default', density: 'standard',
      visibleColumns: ['#', 0, 1, 2, 3, 4], columnOrder: order,
      sortCriteria: [], noLimit: true, rowExpandDefault: false, resolverLinksDefault: true,
      rowsPerPage: '200', reportSnippet: '', viewOptions: vo
    };
    // eirbprotsum's shape: saved GROUPED by PROTOCOL TYPE, '#' not among the shown columns.
    if (S === 'grouped' || S === 'ungroup' || S === 'clickgrp' || S === 'notegrp' || S === 'hashshown' || S === 'cfggrp') {
      st.groupBy = 'PROTOCOL TYPE';
      st.visibleColumns = (S === 'hashshown') ? ['#', 1, 0, 2, 3, 4] : [1, 0, 2, 3, 4];
    }
    // Saved GROUPED BY the toggle column (round 2, 2026-10-02), '#' hidden as on
    // eirbprotsum: by its label (what the picker offers), by its sentinel, nested
    // under PROTOCOL TYPE both ways; and a toggle LABELLED like a real column.
    var BYTOGGLE = { bytoggle: 'Reviewed', bylate: 'Reviewed', flipgrp: 'Reviewed', flipkbd: 'Reviewed', notewait: 'Reviewed',
                     dblflip: 'Reviewed', flipsearch: 'Reviewed', bysentinel: '__JOURNAL_TOGGLE__toggle1',
                     nested: 'PROTOCOL TYPE,Reviewed', nestedsent: 'PROTOCOL TYPE,__JOURNAL_TOGGLE__toggle1', shadow: 'STATUS' };
    if (BYTOGGLE[S]) { st.groupBy = BYTOGGLE[S]; st.visibleColumns = [1, 0, 2, 3, 4]; }
    if (S === 'shadow') vo.journalToggles = [{ key: 'toggle1', label: 'STATUS' }];
    // Round 3 (2026-10-02): a tick that CREATES a band (no row marked yet; every
    // row marked) or EMPTIES one (the only mark); bands created by state landing
    // after the build, on a grouping saved "start expanded to: all levels".
    if (S === 'firsttick' || S === 'nestfirst') window.__J.toggles.toggle1 = {};
    if (S === 'lasttick' || S === 'lastdesc') { var _k3 = window.__keyOf(rows[2]), _one = {}; _one[_k3] = window.__J.toggles.toggle1[_k3]; window.__J.toggles.toggle1 = _one; }
    if (S === 'lastdesc') { st.groupBy = 'Reviewed'; st.visibleColumns = [1, 0, 2, 3, 4]; st.groupSort = { key: 'label', dir: 'desc' }; }
    if (S === 'alltick') rows.forEach(function (r) { window.__J.toggles.toggle1[window.__keyOf(r)] = { by: 'pat', at: '2026-10-01 09:00:00' }; });
    if (S === 'firsttick' || S === 'lasttick' || S === 'alltick' || S === 'latebands') { st.groupBy = 'Reviewed'; st.visibleColumns = [1, 0, 2, 3, 4]; }
    if (S === 'nestfirst') { st.groupBy = 'PROTOCOL TYPE,Reviewed'; st.visibleColumns = [1, 0, 2, 3, 4]; }
    if (S === 'latebands') st.groupStartDepth = 3;
    // A summary footer (AMOUNT sums) with '#' hidden - the footer holds visible columns only.
    if (S === 'footer') st.visibleColumns = [0, 1, 2, 3, 4, 5];
    // The setup panel from scratch: journal on, nothing configured yet.
    if (S === 'cfg') { st.viewOptions = { journalEnabled: true }; }
    window.__STORED = st;
    window.penumbra_vars = {
      isAdmin: true, isGlobalAdmin: true, canEditReport: true, currentUserKey: 'harness', shibboleth: { ouc: '', dept: '' },
      tables: { oracle: [], pins: [], infoed: [], hr: [], fin: [] },
      imports: [], reports: [], themes: {}, prompts: {}, grants: [],
      totalExemptions: [],
      journal: { installed: true, enabled: true, total: 0, unseen: 0 },
      journalAccess: true,
      preloadedState: st
    };
    window.__queryResponse = { data: rows };
  })();
  window.__T = {};
  window.__queryDone = 0;
  window.__ajaxLog = [];
</script>

<script>
  // Fake server. query.php -> the fixture; manage_journal.php -> window.__J.
  function __jrJournal(url, opts) {
    var m = /[?&]action=([a-z_]+)/.exec(url);
    var action = m ? m[1] : null, body = null;
    if (!action && opts.data) { try { body = JSON.parse(opts.data); action = body.action; } catch (e) { } }
    var J = window.__J;
    if (action === 'toggles') return { status: 'success', installed: true, toggles: JSON.parse(JSON.stringify(J.toggles)) };
    if (action === 'row_notes') return { status: 'success', counts: JSON.parse(JSON.stringify(J.counts)), notes: JSON.parse(JSON.stringify(J.notes)) };
    if (action === 'summary') return { status: 'success', installed: true, total: 0, unseen: 0 };
    if (action === 'toggle_history') return { status: 'success', events: [] };
    if (action === 'set_toggle' && body) {
      J.posts.push(body);
      var tk = body.toggle_key;
      J.toggles[tk] = J.toggles[tk] || {};
      if (body.state) J.toggles[tk][body.row_key] = { by: 'harness', at: '2026-10-02 12:00:00' };
      else delete J.toggles[tk][body.row_key];
      return { status: 'success', state: body.state ? 1 : 0, by: 'harness' };
    }
    if (body) J.posts.push(body);
    return { status: 'success' };
  }
  jQuery.ajax = function (a, b) {
    var opts = (typeof a === 'string') ? jQuery.extend({ url: a }, b || {}) : (a || {});
    var url = String(opts.url || '');
    window.__ajaxLog.push(url);
    var d = jQuery.Deferred();
    var isQuery = /query\.php/.test(url);
    var isJournal = /manage_journal\.php/.test(url);
    // ?jdelay=N: the journal STATE (toggles / row notes) answers N ms late - after the
    // report has rendered and grouped, as a slow journal fetch does on a fast query.
    var jState = isJournal && /[?&]action=(toggles|row_notes)/.test(url);
    if (jState) window.__jPending = (window.__jPending || 0) + 1;
    var isPeople = /get_email_recipients\.php/.test(url);
    var resp = isQuery ? window.__queryResponse : (isJournal ? __jrJournal(url, opts) : (isPeople ? [{ username: 'pat', name: 'Pat Doe' }, { username: 'paul', name: 'Paul Roe' }] : {}));
    setTimeout(function () {
      try { if (opts.success) opts.success(resp, 'success', { status: 200 }); } catch (e) { window.__errors.push('ajax success threw: ' + String(e)); }
      try { if (opts.complete) opts.complete({ status: 200 }, 'success'); } catch (e) { window.__errors.push('ajax complete threw: ' + String(e)); }
      d.resolve(resp, 'success', { status: 200 });
      if (isQuery) window.__queryDone++;
      if (jState) window.__jPending--;
    }, jState ? (parseInt(new URLSearchParams(location.search).get('jdelay'), 10) || 30) : (isJournal ? 30 : 0));
    var p = d.promise(); p.abort = function () {}; return p;
  };
  jQuery.getJSON = function (u, x, cb) { return jQuery.ajax({ url: u, success: (typeof x === 'function') ? x : cb }); };
  jQuery.post = function (u, x, cb) { return jQuery.ajax({ url: u, success: (typeof x === 'function') ? x : cb }); };
  jQuery.get = jQuery.post;
  jQuery.fx.off = true;
  window.__errors = [];
  window.__rejections = [];
  window.onerror = function (m, src, line) { window.__errors.push(String(m) + ' @' + String(src).split('/').pop() + ':' + line); return true; };
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    window.__rejections.push(String((r && r.message) || r) + ' @' + String((r && r.stack) || '').split('\n').slice(1, 2).join('').trim());
    e.preventDefault();
  });
  window.__confirms = [];
  window.confirm = function (m) { window.__confirms.push(String(m)); return true; };
  window.alert = function (m) { window.__errors.push('alert: ' + m); };
  window.prompt = function () { return null; };
  if (typeof window.stackHeaders !== 'function') window.stackHeaders = function () {};
</script>
