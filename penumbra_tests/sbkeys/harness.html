<!doctype html>
<html><head><meta charset="utf-8"><title>status bar keys</title>
<!-- The REAL stylesheet: a card is shown or hidden by its open class through
     main.css alone, and focus can only land on what is rendered. -->
<link rel="stylesheet" href="main.css">
</head>
<body>
<!-- Status-bar keyboard suite (2026-10-01). The page DOM is the flatfreeze
     harness's (known to boot main.js and run a query through the real render
     path); the status bar's Data, query-time and Cols segments are LIFTED from
     the index.php under test by run.ps1, so every chip and card is the real
     markup. The profile segment holds server-side PHP, so it is a stub below
     with index.php's structure: a real <button> trigger, the card, and the
     admin-tools split menu in its footer. -->
<div id="reportHeaderContainer"><div id="defaultTitleView"></div><div id="reportInfoPanel" style="display:none"></div></div>
<input id="reportTitle" value=""><div id="admWrapper"></div><button id="toggleAdminViewBtn"></button>
<div id="editorTabs"></div><div id="reportSnippetOutput"></div><div id="mainReportSubtitle"></div>
<textarea id="sqlQuery"></textarea><textarea id="reportSnippet"></textarea><textarea id="subquerySql"></textarea>
<button id="executeQuery">Run</button><button id="stopQueryBtn">Stop</button>
<div id="loadingOverlay" style="display:none"><p id="execution-timer"></p><p id="loadingMessage"></p></div>
<div id="importTimestamps"></div>
<div id="resultsHeader" style="height:20px">controls</div>
<div id="table-view-container"><div id="container-parent"><div id="results-wrapper" style="width:900px;height:300px"><table id="resultsTable"><caption class="sr-only">Report results table</caption><thead><tr id="tableHeader"></tr></thead><tbody></tbody></table></div></div></div>
<div id="paginationControls"><select id="rowsPerPageSelector"><option value="25">25</option><option value="50">50</option><option value="100">100</option><option value="200">200</option><option value="all">All</option></select></div>
<div id="errorBox"></div><div id="undo_text_container"></div>
<input id="tableSearch" value="">
<div id="pivot-output-container" style="display:none"></div>
<div id="groupedResultsContainer" style="display:none"></div>
<div id="pivotLightbox" style="display:none">
  <div id="pivot-source-columns"></div>
  <div id="pivot-rows"></div><div id="pivot-cols"></div><div id="pivot-vals"></div>
  <select id="pivot-aggregation-selector"><option value="">-</option><option value="sum">sum</option></select>
  <table><tbody id="pivot-agg-table-body"></tbody></table>
  <button id="generatePivotBtn">Generate</button>
  <button id="copyPivotSnippetBtn">Snippet</button>
</div>
<!-- What the cards' buttons hand off to: the driver counts their clicks. -->
<button id="pivotBtn">Pivot</button><button id="groupTableBtn">Group</button><button id="snapshotBtn">Snapshots</button>
<div id="settingsPanelOverlay"></div>
<div id="settingsPanel">
  <select id="spThemeSelector">
    <option value="report-default">Report Default</option>
    <option value="theme-default">Default</option>
    <option value="theme-dark">Dark</option>
  </select>
  <select id="spDensitySelector">
    <option value="report-default">Report Default</option>
    <option value="standard">Standard</option>
    <option value="compact">Compact</option>
  </select>
  <input type="checkbox" id="spRowExpandToggle"><input type="checkbox" id="spResolverToggle">
  <div class="sp-section sp-columns-section">
    <div class="sp-column-container"><div id="spColumnList" class="sp-column-list"></div></div>
  </div>
  <div class="sp-actions"><button id="spApply">Save Column Layout</button><button id="spReset">Reset</button><span id="spPendingCount"></span></div>
</div>
<div id="resultCount"></div>
<input type="checkbox" id="viewOptionColumns" checked>
<div id="mainReportTitle">Status bar keys</div>
<div id="pnbStatusBar" role="status" aria-label="Report status bar">
  <!-- BAR_SEGMENTS: run.ps1 replaces this block with the Data, query-time and Cols segments lifted from the index.php under test -->
  <div class="sb-seg" id="sbColsSeg"><span id="sbCols"></span></div>
  <!-- /BAR_SEGMENTS -->
  <div class="sb-spring"></div>
  <div class="sb-seg sb-user sb-click" id="sbUserSeg">
    <button type="button" class="sb-user-btn" id="sbUserBtn" aria-expanded="false" aria-controls="sbUserPop" aria-label="Profile and recent reports">
      <span class="sb-ava">H</span><span class="sb-val">Harness</span>
    </button>
    <div class="sb-pop" id="sbUserPop">
      <div class="sb-uhead"><span class="sb-uava">HA</span><div class="sb-uid"><div class="sb-uname">Harness User</div></div></div>
      <div id="sbCurrentSection" style="display:none;"><div class="sb-pop-h sb-mt">Current report</div><div id="sbCurrentList"></div></div>
      <div class="sb-pop-h sb-mt">Your reports</div>
      <div id="sbReportsList"><div class="sb-recent-empty">No other reports opened yet.</div></div>
      <div id="sbSnapPinsSection" style="display:none;"><div class="sb-pop-h sb-mt">Pinned snapshots</div><div id="sbSnapPinsList"></div></div>
      <div class="sb-upop-foot">
        <a href="#" id="sbHomeLink">Home</a>
        <span class="pnb-admsplit">
          <a href="#" id="sbAdmLink">Admin tools</a><button type="button" class="pnb-admsplit-caret" aria-haspopup="menu" aria-expanded="false" title="Choose which admin tool to open">^</button>
          <div class="pnb-admmenu pnb-admmenu-up" role="menu"><a role="menuitem" href="#" id="sbAdmItem1">Repository</a><a role="menuitem" href="#">Grants</a></div>
        </span>
      </div>
    </div>
  </div>
</div>
<button id="saveQuery">Save</button>
<input id="serverSaveTitleInput"><input id="serverSaveSubtitleInput">
<select id="serverSaveTheme"><option value="theme-default">Default</option></select>
<select id="serverSaveDensity"><option value="standard">Standard</option></select>
<pre id="out">running</pre>

<script>
  (function () {
    try { localStorage.clear(); } catch (e) {}
  })();
  window.PENUMBRA_THEMES = {
    'theme-default':  { label: 'Default' },
    'theme-dark':     { label: 'Dark', dark: true }
  };
  window.PENUMBRA_THEME_IDS = ['theme-default', 'theme-dark'];
  window.PENUMBRA_THEME_ALIASES = {};
  window.PENUMBRA_LANDING_DEFAULT_THEME = 'theme-default';
</script>
<script src="jquery-3.7.1.min.js"></script>
<script src="jquery-ui.min.js"></script>
<script src="moment.min.js"></script>
<script src="pako.min.js"></script>
<script src="codemirror.min.js"></script>
<script src="sql.min.js"></script>
<script src="show-hint.js"></script>
<script src="foldcode.js"></script>
<script src="foldgutter.js"></script>
<script src="brace-fold.js"></script>
<script src="comment-fold.js"></script>
<script src="placeholder.js"></script>
<script src="penumbra_snippet_help.js"></script>
<script src="purify.min.js"></script>
<script src="penumbra_template.js"></script>
<script>
  window.penumbra_vars = {
    isAdmin: true, isGlobalAdmin: true, currentUserKey: 'harness', shibboleth: { ouc: '', dept: '' },
    tables: { oracle: [], pins: [], infoed: [], hr: [], fin: [] },
    imports: [], reports: [], themes: {}, prompts: {}, grants: [],
    totalExemptions: ['AMOUNT']
  };
  window.__ajaxLog = [];
  jQuery.ajax = function (a, b) {
    var opts = (typeof a === 'string') ? jQuery.extend({ url: a }, b || {}) : (a || {});
    var url = String(opts.url || '');
    window.__ajaxLog.push(url);
    var d = jQuery.Deferred();
    var resp = {};
    if (/query\.php/.test(url)) resp = window.__queryResponse || { data: [] };
    setTimeout(function () {
      try { if (opts.success) opts.success(resp, 'success', { status: 200 }); } catch (e) { window.__errors.push('ajax success threw: ' + String(e)); }
      try { if (opts.complete) opts.complete({ status: 200 }, 'success'); } catch (e) { window.__errors.push('ajax complete threw: ' + String(e)); }
      d.resolve(resp, 'success', { status: 200 });
    }, 0);
    var p = d.promise(); p.abort = function () {}; return p;
  };
  jQuery.getJSON = function (u, x, cb) { return jQuery.ajax({ url: u, success: (typeof x === 'function') ? x : cb }); };
  jQuery.post = function (u, x, cb) { return jQuery.ajax({ url: u, success: (typeof x === 'function') ? x : cb }); };
  jQuery.get = jQuery.post;
  jQuery.fx.off = true;
  // ?real=1 (real_keys.py, driven over CDP with real rendering) keeps the
  // browser's own ResizeObserver and rAF; --dump-dom renders no frames.
  window.__REAL = /[?&]real=1/.test(location.search);
  if (!window.__REAL) {
    window.ResizeObserver = function () { this.observe = function () {}; this.unobserve = function () {}; this.disconnect = function () {}; };
    window.IntersectionObserver = function () { this.observe = function () {}; this.unobserve = function () {}; this.disconnect = function () {}; };
    window.requestAnimationFrame = function (cb) { return setTimeout(function () { cb(Date.now()); }, 0); };
    window.cancelAnimationFrame = function (id) { clearTimeout(id); };
  }
  if (!window.matchMedia) {
    window.matchMedia = function () { return { matches: false, addListener: function () {}, removeListener: function () {}, addEventListener: function () {}, removeEventListener: function () {} }; };
  }
  window.__errors = [];
  window.__rejections = [];
  window.onerror = function (m, src, line) { window.__errors.push(String(m) + ' @' + String(src).split('/').pop() + ':' + line); return true; };
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    window.__rejections.push(String((r && r.message) || r) + ' @' + String((r && r.stack) || '').split('\n').slice(1, 2).join('').trim());
    e.preventDefault();
  });
  window.confirm = function () { return true; };
  window.alert = function () {};
  window.prompt = function () { return null; };
  // Counts every Escape that reaches the DOCUMENT's capture phase. Registered
  // before main.js, so it runs ahead of main.js's own Escape chain there (which
  // stopImmediatePropagation()s, and would hide a later spy). A card that
  // closes on Escape must keep the key from ever getting here.
  window.__docEsc = 0;
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') window.__docEsc++; }, true);
</script>
<!-- index.php loads both before main.js: the a11y layer (focus rules for
     menus and dialogs) and the profile segment's list engine, without which the
     status bar's init stands down. -->
<script src="penumbra_a11y.js"></script>
<script src="penumbra_userseg.js"></script>
<script src="main_sbk.js"></script>
<script src="driver.js"></script>
</body></html>
