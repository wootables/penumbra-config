heatmap(cell, AMOUNT, curve=log) action(search, 'Find', 'STATUS = Active') abs(-1)

<script>
  window.penumbra_vars = {
    isAdmin: true, isGlobalAdmin: true, currentUserKey: 'harness', shibboleth: { ouc: '060401', dept: 'Harness Dept', fname: 'Hal', lname: 'Harness', email: 'harness@ncsu.edu', unityid: 'harness', emplid: '001234567' },
    tables: { oracle: [], pins: [], infoed: [], hr: [], fin: [] },
    imports: [], reports: [], themes: {}, prompts: {}, grants: [],
    totalExemptions: []
  };
  window.__ajaxLog = [];
  jQuery.ajax = function (a, b) {
    var opts = (typeof a === 'string') ? jQuery.extend({ url: a }, b || {}) : (a || {});
    window.__ajaxLog.push(String(opts.url || ''));
    var d = jQuery.Deferred(), resp = {};
    setTimeout(function () {
      try { if (opts.success) opts.success(resp, 'success', { status: 200 }); } catch (e) { window.__errors.push('ajax success threw: ' + String(e)); }
      try { if (opts.complete) opts.complete({ status: 200 }, 'success'); } catch (e) { window.__errors.push('ajax complete threw: ' + String(e)); }
      d.resolve(resp, 'success', { status: 200 });
    }, 0);
    var p = d.promise(); p.abort = function () {}; return p;
  };
  jQuery.getJSON = function (u, x, cb) { return jQuery.ajax({ url: u, success: (typeof x === 'function') ? x : cb }); };
  jQuery.post = function (u, x, cb) { return jQuery.ajax({ url: u, success: (typeof x === 'function') ? x : cb }); };
  jQuery.get = jQuery.post;
  // real_input.py (?real=1) drives real frames, real pointer input and the
  // real fade animations over CDP. Every other run is --dump-dom, which renders
  // no frames: animations off and the frame-driven APIs stubbed.
  window.__REAL = /[?&]real=1/.test(location.search);
  if (!window.__REAL) {
    jQuery.fx.off = true;
    window.ResizeObserver = function () { this.observe = function () {}; this.unobserve = function () {}; this.disconnect = function () {}; };
    window.IntersectionObserver = function () { this.observe = function () {}; this.unobserve = function () {}; this.disconnect = function () {}; };
    window.requestAnimationFrame = function (cb) { return setTimeout(function () { cb(Date.now()); }, 0); };
    window.cancelAnimationFrame = function (id) { clearTimeout(id); };
  }
  window.__errors = [];
  window.__rejections = [];
  window.onerror = function (m, src, line) { window.__errors.push(String(m) + ' @' + String(src).split('/').pop() + ':' + line); return true; };
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    window.__rejections.push(String((r && r.message) || r));
    e.preventDefault();
  });
  window.confirm = function () { return true; };
  window.alert = function () {};
  window.prompt = function () { return null; };
  // index.php defines this in the split-header layout script; main.js calls it.
  window.stackHeaders = function () {};
  // The console window asks for 0.9 x the screen. A screen narrower than this
  // tab makes the console window the NARROWER of the two, which is the only
  // arrangement where flip/fit against the wrong window shows (P6).
  try {
    Object.defineProperty(window.screen, 'availWidth', { configurable: true, get: function () { return 1000; } });
    Object.defineProperty(window.screen, 'availHeight', { configurable: true, get: function () { return 800; } });
  } catch (e) { window.__errors.push('screen override: ' + e); }
</script>
