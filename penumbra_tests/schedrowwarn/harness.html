<!doctype html>
<html><head><meta charset="utf-8"><title>scheduler row limit warning</title>
<!-- The REAL stylesheet: the grid, the sticky pane, the header's template areas,
     the Rows "None" collapse and the grouped view's sticky bands all live there. -->
<link rel="stylesheet" href="main.css">
</head>
<body>
<!-- Minimal DOM for the Split header-layout suite (2026-09-18). Built from the
     flatfreeze harness (known to boot main.js and run a query through the real
     render path). The page's VERTICAL ORDER is index.php's - header, dock,
     controls bar, stage - because the pane's sticky top and its height cap are
     both derived from what sits above it.

     The header's children are in index.php's order too. #hdrTail is the one
     invention: index.php ends the header with the snippet, so "back where it
     came from" and "appended to the end" would be the same place without it. -->
<div id="headerToggleHandle"></div>
<div id="reportHeaderContainer" role="banner">
  <div id="defaultTitleView" style="display:none"></div>
  <div id="reportInfoPanel">
    <div style="margin-bottom: 7px;"><a class="safe-home-link" href="#">Penumbra</a> &gt; Reports &gt; <a id="pnbCrumbReport" href="#">harness</a></div>
    <h2 id="mainReportTitle">Split layout harness</h2>
    <div id="mainReportSubtitle"></div>
    <div id="pnbSubscribeSlot" style="display:none;"></div>
  </div>
  <p id="dataLoadedTimestamp"></p>
  <div id="importTimestamps"></div>
  <div id="promptInfoContainer"><a href="#" id="resetAllPromptsLink"></a><ul id="promptInfoList"></ul></div>
  <div id="reportSnippetOutput"></div>
  <div id="hdrTail" hidden></div>
</div>
<!-- The admin console, where index.php puts it: between the header and the
     controls bar. main.js shows it for the harness's admin user; the geometry
     phases hide it again (a viewer's page, or a closed console). -->
<div id="admWrapper">
  <input id="reportTitle" value=""><button id="toggleAdminViewBtn"></button>
  <div id="editorTabs"></div>
  <textarea id="sqlQuery"></textarea><textarea id="reportSnippet"></textarea><textarea id="subquerySql"></textarea>
  <button id="executeQuery">Run</button><button id="stopQueryBtn">Stop</button>
  <div id="view-options-tab">
    <!-- LAYOUT_RADIOS: run.ps1 replaces this line with the block lifted from the index.php under test -->
  </div>
</div>
<div id="loadingOverlay" style="display:none"><p id="execution-timer"></p><p id="loadingMessage"></p></div>
<div id="errorBox"></div>
<div id="snapAnalysisDock"></div>
<!-- Row-limit suite (2026-09-25): the row count sits where index.php has it, in
     the controls bar's left side (hidden by main.css; the status bar mirrors it),
     and the limiter toggle is the hidden viewer shim index.php ships. -->
<div style="display:none"><button id="toggleLimitBtn" class="toolbar-icon is-active"></button></div>
<div id="resultsHeader"><div class="header-left"><input id="tableSearch" value=""><span id="resultCount"></span></div><div id="paginatorContainer"><div id="paginationControls"><select id="rowsPerPageSelector"><option value="25">25</option><option value="50">50</option><option value="100">100</option><option value="all" selected>All</option><option value="none">None</option></select></div></div><div class="header-right"></div></div>
<!-- STAGE_OPEN: run.ps1 puts index.php's own <div id="pnbSplitStage"> here when it has one -->
<div id="table-view-container"><table id="resultsTable"><caption class="sr-only">Report results table</caption><thead><tr id="tableHeader"></tr></thead><tbody></tbody></table><div id="groupedResultsContainer"></div><div id="pivot-output-container"></div></div>
<!-- STAGE_CLOSE: run.ps1 puts index.php's own <aside id="pnbSplitPane"> and the stage's </div> here -->
<div id="undo_text_container"></div>
<div id="pivotLightbox" style="display:none">
  <div id="pivot-source-columns"></div>
  <div id="pivot-rows"></div><div id="pivot-cols"></div><div id="pivot-vals"></div>
  <select id="pivot-aggregation-selector"><option value="">-</option><option value="sum">sum</option></select>
  <table><tbody id="pivot-agg-table-body"></tbody></table>
  <button id="generatePivotBtn">Generate</button>
  <button id="copyPivotSnippetBtn">Snippet</button>
</div>
<div id="settingsPanelOverlay"></div>
<div id="settingsPanel" style="display:none">
  <select id="spThemeSelector">
    <option value="report-default">Report Default</option>
    <option value="theme-default">Default</option>
    <option value="theme-dark">Dark</option>
  </select>
  <select id="spDensitySelector">
    <option value="report-default">Report Default</option>
    <option value="standard">Standard</option>
    <option value="compact">Compact</option>
  </select>
  <input type="checkbox" id="spRowExpandToggle"><input type="checkbox" id="spResolverToggle">
  <div class="sp-section sp-columns-section">
    <div class="sp-column-container"><div id="spColumnList" class="sp-column-list"></div></div>
  </div>
  <div class="sp-actions"><button id="spApply">Save Column Layout</button><button id="spReset">Reset</button><span id="spPendingCount"></span></div>
</div>
<!-- The status bar is position:fixed and both height caps subtract it. -->
<div id="pnbStatusBar">
  <!-- SB_LEAD: run.ps1 puts the status bar's lead segment (row count + row-limit icon), lifted from the index.php under test, here -->
  <div class="sb-seg" id="sbColsSeg"><span id="sbCols"></span></div>
  <div class="sb-seg" id="sbUserSeg"></div>
</div>
<!-- Scheduler row-limit banner suite (2026-10-02): the banner, lifted from the
     index.php under test, plus the scheduler controls updateSchedRowLimitWarning()
     reads (the event type and DB_DUMP's row-mode radios + cap box). The inline
     script keeps the banner's SHIPPED words before main.js can rewrite them. -->
<div id="schedHarness">
  <select id="schedEventType"><option value="EMAIL" selected>EMAIL</option><option value="DB_DUMP">DB_DUMP</option></select>
  <input type="radio" name="schedDbDumpRowMode" value="all"><input type="radio" name="schedDbDumpRowMode" value="enforce" checked>
  <input type="number" id="schedDbDumpRowLimit" value="200">
  <!-- SCHED_WARN: run.ps1 puts index.php's #schedRowLimitWarning here -->
</div>
<script>window.__shipText = (function () { var w = document.getElementById('schedRowLimitWarning'); return w ? w.textContent : ''; })();</script>
<button id="saveQuery" style="display:none">Save</button>
<input id="serverSaveTitleInput" style="display:none"><input id="serverSaveSubtitleInput" style="display:none">
<select id="serverSaveTheme" style="display:none"><option value="theme-default">Default</option></select>
<select id="serverSaveDensity" style="display:none"><option value="standard">Standard</option></select>
<pre id="out" style="display:none">running</pre>

<script>
  (function () {
    try { localStorage.clear(); } catch (e) {}
  })();
  window.PENUMBRA_THEMES = {
    'theme-default':  { label: 'Default' },
    'theme-dark':     { label: 'Dark', dark: true }
  };
  window.PENUMBRA_THEME_IDS = ['theme-default', 'theme-dark'];
  window.PENUMBRA_THEME_ALIASES = {};
  window.PENUMBRA_LANDING_DEFAULT_THEME = 'theme-default';
</script>
<script src="jquery-3.7.1.min.js"></script>
<script src="jquery-ui.min.js"></script>
<script src="moment.min.js"></script>
<script src="pako.min.js"></script>
<script src="codemirror.min.js"></script>

<script src="foldgutter.js"></script>
<script src="brace-fold.js"></script>
<script src="comment-fold.js"></script>

<script src="penumbra_template.js"></script>
<script>
  window.penumbra_vars = {
    isAdmin: true, isGlobalAdmin: true, currentUserKey: 'harness', shibboleth: { ouc: '', dept: '' },
    tables: { oracle: [], pins: [], infoed: [], hr: [], fin: [] },
    imports: [], reports: [], themes: {}, prompts: {}, grants: [],
    totalExemptions: ['AMOUNT']
  };
  window.__ajaxLog = [];
  jQuery.ajax = function (a, b) {
    var opts = (typeof a === 'string') ? jQuery.extend({ url: a }, b || {}) : (a || {});
    var url = String(opts.url || '');
    window.__ajaxLog.push(url);
    var d = jQuery.Deferred();
    var resp = {};
    if (/query\.php/.test(url)) resp = window.__queryResponse || { data: [] };
    setTimeout(function () {
      try { if (opts.success) opts.success(resp, 'success', { status: 200 }); } catch (e) { window.__errors.push('ajax success threw: ' + String(e)); }
      try { if (opts.complete) opts.complete({ status: 200 }, 'success'); } catch (e) { window.__errors.push('ajax complete threw: ' + String(e)); }
      d.resolve(resp, 'success', { status: 200 });
    }, 0);
    var p = d.promise(); p.abort = function () {}; return p;
  };
  jQuery.getJSON = function (u, x, cb) { return jQuery.ajax({ url: u, success: (typeof x === 'function') ? x : cb }); };
  jQuery.post = function (u, x, cb) { return jQuery.ajax({ url: u, success: (typeof x === 'function') ? x : cb }); };
  jQuery.get = jQuery.post;
  jQuery.fx.off = true;
  // --dump-dom renders no frames, so a real ResizeObserver never calls back and
  // rAF never fires. Layout itself IS computed on demand (getBoundingClientRect,
  // sticky offsets after a scrollTo), which is all the geometry phases need. The
  // driver makes the calls an observer would have made.
  window.__roObserved = [];
  window.ResizeObserver = function () {
    this.observe = function (el) { window.__roObserved.push(el); };
    this.unobserve = function () {};
    this.disconnect = function () {};
  };
  window.IntersectionObserver = function () { this.observe = function () {}; this.unobserve = function () {}; this.disconnect = function () {}; };
  window.requestAnimationFrame = function (cb) { return setTimeout(function () { cb(Date.now()); }, 0); };
  window.cancelAnimationFrame = function (id) { clearTimeout(id); };
  if (!window.matchMedia) {
    window.matchMedia = function () { return { matches: false, addListener: function () {}, removeListener: function () {}, addEventListener: function () {}, removeEventListener: function () {} }; };
  }
  window.__errors = [];
  window.__rejections = [];
  window.onerror = function (m, src, line) { window.__errors.push(String(m) + ' @' + String(src).split('/').pop() + ':' + line); return true; };
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    window.__rejections.push(String((r && r.message) || r) + ' @' + String((r && r.stack) || '').split('\n').slice(1, 2).join('').trim());
    e.preventDefault();
  });
  window.confirm = function () { return true; };
  window.alert = function () {};
  window.prompt = function () { return null; };
</script>
<script src="penumbra_userseg.js"></script>
<script src="main_sl.js"></script>
<script src="driver.js"></script>
</body></html>
