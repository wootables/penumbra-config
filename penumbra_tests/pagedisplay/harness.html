<!-- lazyrows suite (2026-09-30) - the hiddencols fixture (300 rows, 6 visible
     columns incl. money with a totals row and @@HTML links, 14 hidden ones of
     every value shape). The REAL main.js through the REAL run path (a stubbed
     query.php). ?scn=<name> picks the stored report state; driver.js runs that
     scenario and publishes FINGERPRINTS of everything a user, an export or a
     copy could observe. run.py loads each scenario against the BASELINE build
     (every row built in full) and the CANDIDATE (lazy rows) and requires them
     to be identical. -->

<script>
  (function () { try { localStorage.clear(); } catch (e) {} })();
  window.PENUMBRA_THEMES = { 'theme-default': { label: 'Default' } };
  window.PENUMBRA_THEME_IDS = ['theme-default'];
  window.PENUMBRA_THEME_ALIASES = {};
  window.PENUMBRA_LANDING_DEFAULT_THEME = 'theme-default';
  (function () {
    var P = new URLSearchParams(location.search);
    window.__SCN = P.get('scn') || 'boot';
    // --- the fixture (the hiddencols suite's, unchanged) -------------------
    var COLS = [
      'V_ID', 'V_NAME', 'V_AMOUNT', 'V_DATE', 'V_LINK', 'V_STATUS',            // 0-5 visible
      'H_TEXT', 'H_NUM', 'H_MONEY', 'H_DATE', 'H_HTML', 'H_JSON', 'H_ENT',     // 6-12 hidden
      'H_NL', 'H_NULL', 'H_GROUP', 'H_GROUP2', 'H_AMT', 'H_FLAG', 'H_CODE'     // 13-19 hidden
    ];
    window.__COLS = COLS;
    var seed = 20260930;
    function rnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }
    function pick(a) { return a[Math.floor(rnd() * a.length)]; }
    var W = ['Alpha', 'Bravo', 'Charlie', 'Delta', 'Echo', 'Foxtrot', 'Golf', 'Hotel', 'India', 'Juliet', 'Kilo', 'Lima'];
    function money() { return '$' + (rnd() * 90000 + 100).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
    function date() { var d = new Date(2021, 0, 1 + Math.floor(rnd() * 1500)); return (d.getMonth() + 1) + '/' + d.getDate() + '/' + d.getFullYear(); }
    function link() { var id = String(400000 + Math.floor(rnd() * 99999)); return '@@HTML<a href="https://oitras.oit.ncsu.edu/resolver/103?id=' + id + '" target="_new" title="View the project record (requires proper access)" class="resolver-link">' + id + '</a>'; }
    var rows = [];
    var N = parseInt(P.get('rows'), 10) || 300;   // heatbench: 1,001 rows
    for (var i = 1; i <= N; i++) {
      var r = {};
      r.V_ID = 'ID-' + String(1000 + i);
      r.V_NAME = pick(W) + ' ' + pick(W);
      r.V_AMOUNT = money();
      r.V_DATE = date();
      r.V_LINK = link();
      r.V_STATUS = pick(['Open', 'Closed', 'Pending']);
      r.H_TEXT = pick(W) + ' ' + pick(W) + ' ' + i;
      r.H_NUM = String(Math.floor(rnd() * 1000));
      r.H_MONEY = money();
      r.H_DATE = date();
      r.H_HTML = link();
      var sub = []; for (var k = 0, n = 1 + Math.floor(rnd() * 3); k < n; k++) sub.push({ SUB_ID: 'S' + Math.floor(rnd() * 90), SUB_AMT: Math.floor(rnd() * 5000), SUB_NAME: pick(W) });
      r.H_JSON = (i % 7 === 0) ? null : '@@JSON' + JSON.stringify(sub);
      r.H_ENT = pick(['R&amp;D', 'O&#039;Brien', '&lt;tag&gt;', 'plain', 'A &amp; B &amp; C']);
      r.H_NL = pick(W) + '\n' + pick(W);
      r.H_NULL = (i % 3 === 0) ? null : ((i % 3 === 1) ? '' : pick(W));
      r.H_GROUP = (i % 11 === 0) ? null : pick(['North', 'South', 'East', 'West', 'Central']);
      r.H_GROUP2 = pick(['Tier 1', 'Tier 2', 'Tier 3']);
      r.H_AMT = String(Math.floor(rnd() * 20000) / 100);
      r.H_FLAG = rnd() < 0.3 ? 'Y' : 'N';
      r.H_CODE = pick(['AB', 'CD', 'EF', 'GH']) + '-' + Math.floor(rnd() * 99);
      rows.push(r);
    }
    window.__rowsFixture = rows;
    // --- the scenario's stored report ------------------------------------
    var order = []; for (var c = 0; c < COLS.length; c++) order.push(c);
    var st = {
      name: 'lrfix', query: 'SELECT * FROM LR_FIXTURE', reportTitle: 'Lazy rows fixture',
      theme: 'theme-default', density: 'standard',
      visibleColumns: ['#', 0, 1, 2, 3, 4, 5], columnOrder: order,
      sortCriteria: [], noLimit: true, rowExpandDefault: false, resolverLinksDefault: true,
      rowsPerPage: '200', reportSnippet: ''
    };
    var S = window.__SCN;
    // pagedisplay suite (2026-10-01): 25 rows a page, so a search that keeps ~100
    // of 300 rows spans four pages; Rows = All / None keep every match displayed.
    if (S === 'heatbench') { st.rowsPerPage = '200'; st.reportSnippet = 'heatmap(cell, V_AMOUNT)' + String.fromCharCode(10) + 'heatmap(cell, H_AMT)'; }
    else if (S === 'rowsall') st.rowsPerPage = 'all';
    else if (S === 'rowsnone') st.rowsPerPage = 'none';
    else st.rowsPerPage = '25';
    if (S === 'heatpage') st.reportSnippet = 'heatmap(cell, V_AMOUNT, scope=page)';
    if (S === 'heatfiltered') st.reportSnippet = 'heatmap(cell, V_AMOUNT)';
    window.__STORED = st;
    window.penumbra_vars = {
      isAdmin: true, isGlobalAdmin: true, canEditReport: true, currentUserKey: 'harness', shibboleth: { ouc: '', dept: '' },
      tables: { oracle: [], pins: [], infoed: [], hr: [], fin: [] },
      imports: [], reports: [], themes: {}, prompts: {}, grants: [],
      totalExemptions: ['AMOUNT', 'H_AMT', 'H_NUM'],
      preloadedState: st
    };
    window.__queryResponse = { data: rows };
  })();
  window.__T = {};
  window.__queryDone = 0;
  window.__ajaxLog = [];
</script>

<script>
  jQuery.ajax = function (a, b) {
    var opts = (typeof a === 'string') ? jQuery.extend({ url: a }, b || {}) : (a || {});
    var url = String(opts.url || '');
    window.__ajaxLog.push(url);
    var d = jQuery.Deferred();
    var isQuery = /query\.php/.test(url);
    var resp = isQuery ? window.__queryResponse : {};
    setTimeout(function () {
      try { if (opts.success) opts.success(resp, 'success', { status: 200 }); } catch (e) { window.__errors.push('ajax success threw: ' + String(e)); }
      try { if (opts.complete) opts.complete({ status: 200 }, 'success'); } catch (e) { window.__errors.push('ajax complete threw: ' + String(e)); }
      d.resolve(resp, 'success', { status: 200 });
      if (isQuery) window.__queryDone++;
    }, 0);
    var p = d.promise(); p.abort = function () {}; return p;
  };
  jQuery.getJSON = function (u, x, cb) { return jQuery.ajax({ url: u, success: (typeof x === 'function') ? x : cb }); };
  jQuery.post = function (u, x, cb) { return jQuery.ajax({ url: u, success: (typeof x === 'function') ? x : cb }); };
  jQuery.get = jQuery.post;
  jQuery.fx.off = true;
  // Clipboard: capture what the copy paths write - the rich write's text/html too.
  window.__clip = [];
  try {
    Object.defineProperty(navigator, 'clipboard', { configurable: true, value: {
      writeText: function (t) { window.__clip.push(String(t)); return Promise.resolve(); },
      write: function (items) {
        try {
          var it = items && items[0];
          if (it && it.getType) {
            it.getType('text/html').then(function (b) { return b.text(); })
              .then(function (t) { window.__clip.push('[html]' + t); }, function (e) { window.__clipErr = String(e); });
          }
        } catch (e) { window.__clipErr = String(e); }
        return Promise.resolve();
      }
    } });
  } catch (e) { window.__clipErr = String(e); }
  window.__errors = [];
  window.__rejections = [];
  window.onerror = function (m, src, line) { window.__errors.push(String(m) + ' @' + String(src).split('/').pop() + ':' + line); return true; };
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    window.__rejections.push(String((r && r.message) || r) + ' @' + String((r && r.stack) || '').split('\n').slice(1, 2).join('').trim());
    e.preventDefault();
  });
  window.confirm = function () { return true; };
  window.alert = function (m) { window.__errors.push('alert: ' + m); };
  window.prompt = function () { return null; };
  if (typeof window.stackHeaders !== 'function') window.stackHeaders = function () {};
</script>
