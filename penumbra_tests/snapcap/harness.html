<!-- snapcap (2026-10-23): a capture of the page made while a snapshot is on screen as a VIEW over the report - a Save,
     a ?state= link, a link to the view - read the column layout off #tableHeader, which the view has redrawn with the
     SNAPSHOT's columns (all shown, in its captured order, numbered its own way). The ways back to live data handed the
     report its layout back only in the flat case. The snapsort harness (a copy: the report preloaded through
     penumbra_vars.preloadedState and run through the stubbed query.php; the snapshot store stubbed for ?snap= boots;
     the caution icon a person clicks to go back) plus savecmp's Server Save dialog fields and its phase 2 pages.
     The report is saved with a column layout: NAME, ID, NOTE, DEPT shown in that order, AMOUNT and QTY hidden after
     them (columnOrder [2, 0, 5, 1, 3, 4], visibleColumns ['#', 2, 0, 5, 1]), widths for NOTE and NAME, sorted by NOTE
     descending.
     phase 1: ?mode=ov (flat, Load As View) ovg (grouped by DEPT) ovp (a pivot) ovrun (Run from a view) ovlive (a live
              action from a view) ovcol (a column hidden during a view) lz (a ?snap=56 tab)
     phase 2: ?mode=saved (#pre= a Save's posted state, preloaded as a saved report is) state (?state= a link's state)
              view (?id=&view= a link to the view, over the report as saved) -->

<script>
  (function () {
    // every page starts clean (a phase 2 page keeps nothing of phase 1's: the stores below are per page load) -
    // but ?mode=prefs: the viewer's stored column layout phase 1 left (#prefs=), as the next open of the report finds it
    try { localStorage.clear(); sessionStorage.clear(); } catch (e) {}
    try {
      if (/[?&]mode=prefs(&|$)/.test(location.search)) localStorage.setItem('penumbra_column_prefs', decodeURIComponent(String(location.hash).replace(/^#prefs=/, '')));
    } catch (e) { window.__PRE_ERR = String(e); }
  })();
  window.PENUMBRA_THEMES = { 'theme-default': { label: 'Default' } };
  window.PENUMBRA_THEME_IDS = ['theme-default'];
  window.PENUMBRA_THEME_ALIASES = {};
  window.PENUMBRA_LANDING_DEFAULT_THEME = 'theme-default';
  (function () {
    var q = new URLSearchParams(location.search);
    window.__MODE = q.get('mode') || 'ov';
    window.__EXP = q.get('exp') || '';
  })();
</script>

<script>
  // The live side: the report table numbers its columns ID 0, DEPT 1, NAME 2, AMOUNT 3, QTY 4, NOTE 5. Sorted by NOTE
  // descending its rows go 3 2 1 4 5 6; grouped by DEPT: East 3 1, West 2 4, North 5 6.
  window.__COLS = ['ID', 'DEPT', 'NAME', 'AMOUNT', 'QTY', 'NOTE'];
  window.__LIVE = [
    { ID: '1', DEPT: 'East',  NAME: 'Alpha',   AMOUNT: '$100.00', QTY: '1', NOTE: 'x' },
    { ID: '2', DEPT: 'West',  NAME: 'Bravo',   AMOUNT: '$200.00', QTY: '2', NOTE: 'y' },
    { ID: '3', DEPT: 'East',  NAME: 'Charlie', AMOUNT: '$300.00', QTY: '3', NOTE: 'z' },
    { ID: '4', DEPT: 'West',  NAME: 'Delta',   AMOUNT: '$400.00', QTY: '4', NOTE: 'w' },
    { ID: '5', DEPT: 'North', NAME: 'Echo',    AMOUNT: '$500.00', QTY: '5', NOTE: 'v' },
    { ID: '6', DEPT: 'North', NAME: 'Foxtrot', AMOUNT: '$600.00', QTY: '6', NOTE: 'u' }
  ];
  // Snapshot #55: the report's columns, in another row order.
  window.__SNAP = [
    { ID: '1', DEPT: 'East',  NAME: 'Alpha',   AMOUNT: '$100.00', QTY: '1',  NOTE: 'x' },
    { ID: '4', DEPT: 'West',  NAME: 'Delta',   AMOUNT: '$400.00', QTY: '40', NOTE: 'w' },
    { ID: '3', DEPT: 'East',  NAME: 'Charlie', AMOUNT: '$150.00', QTY: '3',  NOTE: 'z' },
    { ID: '2', DEPT: 'West',  NAME: 'Bravo',   AMOUNT: '$200.00', QTY: '2',  NOTE: 'y' },
    { ID: '7', DEPT: 'East',  NAME: 'Golf',    AMOUNT: '$700.00', QTY: '7',  NOTE: 't' },
    { ID: '8', DEPT: 'West',  NAME: 'Hotel',   AMOUNT: '$800.00', QTY: '8',  NOTE: 's' }
  ];
  // Snapshot #56: another query's columns, NOTE first - its table numbers NOTE 0, ID 1, DEPT 2, NAME 3, QTY 4, AMOUNT 5.
  window.__SNAP2 = [
    { NOTE: 'v', ID: '5', DEPT: 'North', NAME: 'Echo',  QTY: '5', AMOUNT: '$500.00' },
    { NOTE: 'x', ID: '1', DEPT: 'East',  NAME: 'Alpha', QTY: '1', AMOUNT: '$100.00' },
    { NOTE: 'y', ID: '2', DEPT: 'West',  NAME: 'Bravo', QTY: '2', AMOUNT: '$200.00' }
  ];
  // Snapshot #57: taken before NOTE existed (ID 0, DEPT 1, NAME 2, AMOUNT 3, QTY 4).
  window.__SNAP3 = [
    { ID: '2', DEPT: 'West', NAME: 'Bravo',   AMOUNT: '$200.00', QTY: '2' },
    { ID: '1', DEPT: 'East', NAME: 'Alpha',   AMOUNT: '$100.00', QTY: '1' },
    { ID: '3', DEPT: 'East', NAME: 'Charlie', AMOUNT: '$300.00', QTY: '3' }
  ];
  // Snapshot #58 (?mode=ovcalc): taken before NOTE existed by a viewer with the calculated column DOUBLE, which sits at
  // its place 5 - the live report's NOTE place (the live run appends DOUBLE at 6).
  window.__SNAP4 = [
    { ID: '2', DEPT: 'West', NAME: 'Bravo',   AMOUNT: '$200.00', QTY: '2', DOUBLE: '4' },
    { ID: '1', DEPT: 'East', NAME: 'Alpha',   AMOUNT: '$100.00', QTY: '1', DOUBLE: '2' },
    { ID: '3', DEPT: 'East', NAME: 'Charlie', AMOUNT: '$300.00', QTY: '3', DOUBLE: '6' }
  ];
  // Snapshot #59 (?mode=nw, snapgrp): taken before AMOUNT and QTY were in the report (ID 0, DEPT 1, NAME 2, NOTE 3).
  window.__SNAP5 = [
    { ID: '3', DEPT: 'East', NAME: 'Charlie', NOTE: 'z' },
    { ID: '1', DEPT: 'East', NAME: 'Alpha',   NOTE: 'x' },
    { ID: '2', DEPT: 'West', NAME: 'Bravo',   NOTE: 'y' }
  ];
  window.__QUERY = 'SELECT ID, DEPT, NAME, AMOUNT, QTY, NOTE FROM SNAPCAP_FIXTURE';
  window.penumbra_vars = {
    isAdmin: true, isGlobalAdmin: true, canEditReport: false, currentUserKey: 'harness', shibboleth: { ouc: '', dept: '', fname: 'Harness' },
    tables: { oracle: [], pins: [], infoed: [], hr: [], fin: [] },
    imports: [], reports: [], themes: {}, prompts: {}, grants: [], reportTags: [],
    totalExemptions: ['AMOUNT', 'QTY']
  };
  // The report's own view: its column layout (by place: NAME 2, ID 0, NOTE 5, DEPT 1 shown, AMOUNT 3 and QTY 4 hidden
  // after them), widths, its sort (NOTE descending, its column 5); grouped: by DEPT, one level open; a pivot: DEPT rows,
  // summed AMOUNT.
  window.__REPORT_ORDER = [2, 0, 5, 1, 3, 4];
  window.__REPORT_VISIBLE = ['#', 2, 0, 5, 1];
  window.__REPORT_WIDTHS = { NOTE: 222, NAME: 150 };
  window.__REPORT_SORT = [{ colIdentifier: 'NOTE', colIndex: 5, direction: 'desc' }];
  window.__REPORT_GROUP = { groupBy: 'DEPT', groupStartDepth: 1 };
  window.__REPORT_PIVOT = { v: 2, rows: ['DEPT'], cols: [], vals: 'AMOUNT', agg: ['sum'], aggLabels: ['Amount'],
    aggColOverrides: ['AMOUNT'], aggFilters: null, aggFormulas: null, rowLayout: 'flat', colLayout: 'nested',
    sortOrder: 'asc', colSortOrder: 'asc', stickyColCount: 1, totalColAggs: null, totalRowAggs: null,
    totalRowAggLabels: null, totalRowAggBaseIdx: null, rankN: null, rankDir: null, rankAgg: null, rankOther: true,
    rankScope: null, noBreakdown: false, startExpanded: false, hideEmpty: false };
  // (snapgrp, 2026-10-24) the grouped report (?mode=gv, lzg): by DEPT, summed AMOUNT, the largest groups first, the
  // top 2 with the rest in Other, one level open - every part a capture writes; the report's own calculated column
  // (?mode=lzc); per-column summaries and widths for the columns snapshot #59 lacks (?mode=nw)
  window.__REPORT_GROUP2 = { groupBy: 'DEPT', groupAgg: { column: 'AMOUNT', type: 'sum' }, groupSort: { key: 'count', dir: 'desc' },
    groupStartDepth: 1, groupLimit: { n: 2, dir: 'top', other: true, minRows: 0 } };
  window.__REPORT_CALC = [{ name: 'DOUBLE', formula: '{QTY}*2', format: 'number' }];
  window.__REPORT_SUMS = { AMOUNT: 'avg', QTY: 'formula' };
  window.__REPORT_FX = { QTY: '{sum}*2' };
  window.__REPORT_WIDTHS_NW = { NOTE: 222, NAME: 150, AMOUNT: 180, QTY: 90 };
  window.__REPORT_PSORT = [{ colIdentifier: 'DEPT', colIndex: 0, direction: 'desc' }];
  function __base() {
    return { name: 'snapcap', query: window.__QUERY, reportTitle: 'Capture during a snapshot view',
             theme: 'theme-default', density: 'standard', sortCriteria: JSON.parse(JSON.stringify(window.__REPORT_SORT)), noLimit: true,
             rowExpandDefault: false, resolverLinksDefault: false, rowsPerPage: '200', reportSnippet: '',
             visibleColumns: window.__REPORT_VISIBLE.slice(), columnOrder: window.__REPORT_ORDER.slice(),
             columnWidths: JSON.parse(JSON.stringify(window.__REPORT_WIDTHS)) };
  }
  (function () {
    var m = window.__MODE, st = null;
    if (m === 'saved') {
      var h = String(location.hash || '');
      try { st = JSON.parse(decodeURIComponent(h.replace(/^#pre=/, ''))); } catch (e) { window.__PRE_ERR = String(e); }
    } else if (m !== 'state') {
      st = __base();
      if (m === 'ovg') { var g = JSON.parse(JSON.stringify(window.__REPORT_GROUP)); Object.keys(g).forEach(function (k) { st[k] = g[k]; }); }
      if (m === 'ovp') { st.pivot = JSON.parse(JSON.stringify(window.__REPORT_PIVOT)); st.sortCriteria = []; }
      // (snapgrp) the report as each new page saves it - a phase 2 link page (?mode=view) over the report as its
      // phase 1 page (exp) had it saved
      var x = (m === 'view') ? window.__EXP : m;
      if (x === 'gv' || x === 'lzg' || x === 'gvf' || x === 'gvc' || x === 'gvce' || x === 'lzgc' || x === 'cmpvg') { var g2 = JSON.parse(JSON.stringify(window.__REPORT_GROUP2)); Object.keys(g2).forEach(function (k) { st[k] = g2[k]; }); }
      // (snapback, 2026-10-24) the grouped report's ways back: a failed load during a view, Compare to Live Data from a
      // view (?snap= tab too), Load As View over a comparison
      if (x === 'gvfg' || x === 'cmpvf' || x === 'clv' || x === 'clvgr' || x === 'lzcl' || x === 'lvc' || x === 'lvcr' || x === 'gvfs' || x === 'lvcf') { var g3 = JSON.parse(JSON.stringify(window.__REPORT_GROUP2)); Object.keys(g3).forEach(function (k) { st[k] = g3[k]; }); }
      // (snapback review) a report saved as a pivot by REGION, a column its query no longer has
      if (x === 'lzclx') { st.pivot = JSON.parse(JSON.stringify(window.__REPORT_PIVOT)); st.pivot.rows = ['REGION']; st.sortCriteria = []; }
      // (the pivot sorted by its DEPT row field, descending: a pivot's sort, which goes with its pivot)
      if (x === 'pv' || x === 'lzp') { st.pivot = JSON.parse(JSON.stringify(window.__REPORT_PIVOT)); st.sortCriteria = JSON.parse(JSON.stringify(window.__REPORT_PSORT)); }
      // (snapback) ...and the pivot report's ways back
      if (x === 'pvf' || x === 'cmpvp' || x === 'clvp' || x === 'clvr' || x === 'lzclp' || x === 'lvcp') { st.pivot = JSON.parse(JSON.stringify(window.__REPORT_PIVOT)); st.sortCriteria = JSON.parse(JSON.stringify(window.__REPORT_PSORT)); }
      // (cmppiv, 2026-10-24) ...its comparisons over the live pivot, a pivot drawn again under a search, Compare to Live
      // Data from a view whose comparison does not render; and the grouped report's (clvf)
      if (/^(lpc|lpab|lpr|lplv|lplvc|lplva|lpx|lpxc|lps|cmpvpz|cmpvpe|clvfp|clvn)$/.test(x)) { st.pivot = JSON.parse(JSON.stringify(window.__REPORT_PIVOT)); st.sortCriteria = JSON.parse(JSON.stringify(window.__REPORT_PSORT)); }
      if (x === 'clvf') { var g4 = JSON.parse(JSON.stringify(window.__REPORT_GROUP2)); Object.keys(g4).forEach(function (k) { st[k] = g4[k]; }); }
      if (x === 'nw' || x === 'lzw') { st.columnSummaries = JSON.parse(JSON.stringify(window.__REPORT_SUMS)); st.columnSummaryFormulas = JSON.parse(JSON.stringify(window.__REPORT_FX));
                        st.columnWidths = JSON.parse(JSON.stringify(window.__REPORT_WIDTHS_NW)); }
      if (x === 'lzc') st.calcColumns = JSON.parse(JSON.stringify(window.__REPORT_CALC));
    }
    if (st) window.penumbra_vars.preloadedState = st;
  })();
  // query.php answers with the live rows; manage_snapshots.php?action=load with a stored snapshot (#55, #56, #57);
  // save_server_state.php's posts are kept.
  window.__queryDone = 0;
  window.__ajaxLog = [];
  window.__posts = [];
  jQuery.ajax = function (a, b) {
    var opts = (typeof a === 'string') ? jQuery.extend({ url: a }, b || {}) : (a || {});
    var url = String(opts.url || '');
    window.__ajaxLog.push(url);
    if (/save_server_state\.php/.test(url)) window.__posts.push({ url: url, data: opts.data });
    var d = jQuery.Deferred();
    var isQuery = /query\.php/.test(url);
    // (?mode=ovcalc0) window.__EMPTY_NEXT: the report's run comes back with no rows
    var resp = isQuery ? { data: window.__EMPTY_NEXT ? [] : JSON.parse(JSON.stringify(window.__LIVE)) } : {};
    if (/save_server_state\.php/.test(url)) {
      var sid = 'snapcap'; try { sid = JSON.parse(opts.data).short_id || sid; } catch (e) {}
      resp = { success: true, new_id: sid, is_new: false, numeric_id: 1 };
    }
    if (/manage_snapshots\.php/.test(url) && /[?&]action=load(&|$)/.test(url)) {
      var snapId = (/[?&]snap_id=(\d+)/.exec(url) || [])[1] || '';
      var srows = snapId === '56' ? window.__SNAP2 : (snapId === '57' ? window.__SNAP3 : (snapId === '59' ? window.__SNAP5 : window.__SNAP));
      resp = { status: 'success', data: { SNAP_DATA: JSON.stringify(srows.map(function (r) { return { rowData: r }; })), SNAP_NAME: 'Stored snapshot ' + snapId,
               CREATED_AT: '2026-10-20T09:00:00', COLUMN_NAMES: Object.keys(srows[0]).join(','), ROW_COUNT: srows.length, COLUMN_COUNT: Object.keys(srows[0]).length,
               REPORT_SHORT_ID: 'snapcap' } };
    }
    setTimeout(function () {
      try { if (opts.success) opts.success(resp, 'success', { status: 200 }); } catch (e) { window.__errors.push('ajax success threw: ' + String(e)); }
      try { if (opts.complete) opts.complete({ status: 200 }, 'success'); } catch (e) { window.__errors.push('ajax complete threw: ' + String(e)); }
      d.resolve(resp, 'success', { status: 200 });
      if (isQuery) window.__queryDone++;
    }, 0);
    var p = d.promise(); p.abort = function () {}; return p;
  };
  jQuery.getJSON = function (u, x, cb) { return jQuery.ajax({ url: u, success: (typeof x === 'function') ? x : cb }); };
  jQuery.post = function (u, x, cb) { return jQuery.ajax({ url: u, success: (typeof x === 'function') ? x : cb }); };
  jQuery.get = jQuery.post;
  jQuery.fx.off = true;
  window.ResizeObserver = function () { this.observe = function () {}; this.unobserve = function () {}; this.disconnect = function () {}; };
  window.IntersectionObserver = function () { this.observe = function () {}; this.unobserve = function () {}; this.disconnect = function () {}; };
  if (!window.matchMedia) {
    window.matchMedia = function () { return { matches: false, addListener: function () {}, removeListener: function () {}, addEventListener: function () {}, removeEventListener: function () {} }; };
  }
  window._pnbClipboard = function () { return { writeText: function () { return Promise.resolve(); } }; };
  window.__errors = [];
  window.__rejections = [];
  window.onerror = function (m, src, line) { window.__errors.push(String(m) + ' @' + String(src).split('/').pop() + ':' + line); return true; };
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    window.__rejections.push(String((r && r.message) || r) + ' @' + String((r && r.stack) || '').split('\n').slice(1, 2).join('').trim());
    e.preventDefault();
  });
  window.confirm = function () { return true; };
  window.alert = function () {};
  window.prompt = function () { return null; };
</script>

<script>
  // ?mode=ovcalc: the calculated columns module, for the viewer's own column the page's &calc= adds. index.php loads
  // it after main.js but before main.js's ready code, which main_cf.js runs at once: so here, before it (ldlayout's way)
  if (window.__MODE === 'ovcalc' || window.__MODE === 'ovcalc0') document.write('<script src="penumbra_calc.js"><\/script>');
  // (snapgrp) ...and for the report's own calculated column (?mode=lzc, and the Save it hands phase 2)
  else if (window.__MODE === 'lzc' || window.__MODE === 'rsvc' || ((window.__MODE === 'saved' || window.__MODE === 'state') && window.__EXP === 'lzc')) document.write('<script src="penumbra_calc.js"><\/script>');
  // (snapback) the pivot builder (index.php's), for the pages whose way back draws the report's pivot again through it
  if (/^(cmpvp|clvp|lzclp|lvcp|lzclx)$/.test(window.__MODE)) {
    (function () {
      var t = document.getElementById('pnbPivotBuilderTpl');
      if (t && t.content) document.body.insertBefore(t.content.cloneNode(true), document.getElementById('out'));
      else window.__errors.push('pivot builder template missing');
    })();
  }
  // (cmppiv) ...and for this round's pivot pages: their ways back draw the report's pivot again through it too
  if (/^(lpc|lpab|lpr|lplv|lplvc|lplva|lpx|lpxc|lps|cmpvpz|cmpvpe|clvfp|clvn)$/.test(window.__MODE)) {
    (function () {
      var t = document.getElementById('pnbPivotBuilderTpl');
      if (t && t.content) document.body.insertBefore(t.content.cloneNode(true), document.getElementById('out'));
      else window.__errors.push('pivot builder template missing');
    })();
  }
</script>
