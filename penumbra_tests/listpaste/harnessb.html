<html><body><pre id="out">running</pre>
<!--
  Unit tests for the pasted-value-list helpers in js/search_builder.js.

  The functions are STRING-EXTRACTED from the real shipped file (not copied), so
  the assertions track the source. SRC.js is generated by run.ps1 as
  `window.__src = "<the whole file as a JSON string>"` -- that form needs no
  --allow-file-access-from-files and no XHR, and `new Function` parses without
  executing, so a missing jQuery can never masquerade as a syntax error.

  Set BREAK=1 in run.ps1 for the positive control: it corrupts normalizeValueList
  so the suite MUST report failures. A harness that cannot fail proves nothing --
  three past sessions were fooled by exactly that (see memory
  js_syntax_check_via_cscript).
-->
<script src="SRC.js"></script><script>window.__break=1;</script>
<script>
(function () {
  var out = document.getElementById('out');
  var log = [], pass = 0, fail = 0;

  function eq(label, got, want) {
    var g = JSON.stringify(got), w = JSON.stringify(want);
    if (g === w) { pass++; log.push('  ok   ' + label); }
    else { fail++; log.push('  FAIL ' + label + '\n         got:  ' + g + '\n         want: ' + w); }
  }

  try {
    // main.js/search_builder.js are CRLF; anchors written with \n miss silently.
    var code = String(window.__src).replace(/\r\n/g, '\n');

    // Pull each function out by its declaration, ending at the matching
    // dedented close brace. Anchors deliberately start AT `function` so a
    // preceding JSDoc block can never be half-sliced into the extract.
    function grab(name) {
      var start = code.indexOf('function ' + name + '(');
      if (start === -1) throw new Error('anchor missing: ' + name);
      var end = code.indexOf('\n    }\n', start);
      if (end === -1) throw new Error('end anchor missing: ' + name);
      return code.slice(start, end + '\n    }\n'.length);
    }

    var src = grab('normalizeValueList') + '\n' + grab('softSeparatorFor');
    if (window.__break) src = src.replace('if (!v || seen[v]) continue;', 'if (!v) continue;');

    var F = new Function(src + '\nreturn {normalizeValueList: normalizeValueList, softSeparatorFor: softSeparatorFor};')();
    var norm = F.normalizeValueList, sep = F.softSeparatorFor;

    // --- normalizeValueList: trim, drop blanks, de-dup preserving first-seen order
    eq('plain list',            norm(['a', 'b', 'c']), ['a', 'b', 'c']);
    eq('trims each part',       norm([' a ', '\tb', 'c \n']), ['a', 'b', 'c']);
    eq('drops blanks',          norm(['a', '', '   ', 'b']), ['a', 'b']);
    eq('de-duplicates',         norm(['a', 'b', 'a', 'b', 'c']), ['a', 'b', 'c']);
    eq('keeps first-seen order',norm(['c', 'a', 'c', 'b']), ['c', 'a', 'b']);
    eq('all blank -> empty',    norm(['', '  ', '\t']), []);
    eq('single value',          norm(['only']), ['only']);
    eq('values keep inner spaces', norm(['No Cost Extension']), ['No Cost Extension']);
    eq('values keep inner commas', norm(['Aegis Power Systems, Inc.']), ['Aegis Power Systems, Inc.']);

    // Prototype-key safety: a bare {} seen-map inherits `constructor` etc., so a
    // real cell value of "constructor" would be silently dropped as a duplicate.
    // normalizeValueList uses Object.create(null). See memory
    // prototype_key_frequency_maps -- this exact class of bug is live elsewhere.
    eq('prototype key: constructor survives', norm(['constructor']), ['constructor']);
    eq('prototype key: toString survives',    norm(['toString']), ['toString']);
    eq('prototype key: __proto__ survives',   norm(['__proto__']), ['__proto__']);
    eq('prototype keys still de-dup',         norm(['toString', 'toString']), ['toString']);

    // --- softSeparatorFor: which of , / ; is doing the separating
    eq('comma only',        sep('a,b,c'), ',');
    eq('semicolon only',    sep('a;b;c'), ';');
    eq('neither',           sep('just one value'), null);
    eq('more semis wins',   sep('a;b;c,d'), ';');
    eq('more commas wins',  sep('a,b,c;d'), ',');
    eq('tie prefers comma', sep('a,b;c'), ',');
    eq('comma inside a real value still reports comma', sep('Smith, John'), ',');

    out.textContent = log.join('\n') + '\n\n' + pass + ' passed, ' + fail + ' failed'
                    + (window.__break ? '   [BROKEN-COPY CONTROL: failures are REQUIRED]' : '');
  } catch (e) {
    out.textContent = 'HARNESS-ERROR: ' + e.name + ': ' + e.message;
  }
})();
</script>
</body></html>
