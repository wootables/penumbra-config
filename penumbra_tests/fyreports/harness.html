<!doctype html>
<html><head><meta charset="utf-8"><title>fy reports engine changes</title></head>
<body>
<!-- Minimal DOM, same shape as ..\pivot_trigger\harness.html: main.js binds the
     pivot-builder elements DIRECTLY at ready time, so they must exist before it
     loads. The trigger parser resolves the Value column against
     #tableHeader th[data-colname]. -->
<div id="editorTabs"></div><div id="reportSnippetOutput"></div><div id="mainReportSubtitle"></div>
<textarea id="sqlQuery"></textarea><textarea id="reportSnippet"></textarea><textarea id="subquerySql"></textarea>
<table id="resultsTable"><thead id="tableHeader"><tr>
  <th data-colname="#">#</th><th data-colname="FY">FY</th><th data-colname="MONTH">MONTH</th>
  <th data-colname="AMOUNT">AMOUNT</th><th data-colname="AWARDS">AWARDS</th><th data-colname="FY_AGO">FY_AGO</th>
</tr></thead><tbody></tbody></table>
<div id="errorBox"></div>
<input id="tableSearch" value="">
<div id="pivot-output-container" style="display:none"></div>
<div id="groupedResultsContainer" style="display:none"></div>
<div id="pivotLightbox" style="display:none">
  <div id="pivot-source-columns"></div>
  <div id="pivot-rows"></div><div id="pivot-cols"></div><div id="pivot-vals"></div>
  <select id="pivot-aggregation-selector"><option value="">-</option><optgroup label="Basic"><option value="sum">Sum</option><option value="count">Count</option><option value="avg">Average</option><option value="max">Max</option></optgroup></select>
  <table><tbody id="pivot-agg-table-body"></tbody></table>
  <select id="pivot-rows-layout-select"><option value="nested">nested</option><option value="nested-static">nested-static</option><option value="flat">flat</option></select>
  <select id="pivot-cols-layout-select"><option value="nested">nested</option><option value="flat">flat</option></select>
  <select id="pivot-sort-order"><option value="asc">asc</option><option value="desc">desc</option></select>
  <input id="pivot-sticky-cols" value="3">
  <input type="checkbox" id="pivot-row-total-override-toggle">
  <div id="pivot-row-total-override-container" style="display:none"><div id="pivot-row-total-slots"></div><div id="pivot-row-total-tokens"></div></div>
  <select id="pivot-rank-dir"><option value="none">none</option><option value="top">top</option><option value="bottom">bottom</option></select>
  <input id="pivot-rank-n" value="10"><select id="pivot-rank-agg"><option value="sum">sum</option><option value="count">count</option></select>
  <select id="pivot-rank-scope"><option value="">Overall</option></select>
  <input type="checkbox" id="pivot-rank-other" checked><label id="pivot-rank-other-label"></label>
  <input type="checkbox" id="pivot-no-breakdown"><input type="checkbox" id="pivot-start-expanded"><input type="checkbox" id="pivot-hide-empty">
  <select id="pivotPresetSelect"><option value=""></option></select><button id="pivotDeletePresetBtn"></button><input type="checkbox" id="pivotAutoRunPreset">
  <button id="generatePivotBtn">Generate</button>
  <select id="pivotSnippetTargetSelect" style="display: none;"></select>
  <button id="updatePivotSnippetBtn" type="button" style="display: none;">Update Snippet</button>
  <button id="copyPivotSnippetBtn">Snippet</button>
  <button id="pivotSavePresetBtn"></button>
</div>
<pre id="out">running</pre>

<script src="jquery-3.7.1.min.js"></script>
<script src="jquery-ui.min.js"></script>
<script src="moment.min.js"></script>
<script src="pako.min.js"></script>
<script src="codemirror.min.js"></script>
<script src="sql.min.js"></script>
<script src="show-hint.js"></script>
<script src="foldcode.js"></script>
<script src="foldgutter.js"></script>
<script src="brace-fold.js"></script>
<script src="comment-fold.js"></script>
<script src="placeholder.js"></script>
<script src="penumbra_snippet_help.js"></script>
<script src="purify.min.js"></script>
<script src="penumbra_template.js"></script>
<script>
  window.penumbra_vars = {
    isAdmin: true, isGlobalAdmin: true, currentUserKey: 'harness', shibboleth: { ouc: '', dept: '' },
    tables: { oracle: [], pins: [], infoed: [], hr: [], fin: [] },
    imports: [], reports: [], themes: {}, prompts: {}, grants: []
  };
  jQuery.ajax = function () { var d = jQuery.Deferred(); d.resolve({}); return d.promise(); };
  jQuery.getJSON = jQuery.ajax; jQuery.post = jQuery.ajax; jQuery.get = jQuery.ajax;
  jQuery.fx.off = true;
  window.ResizeObserver = function () { this.observe = function () {}; this.unobserve = function () {}; this.disconnect = function () {}; };
  window.IntersectionObserver = window.ResizeObserver;
  if (!window.matchMedia) {
    window.matchMedia = function () { return { matches: false, addListener: function () {}, removeListener: function () {}, addEventListener: function () {}, removeEventListener: function () {} }; };
  }
  window.__errors = [];
  window.onerror = function (m, src, line) { window.__errors.push(String(m) + ' @' + String(src).split('/').pop() + ':' + line); try { var o = document.getElementById('out'); if (o && o.textContent === 'running') o.textContent = 'PAGE_ERROR: ' + window.__errors[0]; } catch (x) {} return true; };
</script>
<script src="main_patched.js"></script>
<script>
(function () {
  function report(txt) { document.getElementById('out').textContent = txt; }
  var results = [];
  function assert(name, cond, detail) { results.push({ name: name, pass: !!cond, detail: detail === undefined ? '' : String(detail) }); }
  function eq(name, actual, expected) {
    var a = JSON.stringify(actual), e = JSON.stringify(expected);
    assert(name, a === e, 'expected ' + e + ' got ' + a);
  }
  function M(o) { var m = new Map(); Object.keys(o).forEach(function (k) { m.set(k, o[k]); }); return m; }

  // Three fiscal years x three months. Month labels sort naturally so a plain
  // label sort IS the fiscal order. FY 2026 has NO Aug row (a gap BETWEEN real
  // points); FY 2027 (current) has only Jul (a TRAILING gap). The FY_ columns are
  // the same on every row, the way the report SQL carries them.
  function row(fy, ago, month, amt, awd) {
    return M({ FY: fy, FY_AGO: String(ago), MONTH: month, AMOUNT: amt, AWARDS: String(awd),
      FY_CURRENT: 'FY 2027', FY_PRIOR: 'FY 2026', FY_PRIOR2: 'FY 2025' });
  }
  var ROWS = [
    row('FY 2025', 2, '01 Jul', '$100', 1), row('FY 2025', 2, '02 Aug', '$200', 2), row('FY 2025', 2, '03 Sep', '$300', 3),
    row('FY 2026', 1, '01 Jul', '$110', 1),                                          row('FY 2026', 1, '03 Sep', '$330', 3),
    row('FY 2027', 0, '01 Jul', '$120', 1)
  ];
  function combo(series, extras) {
    return window.__FY.chartData(ROWS, 'MONTH', 'none', 'none', 'sum', 12, 'combo', 'label', 'asc', 'default',
      false, false, series, '', extras || {});
  }
  function ser(type, agg, ago, label) {
    var s = { col: 'AMOUNT', type: type, agg: agg, color: '#336699' };
    if (ago !== null) s.filterExpression = 'FY_AGO = ' + ago;
    if (label !== null) s.label = label;
    return s;
  }

  function run() {
    var F = window.__FY;
    if (!F || typeof F.chartData !== 'function') {
      report('RESULTS_JSON:' + JSON.stringify({ fatal: 'hooks unavailable: ' + (window.__FY_ERR || 'n/a'), pageErrors: window.__errors.slice(0, 6) }));
      return;
    }
    $('#generatePivotBtn').off('click');   // no data table behind the builder; stay deterministic

    // ---------------- T: {COLUMN} tokens in combo / butterfly labels --------
    var d = combo([
      ser('bar', 'sum', 0, '{FY_CURRENT}'),
      ser('line', 'running_total', 0, '{FY_CURRENT} YTD'),
      ser('line', 'running_total', 1, '{FY} YTD'),
      ser('line', 'sum', 0, 'plain {NOPE}'),
      ser('line', 'running_total', 9, '{FY} none'),
      ser('bar', 'sum', 0, null),
      ser('line', 'sum', null, '{fy_prior2} lower-case')
    ]);
    var lbl = d.datasets.map(function (ds) { return ds.label; });
    eq('T1 a constant column resolves from the series rows', lbl[0], 'FY 2027');
    eq('T2 token plus literal text', lbl[1], 'FY 2027 YTD');
    eq('T3 a per-row column resolves from the rows the SERIES counts (FY_AGO = 1)', lbl[2], 'FY 2026 YTD');
    eq('T4 an unknown column keeps its token as typed', lbl[3], 'plain {NOPE}');
    eq('T5 a series with no rows falls back to the chart first row', lbl[4], 'FY 2025 none');
    eq('T6 no label = the old generated default (never tokenised)', lbl[5], 'AMOUNT (sum) [FY_AGO = 0]');
    eq('T7 token names are case-insensitive', lbl[6], 'FY 2025 lower-case');
    var bf = window.__FY.chartData(ROWS, 'MONTH', 'none', 'none', 'sum', 12, 'butterfly', 'label', 'asc', 'default',
      false, false, [ser('bar', 'sum', 1, '{FY} left'), ser('bar', 'sum', 0, '{FY_CURRENT} right')], '', {});
    eq('T8 butterfly labels resolve too', bf.datasets.map(function (x) { return x.label; }), ['FY 2026 left', 'FY 2027 right']);

    // ---------------- G: line gaps --------------------------------------------
    eq('G1 labels are the three months in order', d.labels, ['01 Jul', '02 Aug', '03 Sep']);
    eq('G2 current-FY running total ENDS at its last month (no flat run to the edge)', d.datasets[1].data, [120, null, null]);
    eq('G3 a gap BETWEEN real points still holds level', d.datasets[2].data, [110, 110, 440]);
    eq('G4 a plain-sum line ends too (no drop to the floor)', d.datasets[3].data, [120, null, null]);
    eq('G5 a line with no rows is all gap', d.datasets[4].data, [null, null, null]);
    eq('G6 bars are untouched (0, not null)', d.datasets[0].data, [120, 0, 0]);
    var full = combo([ser('line', 'running_total', 2, 'FY2025')]);
    eq('G7 a complete series is unchanged', full.datasets[0].data, [100, 300, 600]);
    var par = combo([ser('bar', 'sum', null, 'bars'), ser('line', 'running_total', 0, 'cur')], { pareto: true });
    var parLine = par.datasets[1].data;
    assert('G8 pareto rescales against the last REAL point (100% at Jul, gaps after)',
      parLine[0] === 100 && parLine[1] === null && parLine[2] === null, JSON.stringify(parLine));
    var parAll = combo([ser('bar', 'sum', null, 'bars'), ser('line', 'running_total', null, 'all')], { pareto: true });
    var pl = parAll.datasets[1].data;
    assert('G9 a normal pareto line still ends at 100%', Math.abs(pl[pl.length - 1] - 100) < 1e-9 && pl.indexOf(null) === -1, JSON.stringify(pl));

    // ---------------- pivot fixtures (B / H / C) -------------------------------
    function pivot(opts) {
      var settings = {
        v: 2, rows: opts.rowFields || ['MONTH'], cols: ['FY'], vals: 'AMOUNT', agg: opts.agg || ['sum', 'sum'], aggLabels: opts.aggLabels || ['Amount', 'Awards'],
        aggColOverrides: opts.aggColOverrides || ['AMOUNT', 'AWARDS'], aggFilters: null, aggFormulas: null, rowLayout: 'nested', colLayout: 'nested',
        sortOrder: 'asc', colSortOrder: 'asc', stickyColCount: 1, totalColAggs: opts.totalColAggs || null,
        totalRowAggs: (opts.totalRowAggs === undefined ? null : opts.totalRowAggs),
        totalRowAggLabels: opts.totalRowAggLabels || null, totalRowAggBaseIdx: opts.totalRowAggBaseIdx || null,
        rankN: null, rankDir: null, rankAgg: null, rankOther: true, rankScope: null, noBreakdown: false,
        startExpanded: false, hideEmpty: false
      };
      F.setPivotSettings(settings);
      var extra = F.extraVals(settings.aggColOverrides, settings.vals);
      var pd = F.processPivot(opts.data || ROWS, settings.rows, settings.cols, settings.vals, settings.agg, extra, null);
      var res = F.pivotTable(pd, settings.rows, settings.cols, settings.vals, settings.rowLayout, settings.colLayout,
        settings.agg, 'asc', null, (opts.isCurrency || [true, false]), settings.totalColAggs, settings.totalRowAggs, 'asc', 1, null,
        settings.totalRowAggLabels, settings.aggColOverrides, settings.totalRowAggBaseIdx, false);
      var box = document.createElement('div');
      box.innerHTML = (res && res.html) ? res.html : String(res);
      return box;
    }
    function cell(box, rk, ck, ai) {
      var c = box.querySelector('td[data-row-key="' + rk + '"][data-col-key="' + ck + '"][data-agg-idx="' + ai + '"]');
      return c ? c.textContent.trim() : '(no cell)';
    }
    var p0 = pivot({});
    eq('B1 a filled cell still formats ($)', cell(p0, '01 Jul', 'FY 2027', 0), '$120');
    eq('B2 an EMPTY money cell is blank, not $0', cell(p0, '02 Aug', 'FY 2027', 0), '');
    eq('B3 an EMPTY count cell is blank, not 0', cell(p0, '02 Aug', 'FY 2027', 1), '');
    eq('B4 an empty cell in a past year is blank too', cell(p0, '02 Aug', 'FY 2026', 0), '');

    // ---------------- H: no Grand Total column --------------------------------
    var gtDefault = p0.querySelectorAll('.pivot-grand-total').length;
    assert('H1 control: the default pivot HAS a Grand Total column', gtDefault > 0, 'cells=' + gtDefault);
    var pHide = pivot({ totalRowAggs: [] });
    eq('H2 an EMPTY override leaves no .pivot-grand-total cell anywhere', pHide.querySelectorAll('.pivot-grand-total').length, 0);
    var hdrText = Array.prototype.map.call(pHide.querySelectorAll('thead th'), function (th) { return th.textContent.trim(); }).join('|');
    assert('H3 no header reads "Grand Total"', hdrText.indexOf('Grand Total') === -1, hdrText);
    var foot = pHide.querySelector('tfoot tr');
    assert('H4 the footer ROW (column totals) stays', !!foot && foot.textContent.indexOf('Grand Total') !== -1, foot ? foot.textContent : 'no tfoot');
    eq('H5 footer still totals FY 2025 amounts', cell(pHide, '01 Jul', 'FY 2025', 0), '$100');
    var bodyRow = pHide.querySelector('tbody tr');
    var hdrRows = pHide.querySelectorAll('thead tr');
    var lastHdr = hdrRows[hdrRows.length - 1];
    var span = function (tr) { return Array.prototype.reduce.call(tr.cells, function (a, c) { return a + (c.colSpan || 1); }, 0); };
    // The last header row is the Amount/Awards sub-header row; MONTH sits above it
    // with a rowspan, so a body row is exactly one cell wider.
    assert('H6 body and header still line up', !!bodyRow && span(bodyRow) === span(lastHdr) + 1,
      'body=' + (bodyRow ? span(bodyRow) : '?') + ' header=' + span(lastHdr));
    eq('H7 7 body cells = MONTH + 3 FYs x 2 values, nothing on the right', bodyRow ? bodyRow.cells.length : -1, 7);
    var pNull = pivot({ totalRowAggs: null });
    assert('H8 null (no override) still renders the column', pNull.querySelectorAll('.pivot-grand-total').length === gtDefault, pNull.querySelectorAll('.pivot-grand-total').length);

    // ---------------- C: override currency follows the value it totals -------
    var pOv = pivot({ totalRowAggs: ['sum', 'sum'], totalRowAggBaseIdx: [0, 1], totalRowAggLabels: ['Amount', 'Awards'] });
    var gtCells = Array.prototype.filter.call(pOv.querySelectorAll('tbody tr:first-child td.pivot-grand-total'), function () { return true; })
      .map(function (td) { return td.textContent.trim(); });
    eq('C1 override on the money value keeps $', gtCells[0], '$330');
    eq('C2 override on the COUNT value has no $ (was $3)', gtCells[1], '3');
    // C3-C6 (2026-09-26): a corner slot totals its OWN value. Both engines merged
    // the main bucket (the first value's column) there, so Awards read 1,160.
    function cornerCells(box) {
      var tds = box.querySelectorAll('tfoot td.pivot-grand-total');
      return Array.prototype.slice.call(tds, -2).map(function (td) { return td.textContent.trim(); });
    }
    var ovCorner = cornerCells(pOv);
    eq('C3 override corner: the Amount slot', ovCorner[0], '$1,160');
    eq('C4 override corner: the Awards slot totals Awards (was 1,160)', ovCorner[1], '11');
    var colCorner = cornerCells(pivot({ totalColAggs: ['sum', 'sum'] }));
    eq('C5 column-total override corner: the Amount slot', colCorner[0], '$1,160');
    eq('C6 column-total override corner: the Awards slot totals Awards (was 1,160)', colCorner[1], '11');

    // ---------------- F: format() can hide the -100% months not counted yet ----
    // The owner's ask (2026-09-26): format(cell, % Change, % Change = -100,
    // 'color: transparent'). Built the way the snippet parser builds it - in
    // pivot mode it adds the aggregation DISPLAY labels to the known columns
    // before parsing, so '% Change' reads as a column, not as free text. The
    // email engine's half is checked by eng4\probe_format.php (same rule).
    F.setFormatRules([{ type: 'cell', targetColumn: '% CHANGE', condition: '% Change = -100', style: 'color: transparent',
      parsedCondition: F.parseQuery('% Change = -100', ['FY', 'MONTH', 'AMOUNT', 'Amount', '% Change']) }]);
    var pPct = pivot({ agg: ['sum', 'pct_change'], aggLabels: ['Amount', '% Change'], aggColOverrides: ['AMOUNT', null], totalRowAggs: [] });
    F.setFormatRules([]);
    var pctCells = Array.prototype.filter.call(pPct.querySelectorAll('tbody td'), function (td) { return /%$/.test(td.textContent.trim()); })
      .map(function (td) { return { t: td.textContent.trim(), hid: /color:\s*transparent/i.test(td.getAttribute('style') || '') }; });
    var minus100 = pctCells.filter(function (c) { return c.t === '-100.0%'; });
    assert('F1 the rule hides every -100.0% cell (two in the fixture)', minus100.length === 2 && minus100.every(function (c) { return c.hid; }), JSON.stringify(pctCells));
    assert('F2 ...and no other % cell', pctCells.filter(function (c) { return c.t !== '-100.0%' && c.hid; }).length === 0, JSON.stringify(pctCells));

    // ---------------- D: % Change (to date) (2026-09-26) --------------------------
    // Same fixture and figures as test_todate.php (the email / CSV / XLSX half).
    function rowCells(box, label) {
      var trs = box.querySelectorAll('tbody tr');
      for (var i = 0; i < trs.length; i++) {
        var cs = trs[i].querySelectorAll('th, td');
        if (cs.length && cs[0].textContent.trim() === label) return Array.prototype.map.call(cs, function (c) { return c.textContent.trim(); });
      }
      return null;
    }
    function footCells(box) {
      var tr = box.querySelector('tfoot tr');
      return tr ? Array.prototype.map.call(tr.querySelectorAll('th, td'), function (c) { return c.textContent.trim(); }) : null;
    }
    // Row cells: label, then per FY [Amount, %], then the Grand Total pair.
    var pTd = pivot({ agg: ['sum', 'pct_change_td'], aggLabels: ['Amount', '% Change (to date)'], aggColOverrides: ['AMOUNT', null] });
    var tdJul = rowCells(pTd, '01 Jul'), tdAug = rowCells(pTd, '02 Aug'), tdSep = rowCells(pTd, '03 Sep'), tdFt = footCells(pTd);
    eq('D1 reached months compute as % Change (10.0%, 9.1%)', tdJul && [tdJul[4], tdJul[6]], ['10.0%', '9.1%']);
    eq('D2 FY 2026 Aug (no rows) is blank, not -100.0%', tdAug && tdAug[4], '');
    eq('D3 FY 2027 Sep (not reached) is blank, not -100.0%', tdSep && tdSep[6], '');
    eq('D4 Grand Total row compares like for like: FY 2026 10.0%, FY 2027 9.1%', tdFt && [tdFt[4], tdFt[6]], ['10.0%', '9.1%']);
    eq('D5 Grand Total column: Jul 20.0%, Sep blank', [tdJul && tdJul[tdJul.length - 1], tdSep && tdSep[tdSep.length - 1]], ['20.0%', '']);
    eq('D6 corner: Jul vs Jul = 20.0%', tdFt && tdFt[tdFt.length - 1], '20.0%');
    var pPc = pivot({ agg: ['sum', 'pct_change'], aggLabels: ['Amount', '% Change'], aggColOverrides: ['AMOUNT', null] });
    var pcSep = rowCells(pPc, '03 Sep'), pcFt = footCells(pPc);
    eq('D7 regression: plain % Change still -100.0%, footer -26.7%', [pcSep && pcSep[6], pcFt && pcFt[4]], ['-100.0%', '-26.7%']);

    // ---------------- R: running totals stop at their last period with data -----
    var pRd = pivot({ agg: ['sum', 'running_total:down'], aggLabels: ['Amount', 'Run'], aggColOverrides: ['AMOUNT', null], totalRowAggs: [], isCurrency: [true, true] });
    var rJul = rowCells(pRd, '01 Jul'), rAug = rowCells(pRd, '02 Aug'), rSep = rowCells(pRd, '03 Sep');
    eq('R1 FY 2027 runs $120, then Aug and Sep are blank (were $120)', [rJul && rJul[6], rAug && rAug[6], rSep && rSep[6]], ['$120', '', '']);
    eq('R2 FY 2026 Aug still carries $110 (data resumes in Sep), Sep $440', [rAug && rAug[4], rSep && rSep[4]], ['$110', '$440']);
    var pRh = pivot({ agg: ['sum', 'running_total'], aggLabels: ['Amount', 'Run'], aggColOverrides: ['AMOUNT', null], totalRowAggs: [], isCurrency: [true, true] });
    var hAug = rowCells(pRh, '02 Aug'), hJul = rowCells(pRh, '01 Jul');
    eq('R3 across: Aug blank after FY 2025, Jul runs to $330', [hAug && hAug[4], hAug && hAug[6], hJul && hJul[6]], ['', '', '$330']);
    // Parity reference for test_rundown.php (2026-09-26): the Grand Total row of a DOWN
    // running column is each year's final figure; the scheduled builders summed it.
    var rdFt = footCells(pRd);
    eq('R4 a Running Total ↓ Grand Total row is each year\'s final figure ($600, $440, $120)', rdFt && [rdFt[2], rdFt[4], rdFt[6]], ['$600', '$440', '$120']);
    var pRc = pivot({ agg: ['sum', 'running_count:down'], aggLabels: ['Amount', 'Run#'], aggColOverrides: ['AMOUNT', null], totalRowAggs: [], isCurrency: [true, false] });
    var rcFt = footCells(pRc);
    eq('R5 ...and a Running Count ↓ one each year\'s final count (3, 2, 1)', rcFt && [rcFt[2], rcFt[4], rcFt[6]], ['3', '2', '1']);

    // ---------------- L: label room follows the series that print labels ------
    var _hadChart = !!window.Chart;
    if (!_hadChart) window.Chart = { defaults: { font: { family: 'sans-serif' } } };   // the measure reads Chart.defaults.font
    var lrData = function (vals) { return { datasets: vals.map(function (v, i) { return { type: i ? 'line' : 'bar', data: [1000000, 2000000], _comboValues: v }; }) }; };
    var lrOpt = function (show, vals) { return { type: 'combo', indexAxis: 'x', showValues: show, valuePos: 'auto', fontSize: 10, data: lrData(vals), formatter: function (v) { return String(v); } }; };
    eq('L1 every combo series "values":"none": no blank band above the chart', F.labelRoom(lrOpt(true, ['none', 'none'])).padding.top, 0);
    assert('L2 control: a series that inherits the chart\'s values still gets room', F.labelRoom(lrOpt(true, ['', 'none'])).padding.top > 0, '');
    assert('L3 a series that asks for labels gets room even with the chart\'s values off', F.labelRoom(lrOpt(false, ['none', 'end'])).padding.top > 0, '');
    if (!_hadChart) delete window.Chart;

    // ---------------- W: % widths leave room for a flex row's gaps ------------
    var wrow = document.createElement('div');
    wrow.style.cssText = 'display:flex;flex-wrap:wrap;gap:15px;width:1000px;padding:0;border:0;margin:0';
    document.body.appendChild(wrow);
    var w50 = F.vizDim('50%', { baseEl: wrow }).px, w33 = F.vizDim('33.33%', { baseEl: wrow }).px;
    eq('W1 two 50% charts and the 15px gap fit a 1000px row', [w50, w50 * 2 + 15 <= 1000], [492, true]);
    assert('W2 three 33.33% charts and two gaps fit', w33 * 3 + 30 <= 1000, 'w33=' + w33);
    eq('W3 100% keeps the whole row', F.vizDim('100%', { baseEl: wrow }).px, 1000);
    var wblock = document.createElement('div');
    wblock.style.cssText = 'display:block;width:1000px;padding:0;border:0;margin:0';
    document.body.appendChild(wblock);
    eq('W4 no flex gap: 50% is exactly half, as before', F.vizDim('50%', { baseEl: wblock }).px, 500);
    wrow.remove(); wblock.remove();

    // ---------------- M: a derived value takes its BASE's currency (2026-09-26) --
    // The flags come from the real penumbraPivotCurrencyFlags, which reads the
    // results table's column properties: AMOUNT is money, AWARDS a plain count.
    // A Running Total ↓ right after Sum(AWARDS) used to take the PRIMARY value
    // field's '$' ("$6" awards) - the user's ?id=fycompawd running award count.
    $('#resultsTable').data('columnProperties', { 3: { isCurrency: true }, 4: { isCurrency: false } })

    eq('U16 re-ticking an emptied override starts from pristine defaults', F.rtTokens(), null);

    F.setPivotSettings({ v: 2, rows: ['MONTH'], cols: ['FY'], vals: 'AMOUNT', agg: ['sum', 'sum'], aggLabels: ['Amount', 'Awards'],

    // ---------------- S: css ------------------------------------------------------
    var x = new XMLHttpRequest(); x.open('GET', 'main_css_under_test.css', false); x.send();

  // js/penumbra_snippet_help.js binds `P = window.Penumbra` ONCE, when it loads. The app
  // lazy-loads it long after main.js built that object; the static <script> above runs
  // BEFORE main.js's ready code, so its P was an empty stand-in (harness Q, 2026-09-26).
  // Once main.js is up, load it again the way the app does, then run.
  function reloadSnippetHelp(done) {
    // The module refuses to load twice (`if (w.PenumbraSnippetHelp) return;`).
    try { delete window.PenumbraSnippetHelp; } catch (e) { window.PenumbraSnippetHelp = undefined; }
    var s = document.createElement('script');
    s.src = 'penumbra_snippet_help.js?reload=' + Date.now();
    s.onload = s.onerror = function () { done(); };
    document.head.appendChild(s);
  }
  var tries = 0;
  (function wait() {
    tries++;
    if (window.__FY && !wait.reloaded) { wait.reloaded = true; reloadSnippetHelp(wait); return; }
    if (window.__FY || tries > 40) { setTimeout(function () { try { run(); } catch (e) { report('RESULTS_JSON:' + JSON.stringify({ fatal: 'run threw: ' + e + ' ' + (e.stack || '').split('\n').slice(0, 3).join(' | '), pageErrors: window.__errors.slice(0, 6) })); } }, 300); }
    else { setTimeout(wait, 100); }
  })();
})();
