<script>
  // Boot-page seeding (?suite=landing|report) happens HERE, before main.js
  // runs its init: the early theme apply and the state loader read
  // localStorage exactly once, at load.
  (function () {
    var q = new URLSearchParams(location.search);
    window.__SUITE = q.get('suite') || 'main';
    try { localStorage.clear(); } catch (e) {}
    try {
      var seed = q.get('seed');
      if (seed) {
        var s = JSON.parse(seed);
        Object.keys(s).forEach(function (k) { localStorage.setItem(k, s[k]); });
      }
    } catch (e) { window.__SEED_ERR = String(e); }
    // Every theme main.js applies, in order - the report boot applies twice
    // (early apply, then the state loader) and only the trail tells them apart.
    window.__themeTrail = [];
    new MutationObserver(function (ms) {
      ms.forEach(function (m) { if (m.attributeName === 'data-theme') window.__themeTrail.push(document.body.getAttribute('data-theme')); });
    }).observe(document.body, { attributes: true, attributeFilter: ['data-theme'] });
  })();
  window.PENUMBRA_THEMES = {
    'theme-default':  { label: 'Default' },
    'theme-dark':     { label: 'Dark', dark: true },
    'theme-wolfpack': { label: 'Wolfpack Red', modern: true }
  };
  window.PENUMBRA_THEME_IDS = ['theme-default', 'theme-dark', 'theme-wolfpack'];
  window.PENUMBRA_THEME_ALIASES = {};
  window.PENUMBRA_LANDING_DEFAULT_THEME = 'theme-wolfpack';
</script>

<script>
  window.penumbra_vars = {
    isAdmin: true, isGlobalAdmin: true, currentUserKey: 'harness', shibboleth: { ouc: '', dept: '' },
    tables: { oracle: [], pins: [], infoed: [], hr: [], fin: [] },
    imports: [], reports: [], themes: {}, prompts: {}, grants: [],
    totalExemptions: ['AMOUNT']   // the summable-name whitelist (server config in production)
  };
  // ?suite=report boots a saved report: the state loader reads it from here.
  // One row back, so the render path runs to its end (loadResolverPref +
  // applyLayoutPreferences are its last steps; "no results" returns first).
  if (window.__SUITE === 'report') {
    window.penumbra_vars.preloadedState = { query: 'SELECT 1 AS N FROM DUAL', theme: 'theme-default', density: 'standard' };
    window.__queryResponse = { data: [{ N: '1' }] };
  }
  // Routed ajax stub. query.php answers with whatever the driver queued in
  // window.__queryResponse (async, like the real thing - the success handler
  // is an async function, so its throw surfaces as an unhandledrejection).
  window.__ajaxLog = [];
  jQuery.ajax = function (a, b) {
    var opts = (typeof a === 'string') ? jQuery.extend({ url: a }, b || {}) : (a || {});
    var url = String(opts.url || '');
    window.__ajaxLog.push(url);
    var d = jQuery.Deferred();
    var resp = {};
    if (/query\.php/.test(url)) resp = window.__queryResponse || { data: [] };
    setTimeout(function () {
      try { if (opts.success) opts.success(resp, 'success', { status: 200 }); } catch (e) { window.__errors.push('ajax success threw: ' + String(e)); }
      try { if (opts.complete) opts.complete({ status: 200 }, 'success'); } catch (e) { window.__errors.push('ajax complete threw: ' + String(e)); }
      d.resolve(resp, 'success', { status: 200 });
    }, 0);
    var p = d.promise(); p.abort = function () {}; return p;
  };
  jQuery.getJSON = function (u, x, cb) { return jQuery.ajax({ url: u, success: (typeof x === 'function') ? x : cb }); };
  jQuery.post = function (u, x, cb) { return jQuery.ajax({ url: u, success: (typeof x === 'function') ? x : cb }); };
  jQuery.get = jQuery.post;
  jQuery.fx.off = true;
  window.ResizeObserver = function () {
    this.observe = function () {}; this.unobserve = function () {}; this.disconnect = function () {};
  };
  window.IntersectionObserver = window.ResizeObserver;
  if (!window.matchMedia) {
    window.matchMedia = function () { return { matches: false, addListener: function () {}, removeListener: function () {}, addEventListener: function () {}, removeEventListener: function () {} }; };
  }
  window.__errors = [];
  window.__rejections = [];
  window.onerror = function (m, src, line) { window.__errors.push(String(m) + ' @' + String(src).split('/').pop() + ':' + line); return true; };
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    window.__rejections.push(String((r && r.message) || r) + ' @' + String((r && r.stack) || '').split('\n').slice(1, 2).join('').trim());
    e.preventDefault();
  });
  window.__consoleErrors = [];
  (function () {
    var ce = console.error;
    console.error = function () {
      try { window.__consoleErrors.push(Array.prototype.map.call(arguments, function (x) { return (x && x.message) ? x.message : String(x); }).join(' ')); } catch (e) {}
      return ce.apply(console, arguments);
    };
  })();
  window.confirm = function () { return true; };
  window.alert = function () {};
  window.prompt = function () { return null; };
  window.__clip = null;
  if (!navigator.clipboard) { try { Object.defineProperty(navigator, 'clipboard', { value: {}, configurable: true }); } catch (e) {} }
  try { navigator.clipboard.writeText = function (s) { window.__clip = s; return Promise.resolve(); }; } catch (e) {}
</script>
