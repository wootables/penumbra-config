<script>
  (function () { try { localStorage.clear(); } catch (e) {} })();
  window.PENUMBRA_THEMES = { 'theme-default': { label: 'Default' } };
  window.PENUMBRA_THEME_IDS = ['theme-default'];
  window.PENUMBRA_THEME_ALIASES = {};
  window.PENUMBRA_LANDING_DEFAULT_THEME = 'theme-default';
  (function () {
    var P = new URLSearchParams(location.search);
    window.__SCN = P.get('scn') || 'dlg';
    window.__SB = /sb|sweep/.test(window.__SCN);
    // --- the fixture: a PIVOT-shaped result ---------------------------------
    // Integer-like keys come first in a JS object's key order, as they do when
    // the browser parses query.php's JSON - so the digit columns lead the table.
    // sweep: a nested-table column named in digits too (2023); plainsb: no nested
    // column at all (the dialog opened before the fix) and 2022 / V_AMT with many
    // values (both numeric enough for the grouping picker's bin entries).
    var SC = window.__SCN;
    var COLS = SC === 'sweep' ? ['2021', '2022', '2023', 'V_ID', 'V_NAME', 'V_STATUS', 'J_SUBS']
             : SC === 'plainsb' ? ['2021', '2022', 'V_ID', 'V_NAME', 'V_STATUS', 'V_AMT']
             : ['2021', '2022', 'V_ID', 'V_NAME', 'V_STATUS', 'J_SUBS'];
    window.__COLS = COLS;
    var seed = 20261025;
    function rnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }
    function pick(a) { return a[Math.floor(rnd() * a.length)]; }
    var W = ['Alpha', 'Bravo', 'Charlie', 'Delta', 'Echo', 'Foxtrot'];
    var rows = [];
    for (var i = 1; i <= 60; i++) {
      var r = {};
      r['2021'] = pick(['100', '250', '975.5']);
      // (plainsb: two decimals, so no value reads as a year - a column of 4-digit values is a YEAR column to the
      //  bin test, by design, and gets no bins whatever its name)
      r['2022'] = SC === 'plainsb' ? (1 + rnd() * 5000).toFixed(2) : pick(['10', '20', '30', '40']);
      if (SC === 'sweep') {
        var nk = [];
        for (var q = 0, nq = 1 + Math.floor(rnd() * 2); q < nq; q++) nk.push({ N_KIND: pick(['Seed', 'Grant', 'Gift']), N_AMT: 1 + Math.floor(rnd() * 900) });
        r['2023'] = '@@JSON' + JSON.stringify(nk);
      }
      r.V_ID = 'ID-' + String(1000 + i);
      r.V_NAME = pick(W) + ' ' + pick(W);
      r.V_STATUS = pick(['Open', 'Closed', 'Pending']);
      if (SC === 'plainsb') {
        r.V_AMT = (1 + rnd() * 5000).toFixed(2);
      } else {
        var sub = [];
        for (var k = 0, n = 1 + Math.floor(rnd() * 3); k < n; k++) {
          sub.push({ SUB_NAME: pick(W), SUB_AMT: 1 + Math.floor(rnd() * 5000), SUB_ROLE: pick(['PI', 'Co-PI', 'Staff']) });
        }
        r.J_SUBS = '@@JSON' + JSON.stringify(sub);
      }
      rows.push(r);
    }
    window.__rowsFixture = rows;
    // --- the scenario's stored report ------------------------------------------
    var order = []; for (var c = 0; c < COLS.length; c++) order.push(c);
    var st = {
      name: 'dcfix', query: 'SELECT * FROM DC_FIXTURE', reportTitle: 'Digit-named columns fixture',
      theme: 'theme-default', density: 'standard',
      visibleColumns: ['#'].concat(order), columnOrder: order,
      sortCriteria: [], noLimit: true, rowExpandDefault: false, resolverLinksDefault: true,
      rowsPerPage: '200', reportSnippet: ''
    };
    // sweep: a format() rule and a rewrite() rule on PLAIN columns - the passes that apply
    // them map every header of the table, the digit-named ones too
    if (window.__SCN === 'sweep') {
      st.reportSnippet = "DCSNIP\nformat(cell, V_STATUS, V_STATUS='Open', 'color:rgb(255, 0, 0)')\nrewrite(V_NAME, '<b class=\"dcrw\">{val}</b>')";
    }
    window.__STORED = st;
    window.penumbra_vars = {
      isAdmin: true, isGlobalAdmin: true, canEditReport: true, currentUserKey: 'harness', shibboleth: { ouc: '', dept: '' },
      tables: { oracle: [], pins: [], infoed: [], hr: [], fin: [] },
      imports: [], reports: [], themes: {}, prompts: {}, grants: [],
      totalExemptions: [],
      preloadedState: st
    };
    window.__queryResponse = { data: rows };
  })();
  window.__T = {};
  window.__queryDone = 0;
  window.__ajaxLog = [];
  window.__clip = [];
</script>

<script>
  jQuery.ajax = function (a, b) {
    var opts = (typeof a === 'string') ? jQuery.extend({ url: a }, b || {}) : (a || {});
    var url = String(opts.url || '');
    window.__ajaxLog.push(url);
    var d = jQuery.Deferred();
    var isQuery = /query\.php/.test(url);
    var resp = isQuery ? window.__queryResponse : {};
    setTimeout(function () {
      try { if (opts.success) opts.success(resp, 'success', { status: 200 }); } catch (e) { window.__errors.push('ajax success threw: ' + String(e)); }
      try { if (opts.complete) opts.complete({ status: 200 }, 'success'); } catch (e) { window.__errors.push('ajax complete threw: ' + String(e)); }
      d.resolve(resp, 'success', { status: 200 });
      if (isQuery) window.__queryDone++;
    }, 0);
    var p = d.promise(); p.abort = function () {}; return p;
  };
  jQuery.getJSON = function (u, x, cb) { return jQuery.ajax({ url: u, success: (typeof x === 'function') ? x : cb }); };
  jQuery.post = function (u, x, cb) { return jQuery.ajax({ url: u, success: (typeof x === 'function') ? x : cb }); };
  jQuery.get = jQuery.post;
  jQuery.fx.off = true;
  window.__errors = [];
  window.__rejections = [];
  window.onerror = function (m, src, line) { window.__errors.push(String(m) + ' @' + String(src).split('/').pop() + ':' + line); return true; };
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    window.__rejections.push(String((r && r.message) || r) + ' @' + String((r && r.stack) || '').split('\n').slice(1, 2).join('').trim());
    e.preventDefault();
  });
  // copy_distinct writes the clipboard: keep what it would write
  try { Object.defineProperty(navigator.clipboard, 'writeText', { configurable: true, value: function (s) { window.__clip.push(String(s)); return Promise.resolve(); } }); } catch (e) { window.__clipErr = String(e); }
  window.confirm = function () { return true; };
  window.alert = function (m) { window.__errors.push('alert: ' + m); };
  window.prompt = function () { return null; };
  if (typeof window.stackHeaders !== 'function') window.stackHeaders = function () {};
</script>
