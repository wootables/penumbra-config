// =============================================================================
// AUTO-BUILD harness (2026-09-04)

// the shape rules they share (_vizAutoShape and friends) and the settings they
// hand the applier, against synthetic rows shaped like the live reports that
// surfaced the defects. The readers are REAL shipped source, grabbed from
// main.js; only the DOM (a tiny jQuery stand-in), the date parser and the

var LOG = [], PASS = 0, FAIL = 0;
function ok(name, cond, extra) {
  if (cond) { PASS++; LOG.push('PASS  ' + name); }
  else { FAIL++; LOG.push('FAIL  ' + name + (extra ? '   >> ' + extra : '')); }
}
function eq(name, got, want) {
  ok(name, JSON.stringify(got) === JSON.stringify(want),
     'got=' + JSON.stringify(got) + ' want=' + JSON.stringify(want));
}
function has(name, arr, re) {
  ok(name, (arr || []).some(function (s) { return re.test(String(s)); }), 'warnings=' + JSON.stringify(arr));
}
function hasNot(name, arr, re) {
  ok(name, !(arr || []).some(function (s) { return re.test(String(s)); }), 'warnings=' + JSON.stringify(arr));
}

try {
  var code = String(window.__src).replace(/\r\n/g, '\n');

  function grab(decl) {
    var start = code.indexOf(decl);
    if (start === -1) throw new Error('anchor not found: ' + decl);
    var i = code.indexOf('{', start), depth = 0, inStr = null, inLine = false, inBlk = false, inRe = false;
    for (var j = i; j < code.length; j++) {
      var c = code[j], n = code[j + 1];
      if (inLine) { if (c === '\n') inLine = false; continue; }
      if (inBlk) { if (c === '*' && n === '/') { inBlk = false; j++; } continue; }
      if (inStr) { if (c === '\\') { j++; continue; } if (c === inStr) inStr = null; continue; }
      if (inRe) { if (c === '\\') { j++; continue; } if (c === '/') inRe = false; continue; }
      if (c === '/' && n === '/') { inLine = true; j++; continue; }
      if (c === '/' && n === '*') { inBlk = true; j++; continue; }
      if (c === '"' || c === "'" || c === '`') { inStr = c; continue; }
      if (c === '/') {
        var k = j - 1; while (k >= 0 && /\s/.test(code[k])) k--;
        if (k < 0 || /[=(,:;!&|?{}[\n+\-*%~^<>]/.test(code[k])) { inRe = true; continue; }
      }
      if (c === '{') depth++;
      else if (c === '}') { depth--; if (depth === 0) return code.slice(start, j + 1); }
    }
    throw new Error('unbalanced: ' + decl);
  }
  function grabVar(name) {
    var re = new RegExp('var ' + name.replace(/\$/g, '\\$') + ' = [^;]*;');
    var m = re.exec(code);
    if (!m) throw new Error('var not found: ' + name);
    return m[0];
  }
  function grabObjVar(name) {
    var re = new RegExp('var ' + name + ' = \\{[\\s\\S]*?\\n    \\};');
    var m = re.exec(code);
    if (!m) throw new Error('object var not found: ' + name);
    return m[0];
  }

  // ---- 0. Static facts about the shipped source -------------------------
  ok('static: _vizClearPreviewChrome is defined', code.indexOf('function _vizClearPreviewChrome(') !== -1);
  var _hidePairs = (code.match(/\$\('#vizChart'\)\.hide\(\);\n\s+_vizClearPreviewChrome\(\);/g) || []).length;
  eq('static: every canvas-hide in the preview clears the cog (4 early exits + restore)', _hidePairs, 5);
  // In the render path the helper call sits directly above the filter-state
  // cache reset (the five lines it replaced used to). Anchoring on that comment
  // keeps this from matching one of the early-exit calls further up.
  ok('static: the render path clears the previous cog through the helper',
     /_vizClearPreviewChrome\(\);\n\s+\/\/ Clear cached panel HTML so the filter panel rebuilds fresh/.test(code));
  ok('static: getSmartVizDefaults treats doughnut like pie',
     /chartType === 'pie' \|\| chartType === 'doughnut'/.test(grab('function getSmartVizDefaults(')));
  ok('static: data builder buckets a series token before the cardinality guard',
     /_gbRepurposed && String\(groupBy\)\.indexOf\(':'\) !== -1\) \{\n\s+rowDataMaps = vizBucketRowsForAxis\(rowDataMaps, groupBy\);/.test(code));
  ok('static: default series order uses the bucket comparator for a token',
     /getCustomSortComparator\(groupBy\) : null;\n\s+if \(typeof _gkCmp === 'function'\) groupKeys\.sort\(_gkCmp\); else groupKeys\.sort\(\);/.test(code));
  ok('static: Group By dropdown receives the bucket variants', /groupSelect\.append\(_vOpt\);/.test(grab('function populateVisualizationColumns(')));
  ok('static: restoreVizConfig ensures a token option before selecting Group By',
     /_vizEnsureGroupOption\(c\.groupBy\);\n\s+setSelectCaseInsensitive\(\$\('#vizGroupBy'\), c\.groupBy\);/.test(grab('function restoreVizConfig(')));
  ok('static: applier ensures the series token and sets a smart legend',
     /_vizEnsureGroupOption\(mapped\.config\.groupBy\);[\s\S]*getSmartVizDefaults\(_autoType/.test(grab('function _vizApplyAutoConfig(')));
  ok('static: applier never warns about a Limit on a gauge', /_autoType !== 'gauge'/.test(grab('function _vizApplyAutoConfig(')));
  // Round 2 (same day): one render, filtering on by default, rail = scroll bar.
  ok('static: applier cancels the title debounce before its single render',
     /\$\('#autoTitleBtn'\)\.trigger\('click'\);[\s\S]{0,700}clearTimeout\(window\.vizTitleDebounce\);\s*\n\s*if \(typeof window\.vizRunLiveUpdate === 'function'\) window\.vizRunLiveUpdate\(\);/.test(grab('function _vizApplyAutoConfig(')));
  ok('static: applier turns viewer filtering on (X unless gauge/histogram/scatter, series when there is one)',
     /mapped\.config\.filterXAxis = !_VIZ_AUTO_NO_XFILTER\[_autoType\];\s*\n\s*mapped\.config\.filterGroup = !!_autoGroup && VIZ_NO_GROUP\.indexOf\(_autoType\) === -1;/.test(grab('function _vizApplyAutoConfig(')));
  ok('static: the no-X-filter table names exactly gauge, histogram, scatter',
     /var _VIZ_AUTO_NO_XFILTER = \{ gauge: 1, histogram: 1, scatter: 1 \};/.test(code));
  ok('static: carousel rail has pointer handlers (down/move/up) that scroll #vizTypeSelector',
     /pointerdown\.vizRail[\s\S]{0,2500}pointermove\.vizRail[\s\S]{0,900}pointerup\.vizRail pointercancel\.vizRail/.test(code));
  ok('static: rail jump centres the thumb on the click', /frac \* t\.scrollWidth - t\.clientWidth \/ 2/.test(code));
  ok('static: rail drag scale is scrollWidth over rail width', /scale: t\.scrollWidth \/ Math\.max\(1, r\.width\)/.test(code));
  ok('static: vizSyncCarousel reports aria-valuenow on the rail', /aria-valuenow/.test(grab('function vizSyncCarousel(')));
  // autoviz (2026-11-02): a deliberately picked type is kept by Auto-build.
  ok('static: the deliberate-type flag exists', /var _vizTypeTouched = false;/.test(code));
  ok('static: a tile click sets the flag', /\$\(this\)\.addClass\('active'\);\n\n\s*\/\/ A clicked tile[^\n]*\n\s*_vizTypeTouched = true;/.test(code));
  ok('static: reset clears the flag', /_vizLimitTouched = false;\n\s*_vizTypeTouched = false;/.test(code));
  ok('static: opening on a saved chart sets the flag', /restoreVizConfig\(lastVisConfig\);\n[\s\S]{0,200}_vizTypeTouched = true;/.test(code));
  ok('static: the auto-build click consults the flag, never the bare active tile', /var _selType = _vizTypeTouched \? \(\$\('\.viz-type-option\.active'\)\.data\('type'\) \|\| ''\) : '';/.test(code));
  ok('static: the infeasible notice names the suggested type', /Try it as a <strong>" \+ escapeHtml\(_sugLabel\)/.test(code));
  ok('static: a kept type is announced in the HEADS UP', /Kept the selected ' \+ _selLabel \+ ' type/.test(code));
  ok('static: the applier writes axis titles for axis types only', /VIZ_NO_AXIS_LABELS\.indexOf\(_autoType\) === -1 && _autoType !== 'gantt'/.test(grab('function _vizApplyAutoConfig(')));
  eq('static: all three Auto-build tips say a picked type is kept', (code.match(/A chart type you have already picked is kept/g) || []).length, 3);
  // autoviz3 (2026-11-03): a fresh query keys cni by the SQL alias AS RETURNED
  // (mixed case stays), while headers are uppercased - the props lookup and the
  // type glyph both need a case-insensitive fallback (UnderRev's "no date columns").
  ok('static: props lookup falls back to a case-insensitive key match',
     /var _want = String\(colName\)\.toUpperCase\(\);/.test(grab('function _vizPropsForCol(')));
  ok('static: the type glyph falls back the same way',
     /String\(_gk\)\.toUpperCase\(\) === key\.toUpperCase\(\)/.test(code));
  // gone (2026-11-03): a Gantt end may be FIXED - '@today' / '@date:YYYY-MM-DD'.
  ok('static: the data builder reads a fixed end for every row',
     /var e = \(gtEndFixed !== null\) \? gtEndFixed : _vizDateMs\(map\.get\(gtEndCol\)\);/.test(code));
  eq('static: all three End Date reads go through _vizGanttEndVal', (code.match(/_vizGanttEndVal\(\) \|\| /g) || []).length, 3);
  ok('static: a report with no end-like column prefills Today', /if \(!guess\) guess = '@today';/.test(code));
  eq('static: the prefill guess never lands on a fixed-choice option', (code.match(/v\.charAt\(0\) === '@' \|\| v\.toUpperCase\(\) === start/g) || []).length, 2);

  // ---- 1. Sandbox: real readers + shape rules, stubbed DOM ----------------
  var stubs = [
    // pivot token grammar - enough of it for COL and COL:split
    'function pivotParseFieldToken(t){ t=String(t==null?"":t); var i=t.indexOf(":"); if(i===-1) return {base:t, split:""}; var sp=t.slice(i+1); var m=/^(bin)(\\d+)$/.exec(sp); return {base:t.slice(0,i), split: m?m[1]:sp, binWidth: m?+m[2]:undefined}; }',
    'function pivotFieldBase(t){ return pivotParseFieldToken(t).base; }',
    'function pivotFieldDisplayLabel(t){ var p=pivotParseFieldToken(t); return p.split? p.base+" ("+p.split+")" : p.base; }',
    'function pivotPercentileP(a){ var m=/^p(\\d{1,2})$/.exec(String(a||"")); return m? +m[1] : null; }',
    'function pivotWavgWeightCol(a){ var m=/^wavg@(.+)$/.exec(String(a||"")); return m? m[1] : null; }',
    // date granularity per column, set by the scenario (2 = day, 0 = year, -1 = not a date)
    'var DATEGRAN = {}; function _pivotFieldDateGran(b){ var k=String(b||"").toUpperCase(); return DATEGRAN.hasOwnProperty(k)? DATEGRAN[k] : -1; }',
    'function parseDate(s){ s=String(s).trim(); var m=/^(\\d{4})-(\\d{2})-(\\d{2})$/.exec(s); if(m) return {date:new Date(+m[1],+m[2]-1,+m[3]), granularity:"day"}; m=/^(\\d{1,2})\\/(\\d{1,2})\\/(\\d{4})$/.exec(s); if(m) return {date:new Date(+m[3],+m[1]-1,+m[2]), granularity:"day"}; m=/^(\\d{4})$/.exec(s); if(m) return {date:new Date(+m[1],0,1), granularity:"year"}; return null; }',
    // the axis bucketer, minimal: fy / year / ym / month / bin
    'function vizBucketRowsForAxis(rows, tok){ var p=pivotParseFieldToken(tok); if(!p.split||!rows||!rows.length) return rows; var key=String(tok).toUpperCase(), base=p.base.toUpperCase(); return rows.map(function(m){ var raw=m.get(base), d=parseDate(String(raw==null?"":raw)), lab=""; if(p.split==="bin"){ var n=parseFloat(String(raw).replace(/[$,]/g,"")); lab=isNaN(n)?"":String(Math.floor(n/1000)*1000); } else if(d&&d.date){ var y=d.date.getFullYear(), mo=d.date.getMonth(); if(p.split==="fy") lab="FY"+String((mo>=6?y+1:y)).slice(2); else if(p.split==="year") lab=String(y); else if(p.split==="ym") lab=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][mo]+" "+y; else if(p.split==="month") lab=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"][mo]; else if(p.split==="yq") lab=y+" Q"+(Math.floor(mo/3)+1); else lab=String(raw); } var c=new Map(m); c.set(key, lab); return c; }); }',
    // module state the readers consult
    'var currentGroupingColumn = "", currentGroupingColumns = [], currentGroupAgg = null, _lastPivotChart = null;',
    // the DOM stand-in: one shared state object, swapped per scenario
    'var DOM = { cols: [], props: {}, cni: {}, pivotVisible: false, groupedVisible: false };',
    'function $(sel){',
    '  if (sel && sel.__col) return { data: function(){ return sel.__col; } };',
    '  if (sel === "#resultsTable thead th[data-colname]") return { length: DOM.cols.length, each: function(fn){ DOM.cols.forEach(function(c){ fn.call({__col:c}); }); } };',
    '  if (sel === "#resultsTable") return { data: function(k){ return k === "columnProperties" ? DOM.props : DOM.cni; } };',
    '  if (sel === "#pivot-output-container") return { is: function(){ return !!DOM.pivotVisible; } };',
    '  if (sel === "#groupedResultsContainer") return { is: function(){ return !!DOM.groupedVisible; } };',
    '  return { length: 0, val: function(){ return ""; }, is: function(){ return false; }, data: function(){ return undefined; }, find: function(){ return this; }, filter: function(){ return this; }, each: function(){}, text: function(){ return ""; } };',
    '}'
  ].join('\n');

  var real = [
    grabVar('_VIZ_ID_NAME_RE'), grabVar('_VIZ_TIME_SPLITS'), grabVar('_VIZ_PERIOD_NAME_RE'),
    grabVar('_VIZ_NOT_MEASURE_RE'), grabVar('_VIZ_ADDITIVE_AGGS'), grabVar('_VIZ_SPLIT_WORDS'),
    grabVar('PENUMBRA_VIZ_AGGS'), grabObjVar('_GROUP_AGG_LABELS'),
    grab('function _vizXLabelStats('), grab('function _vizDistinctCount('), grab('function _vizScoreXCandidate('),
    grab('function _vizPickAutoType('), grab('function _vizXIsSequence('), grab('function _vizAutoSort('),
    grab('function _vizAutoDateSplit('), grab('function _vizDistinctCountTok('), grab('function _vizColHasNegative('),
    grab('function _vizColLooksLikeYear('), grab('function _vizPickAutoMeasure('), grab('function _vizSplitWord('),
    grab('function _vizAutoShape('), grab('function _vizPropsForCol('), grab('function _vizChartableCols('),
    grab('function _vizCanAgg('), grab('function groupsToVizConfig('), grab('function reportToVizConfig('),
    grab('function pivotToVizConfig('), grab('function _vizAutoSource('), grab('function getSmartVizDefaults('),
    // autoviz (2026-11-02): auto-build keeps a deliberately picked type
    grab('function _vizAutoColClasses('), grab('function _vizAutoMeasureList('), grab('function _vizAutoSecondCat('),
    grab('function _vizAutoStateCol('), grab('function _vizAutoGanttDates('), grabVar('_VIZ_AGG_TITLE_WORDS'),
    grab('function _vizAutoYAxisTitle('), grab('function _vizAutoRetype('),
    // gone (2026-11-03): the retype gantt case words a fixed end through this
    grab('function _vizGanttEndFixedLabel(')
  ].join('\n');

  var SB = new Function(stubs + '\n' + real + '\n' +
    'return { DOM: DOM, DATEGRAN: DATEGRAN, set: function(k, v){ eval(k + " = v"); },' +
    ' isSeq: _vizXIsSequence, autoSort: _vizAutoSort, dateSplit: _vizAutoDateSplit, distinctTok: _vizDistinctCountTok,' +
    ' hasNeg: _vizColHasNegative, looksYear: _vizColLooksLikeYear, pickMeasure: _vizPickAutoMeasure, shape: _vizAutoShape,' +
    ' score: _vizScoreXCandidate, groups: groupsToVizConfig, report: reportToVizConfig, pivot: pivotToVizConfig,' +
    ' source: _vizAutoSource, smart: getSmartVizDefaults,' +
    ' classes: _vizAutoColClasses, mlist: _vizAutoMeasureList, secondCat: _vizAutoSecondCat,' +
    ' stateCol: _vizAutoStateCol, ganttDates: _vizAutoGanttDates, ytitle: _vizAutoYAxisTitle, retype: _vizAutoRetype };')();

  // ---- scenario builders -------------------------------------------------
  // defs: [[name, kind]] kind = text | money | num | date | bool | year(=date at year granularity)
  function setTable(defs) {
    SB.DOM.cols = ['#'].concat(defs.map(function (d) { return d[0]; }));
    SB.DOM.props = {}; SB.DOM.cni = {};
    for (var k in SB.DATEGRAN) delete SB.DATEGRAN[k];
    defs.forEach(function (d, i) {
      SB.DOM.cni[d[0].toUpperCase()] = i;
      SB.DOM.props[i] = { isCurrency: d[1] === 'money', isDate: d[1] === 'date' || d[1] === 'year', isNumeric: d[1] === 'num', isBoolean: d[1] === 'bool' };
      if (d[1] === 'date') SB.DATEGRAN[d[0].toUpperCase()] = 2;
      if (d[1] === 'year') SB.DATEGRAN[d[0].toUpperCase()] = 0;
    });
  }
  function setRows(n, fn) {
    var out = [];
    for (var i = 0; i < n; i++) {
      var o = fn(i), m = new Map();
      Object.keys(o).forEach(function (k) { m.set(k.toUpperCase(), o[k]); });
      out.push(m);
    }
    window.vizCachedData = out;
    return out;
  }
  function iso(y, m, d) { return y + '-' + ('0' + m).slice(-2) + '-' + ('0' + d).slice(-2); }
  var STATUS = ['Active', 'Closed', 'Pending'];
  var SPONSORS = ['NSF', 'DOD', 'DOE', 'USDA', 'DHHS'];
  var LONG = ['Educational and Research Institutions', 'Business and Industry', 'Nonprofit Organization', 'US Federal', 'Association'];

  // The live report the audit ran against (awdspon): FY is a DATE at year
  // granularity, AMOUNT is money, LOG_DATE a full date, the rest text.
  var AWD = [['FY', 'year'], ['AMOUNT', 'money'], ['PRIME_SPONSOR_CATEGORY', 'text'], ['DIRECT_SPONSOR_NAME', 'text'],
             ['RED_PT_ID', 'text'], ['ORIGINATING SPONSOR', 'text'], ['LOG_DATE', 'date'], ['TRANSACTION_TYPE', 'text']];
  function awdRows(n, prime) {
    return setRows(n, function (i) {
      var y = 2022 + (i % 5);
      return { FY: String(y + 1), AMOUNT: '$' + (1000 + (i * 37) % 9000) + '.00',
               PRIME_SPONSOR_CATEGORY: prime || ['US Federal', 'State', 'Industry'][i % 3],
               DIRECT_SPONSOR_NAME: 'Sponsor ' + (i % 40), RED_PT_ID: 'P' + (100000 + i),
               'ORIGINATING SPONSOR': SPONSORS[i % 5], LOG_DATE: iso(y, 1 + (i % 12), 1 + (i % 27)),
               TRANSACTION_TYPE: ['New', 'Continuation'][i % 2] };
    });
  }

  // ---- 2. Sequence detection + sort ---------------------------------------
  setTable(AWD); awdRows(200);
  ok('seq: FY (date @ year granularity) is a sequence', SB.isSeq('FY'));
  ok('seq: a bucket token is a sequence', SB.isSeq('LOG_DATE:fy'));
  ok('seq: a full date column is a sequence', SB.isSeq('LOG_DATE'));
  ok('seq: STATUS-like text is not', !SB.isSeq('TRANSACTION_TYPE'));
  ok('seq: a PERIOD name is a sequence even as unknown text', SB.isSeq('FISCAL_YEAR'));
  ok('seq: QTR name', SB.isSeq('AWARD_QTR'));
  ok('seq: "FYI_NOTES" does not match the FY pattern', !SB.isSeq('FYI_NOTES'));
  eq('sort: sequence -> label asc', SB.autoSort('FY'), { sortBy: 'label', sortDir: 'asc' });
  eq('sort: category -> value desc', SB.autoSort('TRANSACTION_TYPE'), { sortBy: 'value', sortDir: 'desc' });
  eq('sort: token -> label asc', SB.autoSort('AMOUNT:bin'), { sortBy: 'label', sortDir: 'asc' });

  // ---- 3. Date split from span ---------------------------------------------
  eq('dateSplit: ~4.9y of dates -> quarters', SB.dateSplit('LOG_DATE'), 'yq');
  setRows(60, function (i) { return { LOG_DATE: iso(2025, 1 + (i % 12), 1 + (i % 28)) }; });
  eq('dateSplit: one year of dates -> months', SB.dateSplit('LOG_DATE'), 'ym');
  setRows(60, function (i) { return { LOG_DATE: iso(2010 + (i % 15), 1 + (i % 12), 3) }; });
  eq('dateSplit: 15 years of dates -> years', SB.dateSplit('LOG_DATE'), 'year');
  eq('dateSplit: a bare-year column is already a bucket -> none', SB.dateSplit('FY'), '');
  eq('dateSplit: not a date -> none', SB.dateSplit('TRANSACTION_TYPE'), '');
  eq('dateSplit: date column with no cached rows -> months (safe default)', (function () { var keep = window.vizCachedData; window.vizCachedData = []; var r = SB.dateSplit('LOG_DATE'); window.vizCachedData = keep; return r; })(), 'ym');

  // ---- 4. Distinct-through-a-token, negatives, year-like, measure pick ----
  awdRows(200);
  eq('distinctTok: LOG_DATE:fy resolves to fiscal years, not dates', SB.distinctTok('LOG_DATE:fy'), 6);
  eq('distinctTok: plain column', SB.distinctTok('ORIGINATING SPONSOR'), 5);
  eq('distinctTok: nothing cached -> -1', (function () { var keep = window.vizCachedData; window.vizCachedData = []; var r = SB.distinctTok('FY'); window.vizCachedData = keep; return r; })(), -1);
  ok('hasNeg: all-positive money -> false', !SB.hasNeg('AMOUNT'));
  setRows(20, function (i) { return { AMT: i === 7 ? '($1,200.00)' : '$50.00' }; });
  ok('hasNeg: accounting parenthesis negative -> true', SB.hasNeg('AMT'));
  setRows(20, function (i) { return { AMT: i === 3 ? '-15' : '12' }; });
  ok('hasNeg: leading minus -> true', SB.hasNeg('AMT'));
  setRows(20, function (i) { return { AMT: i === 3 ? '(0)' : '12' }; });
  ok('hasNeg: a bracketed zero is not negative', !SB.hasNeg('AMT'));
  setRows(30, function (i) { return { YRC: String(2019 + (i % 6)), CNT: String(i % 9), BIG: String(1900 + i * 10) }; });
  ok('looksYear: 2019..2024 values look like years', SB.looksYear('YRC'));
  ok('looksYear: small counts do not', !SB.looksYear('CNT'));
  ok('looksYear: 4-digit values past 2100 do not', !SB.looksYear('BIG'));
  eq('measure: money wins', SB.pickMeasure(['AMOUNT'], ['CNT']), 'AMOUNT');
  eq('measure: id / fy / zip numerics are skipped for a real count', SB.pickMeasure([], ['EMPLID', 'FY', 'ZIP', 'SUBAWARD_COUNT']), 'SUBAWARD_COUNT');
  eq('measure: only codes -> none (count rows instead)', SB.pickMeasure([], ['EMPLID', 'ZIP_CODE', 'RECORD_NO']), '');
  eq('measure: year-like VALUES are skipped whatever the name', SB.pickMeasure([], ['YRC', 'CNT']), 'CNT');

  // ---- 5. Shape rules ------------------------------------------------------
  setTable(AWD); awdRows(200);
  var s;
  s = SB.shape({ xAxis: 'TRANSACTION_TYPE', groupBy: 'none', agg: 'sum', yAxis: 'AMOUNT', warnings: [] });
  eq('shape: 2 categories, sum of non-negative money -> doughnut', [s.type, s.horizontal, s.stacked], ['doughnut', false, false]);
  s = SB.shape({ xAxis: 'PRIME_SPONSOR_CATEGORY', groupBy: 'none', agg: 'count', yAxis: '', warnings: [] });
  eq('shape: 3 categories, count -> doughnut', s.type, 'doughnut');
  s = SB.shape({ xAxis: 'PRIME_SPONSOR_CATEGORY', groupBy: 'none', agg: 'avg', yAxis: 'AMOUNT', warnings: [] });
  eq('shape: average is not additive -> bar', s.type, 'bar');
  s = SB.shape({ xAxis: 'FY', groupBy: 'none', agg: 'sum', yAxis: 'AMOUNT', warnings: [] });
  eq('shape: 5 fiscal years are a sequence -> bar, upright', [s.type, s.horizontal], ['bar', false]);
  s = SB.shape({ xAxis: 'ORIGINATING SPONSOR', groupBy: 'none', agg: 'sum', yAxis: 'AMOUNT', warnings: [] });
  eq('shape: 5 sponsors, sum -> doughnut', s.type, 'doughnut');
  s = SB.shape({ xAxis: 'ORIGINATING SPONSOR', groupBy: 'FY', agg: 'sum', yAxis: 'AMOUNT', warnings: [] });
  eq('shape: 5 sponsors x 5 FY series, sum -> stacked upright bar', [s.type, s.stacked, s.horizontal, s.groupBy], ['bar', true, false, 'FY']);
  s = SB.shape({ xAxis: 'ORIGINATING SPONSOR', groupBy: 'FY', agg: 'avg', yAxis: 'AMOUNT', warnings: [] });
  eq('shape: 5 x 5 series but AVERAGE never stacks', s.stacked, false);

  eq('retype scatter: two measures -> one against the other', [rt.ok, m10.config.xAxis, m10.config.yAxis, m10.sortBy], [true, 'AMOUNT', 'HEADCOUNT', 'label']);
  m10 = SB.report();
  rt = SB.retype('butterfly', 'Butterfly', m10);
  eq('retype butterfly: a side per measure', [rt.ok, m10.config.comboSeries[0].col, m10.config.comboSeries[1].col], [true, 'AMOUNT', 'HEADCOUNT']);
  m10 = SB.report();
  rt = SB.retype('combo', 'Combo', m10);
  eq('retype combo: two measures -> sum line, single axis', [rt.ok, m10.config.comboSeries[1].col, m10.config.comboSeries[1].agg, m10.config.horizontal], [true, 'HEADCOUNT', 'sum', false]);
  m10 = SB.report();
  rt = SB.retype('box', 'Box Plot', m10);
  eq('retype box: category plus the measure', [rt.ok, m10.config.xAxis, m10.config.yAxis], [true, 'DEPT', 'AMOUNT']);

  // box with no measure refused
  setTable([['DEPT', 'text'], ['NOTE', 'text']]);
  setRows(30, function (i) { return { DEPT: 'Dept ' + (i % 4), NOTE: 'n' + i }; });
  m10 = SB.report();
  rt = SB.retype('box', 'Box Plot', m10);
  ok('retype box: no measure refused', !rt.ok && /no money or number column/.test(rt.reason), rt.reason);

  // gantt wants a start/end date pair and a near-unique label
  setTable([['TASK', 'text'], ['START_DATE', 'date'], ['END_DATE', 'date'], ['AMOUNT', 'money']]);
  setRows(40, function (i) { return { TASK: 'Task ' + i, START_DATE: iso(2025, 1 + (i % 12), 1 + (i % 25)), END_DATE: iso(2026, 1 + (i % 12), 1 + (i % 25)), AMOUNT: '$' + i }; });
  eq('ganttDates: end found by name, start is the other', SB.ganttDates(['START_DATE', 'END_DATE']), { start: 'START_DATE', end: 'END_DATE' });
  eq('ganttDates: neutral names fall back to table order', SB.ganttDates(['DATE_A', 'DATE_B']), { start: 'DATE_A', end: 'DATE_B' });
  eq('ganttDates: one date column -> null', SB.ganttDates(['START_DATE']), null);
  m10 = SB.report();
  rt = SB.retype('gantt', 'Gantt', m10);
  eq('retype gantt: label / start / end wired (end rides groupBy)', [rt.ok, m10.config.xAxis, m10.config.yAxis, m10.config.groupBy], [true, 'TASK', 'START_DATE', 'END_DATE']);
  eq('retype gantt: sorted by start date ascending', [m10.sortBy, m10.sortDir], ['value', 'asc']);
  setTable(AWD); awdRows(200);
  m10 = SB.report();
  rt = SB.retype('gantt', 'Gantt', m10);
  ok('retype gantt: a lone date-class pair fails honestly when only one real pair is absent', !rt.ok || (m10.config.yAxis && m10.config.groupBy), rt.reason);
  // gone (2026-11-03): ONE date column still drives a Gantt - start to '@today'
  setTable([['PAM_NUMBER', 'text'], ['UNDER_REVIEW_SINCE', 'date'], ['ASSIGNED_TO', 'text']]);
  setRows(40, function (i) { return { PAM_NUMBER: 'PAM' + i, UNDER_REVIEW_SINCE: iso(2025, 1 + (i % 12), 1 + (i % 25)), ASSIGNED_TO: ['Pat', 'Sam', 'Lee'][i % 3] }; });
  m10 = SB.report();
  rt = SB.retype('gantt', 'Gantt', m10);
  eq('retype gantt: one date column -> start to @today (age chart)', [rt.ok, m10.config.yAxis, m10.config.groupBy], [true, 'UNDER_REVIEW_SINCE', '@today']);
  has('retype gantt: the HEADS UP says "to today" in words', m10.warnings, /^Each bar runs UNDER_REVIEW_SINCE to today, labelled by PAM_NUMBER/);
  setTable([['A', 'text'], ['B', 'text']]);
  setRows(10, function (i) { return { A: 'a' + i, B: 'b' + i }; });
  m10 = SB.report();
  rt = SB.retype('gantt', 'Gantt', m10);
  ok('retype gantt: no date columns refused', !rt.ok && /no date columns/.test(rt.reason), rt.reason);
  setTable(AWD); awdRows(200);   // the sankey block below reads this table

  // sankey: a second category column becomes Stage 2
  m10 = SB.report();
  rt = SB.retype('sankey', 'Sankey', m10);
  ok('retype sankey: ok with a second category as Stage 2', rt.ok && m10.config.groupBy && m10.config.groupBy !== 'none' && m10.config.groupBy !== 'PRIME_SPONSOR_CATEGORY', JSON.stringify(m10.config));
  has('retype sankey: flow explained', m10.warnings, /^Flowing PRIME_SPONSOR_CATEGORY into /);
  setTable([['RECORD_ID', 'text'], ['STATUS', 'text'], ['AMOUNT', 'money']]);
  setRows(80, function (i) { return { RECORD_ID: 'R' + i, STATUS: STATUS[i % 3], AMOUNT: '$' + i }; });
  m10 = { config: { type: 'bar', xAxis: 'STATUS', yAxis: 'AMOUNT', groupBy: 'none', agg: 'sum' }, warnings: [] };
  rt = SB.retype('sankey', 'Sankey', m10);
  ok('retype sankey: no usable second category refused', !rt.ok && /second category column/.test(rt.reason), rt.reason);

  // map: a column of US states, resolved through the (stubbed) chart module
  setTable([['STATE', 'text'], ['AMOUNT', 'money']]);
  setRows(40, function (i) { return { STATE: ['NC', 'VA', 'GA', 'TX'][i % 4], AMOUNT: '$' + (10 + i) }; });
  window.PenumbraCharts = { armed: true, _vizResolveState: function (v) { var S = { NC: 1, VA: 1, GA: 1, TX: 1 }; return S[String(v).trim()] ? { code: v } : null; } };
  m10 = SB.report();
  rt = SB.retype('map', 'Map', m10);
  eq('retype map: the state column is found and measured', [rt.ok, m10.config.xAxis, m10.config.yAxis, m10.config.agg], [true, 'STATE', 'AMOUNT', 'sum']);
  delete window.PenumbraCharts;
  m10 = SB.report();
  rt = SB.retype('map', 'Map', m10);
  ok('retype map: no armed module -> refused with the state-column reason', !rt.ok && /US state names or codes/.test(rt.reason), rt.reason);

  // a single-row KPI cannot drive a category chart
  setTable([['DEPT', 'text'], ['TOTAL', 'money']]);
  setRows(1, function () { return { DEPT: 'Chemistry', TOTAL: '$5.00' }; });
  m10 = SB.report();                                      // auto = gauge
  rt = SB.retype('bar', 'Bar', m10);
  ok('retype on one row: category charts refused', !rt.ok && /single row/.test(rt.reason), rt.reason);

  // Y-axis titles, the applier's vocabulary
  eq('ytitle: sum', SB.ytitle('bar', 'sum', 'AMOUNT'), 'Total AMOUNT');
  eq('ytitle: count', SB.ytitle('bar', 'count', ''), 'Count of Records');
  eq('ytitle: histogram always counts', SB.ytitle('histogram', 'count', ''), 'Count of Records');
  eq('ytitle: percentile', SB.ytitle('bar', 'p90', 'AMT'), 'P90 AMT');
  eq('ytitle: scatter names the column alone', SB.ytitle('scatter', 'sum', 'HEADCOUNT'), 'HEADCOUNT');

  // ---- 11. Mixed-case SQL aliases (autoviz3, 2026-11-03) -------------------
  // A fresh query keys columnNameToOriginalIndex by the alias AS RETURNED,
  // while the header names every helper passes are uppercased. UnderRev's
  // quoted aliases ("Under_Review_Since") then classified every column as
  // text, and a Gantt Auto-build claimed the report had no date columns.
  setTable([['PAM_NUMBER', 'text'], ['PAM_TITLE', 'text'], ['WORKFLOW_CREATED', 'date'], ['UNDER_REVIEW_SINCE', 'date'], ['ASSIGNED_TO', 'text']]);
  SB.DOM.cni = { 'PAM_Number': 0, 'PAM_Title': 1, 'Workflow_Created': 2, 'Under_Review_Since': 3, 'Assigned_To': 4 };
  setRows(40, function (i) { return { PAM_NUMBER: 'PAM' + (1000 + i), PAM_TITLE: 'Title ' + i, WORKFLOW_CREATED: iso(2024, 1 + (i % 12), 1 + (i % 25)), UNDER_REVIEW_SINCE: iso(2026, 1 + (i % 12), 1 + (i % 25)), ASSIGNED_TO: ['Pat', 'Sam', 'Lee'][i % 3] }; });
  var cls11 = SB.classes();
  eq('mixedcase: date columns classify as dates through the case-insensitive fallback', cls11.date, ['WORKFLOW_CREATED', 'UNDER_REVIEW_SINCE']);
  eq('mixedcase: the rest stay text', cls11.text, ['PAM_NUMBER', 'PAM_TITLE', 'ASSIGNED_TO']);
  m10 = SB.report();
  rt = SB.retype('gantt', 'Gantt', m10);
  eq('mixedcase: gantt retype finds the date pair (start / end rides groupBy)', [rt.ok, m10.config.yAxis, m10.config.groupBy], [true, 'WORKFLOW_CREATED', 'UNDER_REVIEW_SINCE']);

} catch (e) {
  FAIL++; LOG.push('HARNESS-ERROR ' + (e && e.stack || e));
}
document.getElementById('out').textContent = 'pass=' + PASS + ' fail=' + FAIL + '\n' + LOG.join('\n');
document.title = 'done';
</script>
