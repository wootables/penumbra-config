<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="main.css"><link rel="stylesheet" href="penumbra_tiles.css"><link rel="stylesheet" href="penumbra_dashboard.css">
</head><body class="pnb-dash theme-wolfpack-dark is-dark">
<!-- The list option on the Controls tile (2026-10-01): 'Label|COLUMN|list' draws a
     type-to-find box over a scrolling column of every value (no "+n more"), each row
     a chip with its single-source count. Typing hides the rows it misses in place,
     without a filter change; Enter presses the first row showing that is not pressed;
     the typed text survives the redraw the filter change causes, the pressed rows
     come first, focus stays in the box; a typed filter presses its row and never
     leaves it hidden; Clear all keeps the typed text. The tile editor's "list" box is
     authored, saved and re-opened (off while range is ticked; show N off while list
     is ticked). Same stubbed server and scaffolding as controls4.html. -->
<div id="dashApp" class="dash-app"><header class="dash-head" id="dashHead">
  <div class="dash-head-title" id="dashHeadTitle"></div>
  <div class="dash-head-actions" id="dashHeadActions"></div>
</header><main id="dashMain"></main></div>
<pre id="out">running</pre>
<script src="jquery-3.7.1.min.js"></script>
<script src="chart-4.5.1.min.js"></script>
<script>
var CALLS = [], ERRORS = [], REPLACED = [], AJAX = [], ALERTS = [];
window.onerror = function (m, src, line) { ERRORS.push('onerror: ' + m + ' @' + String(src).split('/').pop() + ':' + line); };
history.replaceState = function (s, t, u) { REPLACED.push(String(u)); };
window.alert = function (m) { ALERTS.push(String(m)); };
window.confirm = function () { return true; };
jQuery.fx.off = true;

// repA: 20 rows, SPONSOR P01..P15 then P01..P05 again, COLLEGE Eng on odd rows and
// Sci on even, AMOUNT = the row number (sum 210; Eng rows sum 100).
var REP = { repA: [] };
for (var i = 1; i <= 20; i++) {
  var n = i <= 15 ? i : i - 15;
  REP.repA.push({ SPONSOR: 'P' + (n < 10 ? '0' + n : String(n)), COLLEGE: i % 2 ? 'Eng' : 'Sci', AMOUNT: String(i) });
}
function num(v) {
  var t = String(v).trim(), neg = /^\(.*\)$/.test(t);
  t = t.replace(/[()$,%]/g, '');
  if (!/^-?\d*\.?\d+$/.test(t)) { return null; }
  return (neg ? -1 : 1) * parseFloat(t);
}
function cond(row, part) {
  var m = part.match(/^\s*(\w+)\s*(>=|<=|!=|=|>|<)\s*(.+?)\s*$/);
  if (!m) { return false; }
  var v = row[m[1].toUpperCase()];
  if (v === undefined) { return false; }
  var rx = /^\/(.*)\/i?$/.exec(m[3]);
  if (rx) { var hit = new RegExp(rx[1], 'i').test(String(v)); return m[2] === '!=' ? !hit : hit; }
  var a = num(v), b = num(m[3]);
  if (a === null || b === null) { return m[2] === '=' ? String(v).toLowerCase() === m[3].toLowerCase() : false; }
  switch (m[2]) { case '>=': return a >= b; case '<=': return a <= b; case '>': return a > b; case '<': return a < b; case '=': return a === b; default: return a !== b; }
}
function filt(rows, text) {
  if (!text) { return rows; }
  var ors = text.split(/\s+or\s+/i).map(function (s) { return s.split(/\s+and\s+/i); });
  return rows.filter(function (r) { return ors.some(function (ands) { return ands.every(function (p) { return cond(r, p); }); }); });
}
function routeStub(ds, cols) {
  var spec = JSON.parse(ds), keep = [], skipped = [];
  spec.f.forEach(function (fr) {
    var c = String(fr[0] || '').toUpperCase();
    if (!c || cols.indexOf(c) > -1) { keep.push(fr[1]); } else if (skipped.indexOf(c) < 0) { skipped.push(c); }
  });
  return { text: keep.length ? (spec.p || '') + keep.join(' and ') : '', skipped: skipped };
}
$.getJSON = function (url, params) {
  params = params || {};
  CALLS.push({ url: url, p: $.extend({}, params) });
  var d = $.Deferred();
  setTimeout(function () {
    if (url === 'index.php') {
      var rows = REP[params.id];
      if (!rows) { d.resolve({ data: [{ ERROR: 'Report Not Found (ID: ' + params.id + ')' }] }); return; }
      var resp = { columns: Object.keys(REP[params.id][0]).concat(['#']) };
      if (params.search) { rows = filt(rows, params.search); }
      if (params.dsearch) {
        var r = routeStub(params.dsearch, Object.keys(REP[params.id][0]));
        rows = filt(rows, r.text);
        resp.search_skipped = r.skipped;
      }
      if (params.limit && rows.length > params.limit) { resp.total_rows = rows.length; rows = rows.slice(0, params.limit); }
      resp.data = rows;
      d.resolve(resp);
    } else if (url === 'manage_dashboard.php') {
      d.resolve({ status: 'success', data: [] });
    } else { d.reject({ status: 404 }); }
  }, 10);
  return d.promise();
};
$.ajax = function (o) { AJAX.push(o); var d = $.Deferred(); d.resolve({ status: 'success' }); return d.promise(); };

const penumbra_dash_vars = {
  currentUserKey: 'tester', isAdmin: true, canCreate: true, reportGrantPatterns: [],
  shortId: 'ctl6', found: true, canEdit: true,
  shibboleth: { name: 'Ada', fname: 'Ada' },
  meta: { short_id: 'ctl6', title: 'List chips', owner_id: 'tester', authorized: 'tester', updated_at: '' },
  state: { version: 1, theme: 'theme-default', refreshSeconds: 0, tiles: [
    { id: 'c1', type: 'controls', label: 'Filters', strip: ['Sponsor|SPONSOR|list', 'College|COLLEGE', 'labels=left'], w: 12, h: 2 },
    { id: 'd1', type: 'stat', report: 'repA', label: 'A total', agg: 'sum', column: 'AMOUNT', format: 'number', w: 4, h: 1, source: 'live' },
    { id: 'd2', type: 'table', report: 'repA', label: 'Rows', columns: ['SPONSOR', 'AMOUNT'], rows: 5, w: 4, h: 2, source: 'live' }
  ] },
  themes: [{ id: 'theme-default', label: 'Default Light', isDark: false }]
};
</script>
<script src="purify.min.js"></script><script src="penumbra_tiles.js"></script>
<script src="dash.js"></script>
<script>
var L = [];
function ok(n, c, x) { L.push((c ? 'PASS ' : 'FAIL ') + n + (x !== undefined && !c ? '  [' + x + ']' : '')); }
function eq(n, got, want) { ok(n, JSON.stringify(got) === JSON.stringify(want), 'got ' + JSON.stringify(got) + ' want ' + JSON.stringify(want)); }
function tile(id) { return $('.dash-tile[data-tile-id="' + id + '"]'); }
function stat(id) { return tile(id).find('.dash-stat-value').text(); }
function box() { return String($('#dashSearchInput').val()); }
function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function until(fn, ms) {
  var t0 = Date.now();
  return new Promise(function (res) {
    (function poll() { var v = false; try { v = fn(); } catch (e) { } if (v || Date.now() - t0 > ms) { res(!!v); } else { setTimeout(poll, 100); } })();
  });
}
function cs($e) { return ($e && $e.length) ? getComputedStyle($e[0]) : {}; }
function G(col) { return tile('c1').find('.pnb-fs-group[data-fs-col="' + col + '"]'); }
function FIND(col) { return G(col).find('.pnb-fs-find'); }
function chips(col) { return G(col).find('.pnb-fs-chip').map(function () { return $(this).attr('data-fs-val'); }).get(); }
function shown(col) { return G(col).find('.pnb-fs-chip').not('.pnb-fs-hid').map(function () { return $(this).attr('data-fs-val'); }).get(); }
function chip(col, v) { return G(col).find('.pnb-fs-chip').filter(function () { return $(this).attr('data-fs-val') === v; }); }
function pressed(col) { return G(col).find('.pnb-fs-chip[aria-pressed="true"]').map(function () { return $(this).attr('data-fs-val'); }).get(); }
function enter() { return $.Event('keydown', { key: 'Enter', keyCode: 13, which: 13 }); }
function lastState() {
  var a = AJAX[AJAX.length - 1];
  try { return JSON.parse(JSON.parse(a.data).state_data); } catch (e) { return null; }
}
function savedTile(st, id) { return st ? st.tiles.filter(function (x) { return x.id === id; })[0] || null : null; }
function rowList() {
  return $('#teCtlFields .dash-ctl-row').map(function () {
    return [[$(this).find('.teCtlCol').val(), $(this).find('.teCtlList').is(':checked'), $(this).find('.teCtlList').prop('disabled'), $(this).find('.teCtlTop').prop('disabled')]];
  }).get();
}
function publish() {
  var A = 'RES' + 'ULT>>', B2 = '<' + '<FIN';
  document.getElementById('out').textContent = A + L.join(' ;; ') + B2;
}

until(function () { return stat('d1') === '210' && chips('SPONSOR').length === 15 && chips('COLLEGE').length === 2 && chip('SPONSOR', 'P01').find('.pnb-fs-n').length === 1; }, 12000).then(function (ready) {
  ok('the tiles loaded and the chips drew with their counts', ready, 'stat=' + stat('d1') + ' sponsor=' + JSON.stringify(chips('SPONSOR')) + ' n=' + chip('SPONSOR', 'P01').find('.pnb-fs-n').length);
  // ══════ A. drawing ══════
  ok('a list field draws a find box over every value as a row, A to Z, no +n more', G('SPONSOR').hasClass('pnb-fs-list') && G('SPONSOR').attr('data-fs-list') === '1' && FIND('SPONSOR').length === 1 && chips('SPONSOR')[0] === 'P01' && chips('SPONSOR')[14] === 'P15' && shown('SPONSOR').length === 15 && G('SPONSOR').find('.pnb-fs-more').length === 0, G('SPONSOR').html().substring(0, 300));
  eq('the rows carry the single-source counts', [chip('SPONSOR', 'P01').find('.pnb-fs-n').text(), chip('SPONSOR', 'P15').find('.pnb-fs-n').text()], ['2', '1']);
  ok('the plain group beside it is chips', !G('COLLEGE').hasClass('pnb-fs-list') && G('COLLEGE').find('.pnb-fs-find').length === 0, '');
  var c = cs(G('SPONSOR').find('.pnb-fs-chips'));
  ok('the rows stack in a scrolling column (computed)', c.flexDirection === 'column' && c.overflowY === 'auto' && parseFloat(c.maxHeight) > 0, c.flexDirection + ' ' + c.overflowY + ' ' + c.maxHeight);
  ok('the find box names its field and is a search box', FIND('SPONSOR').attr('aria-label') === 'Find a Sponsor value' && FIND('SPONSOR').attr('type') === 'search', FIND('SPONSOR').prop('outerHTML'));
  // ══════ B. typing ══════
  FIND('SPONSOR').val('p1').trigger('input');
  eq('typing hides the rows it misses, in place, without regard to case', shown('SPONSOR'), ['P10', 'P11', 'P12', 'P13', 'P14', 'P15']);
  ok('... the filter is untouched (no box text, no stat change, nothing pressed)', box() === '' && stat('d1') === '210' && pressed('SPONSOR').length === 0, box() + ' ' + stat('d1'));
  FIND('SPONSOR').val('zz').trigger('input');
  ok('no match shows a note', shown('SPONSOR').length === 0 && G('SPONSOR').find('.pnb-fs-nomatch').text() === 'no value matches', G('SPONSOR').find('.pnb-fs-chips').html().substring(0, 120));
  FIND('SPONSOR').val('').trigger('input');
  eq('an emptied box shows every row again', [shown('SPONSOR').length, G('SPONSOR').find('.pnb-fs-nomatch').length], [15, 0]);
  // ══════ C. Enter presses the first row showing ══════
  FIND('SPONSOR').val('p1').trigger('input');
  FIND('SPONSOR').trigger('focus').trigger(enter());
  return until(function () { return stat('d1') === '10'; }, 5000);
}).then(function () {
  eq('Enter presses the first row showing: the filter and the stat follow', [box(), stat('d1')], ['SPONSOR = /^(?:P10)$/', '10']);
  return wait(300);
}).then(function () {
  ok('the redraw keeps the typed text, the pressed row first, and focus in the box with the caret at the end', FIND('SPONSOR').val() === 'p1' && chips('SPONSOR')[0] === 'P10' && pressed('SPONSOR').join() === 'P10' && document.activeElement === FIND('SPONSOR')[0] && FIND('SPONSOR')[0].selectionEnd === 2, FIND('SPONSOR').val() + ' ' + chips('SPONSOR')[0] + ' ' + (document.activeElement && document.activeElement.className) + ' caret=' + (FIND('SPONSOR')[0] && FIND('SPONSOR')[0].selectionEnd));
  eq('... and the rows the text misses stay hidden', shown('SPONSOR'), ['P10', 'P11', 'P12', 'P13', 'P14', 'P15']);
  FIND('SPONSOR').trigger(enter());
  return until(function () { return stat('d1') === '21'; }, 5000);
}).then(function () {
  eq('Enter again presses the first row showing that is not yet pressed (P11 joins)', [box(), stat('d1'), chips('SPONSOR').slice(0, 2)], ['SPONSOR = /^(?:P10|P11)$/', '21', ['P10', 'P11']]);
  chip('SPONSOR', 'P10').trigger('click');
  return until(function () { return stat('d1') === '11'; }, 5000);
}).then(function () {
  eq('clicking a pressed row releases it, as a chip does', [box(), chips('SPONSOR')[0]], ['SPONSOR = /^(?:P11)$/', 'P11']);
  // ══════ D. a typed filter ══════
  $('#dashSearchInput').val('SPONSOR = /^(?:P03)$/').trigger(enter());
  return until(function () { return stat('d1') === '21'; }, 5000);
}).then(function () {
  eq('a typed filter presses its row, first and never hidden though the find text misses it', [pressed('SPONSOR'), chips('SPONSOR')[0], shown('SPONSOR')[0], FIND('SPONSOR').val()], [['P03'], 'P03', 'P03', 'p1']);
  tile('c1').find('.pnb-fs-clearall').trigger('click');
  return until(function () { return box() === '' && stat('d1') === '210'; }, 5000);
}).then(function () {
  eq('Clear all releases the rows and keeps the typed text', [pressed('SPONSOR').length, FIND('SPONSOR').val(), shown('SPONSOR').length], [0, 'p1', 6]);
  FIND('SPONSOR').val('').trigger('input');
  // ══════ E. authoring: the editor's list box ══════
  $('#dashEditBtn').trigger('click');
  tile('c1').find('.dash-tt-btn[data-act="edit"]').trigger('click');
  return until(function () { return $('#teCtlFields').length === 1; }, 3000);
}).then(function () {
  eq('the editor re-opens the list box as saved, with show N off on that row', rowList(), [['SPONSOR', true, false, true], ['COLLEGE', false, false, false]]);
  var $r = $('#teCtlFields .dash-ctl-row').eq(0);
  $r.find('.teCtlRange').prop('checked', true).trigger('change');
  eq('ticking range turns list off, with show N', rowList()[0], ['SPONSOR', true, true, true]);
  $r.find('.teCtlRange').prop('checked', false).trigger('change');
  eq('... and unticking it turns list back on, show N still off while list is ticked', rowList()[0], ['SPONSOR', true, false, true]);
  var $r2 = $('#teCtlFields .dash-ctl-row').eq(1);
  $r2.find('.teCtlList').prop('checked', true).trigger('change');
  eq('ticking list on the College row turns its show N off', rowList()[1], ['COLLEGE', true, false, true]);
  $('#teApply').trigger('click');
  return until(function () { return $('#dashOverlay').length === 0 && G('COLLEGE').attr('data-fs-list') === '1'; }, 3000);
}).then(function () {
  ok('Apply: the College group is now a list with a find box', G('COLLEGE').hasClass('pnb-fs-list') && FIND('COLLEGE').length === 1 && chips('COLLEGE').length === 2, G('COLLEGE').html().substring(0, 200));
  $('#dashSaveBtn').trigger('click');
  var c1 = savedTile(lastState(), 'c1');
  eq('saved: the argument list carries list (and no show N)', c1 && c1.strip, ['Sponsor|SPONSOR|list', 'College|COLLEGE|list', 'labels=left']);
  tile('c1').find('.dash-tt-btn[data-act="edit"]').trigger('click');
  return until(function () { return $('#teCtlFields').length === 1; }, 3000);
}).then(function () {
  eq('re-opened: as saved', rowList(), [['SPONSOR', true, false, true], ['COLLEGE', true, false, true]]);
  $('.dash-panel-close').trigger('click');
  FIND('COLLEGE').val('en').trigger('input');
  eq('the new list finds its value', shown('COLLEGE'), ['Eng']);
  FIND('COLLEGE').trigger('focus').trigger(enter());
  return until(function () { return stat('d1') === '100'; }, 5000);
}).then(function () {
  eq('... and Enter presses it (the Eng rows sum 100)', [box(), stat('d1'), pressed('COLLEGE')], ['COLLEGE = /^(?:Eng)$/', '100', ['Eng']]);
  ok('no exception escaped', ERRORS.length === 0, ERRORS.join(' | '));
  publish();
}).catch(function (e) {
  L.push('HARNESS_ERROR: ' + (e && e.message ? e.message : e) + ' @ ' + String(e && e.stack || '').split('\n')[1]);
  publish();
});
</script></body></html>
