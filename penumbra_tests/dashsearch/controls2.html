<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="main.css"><link rel="stylesheet" href="penumbra_tiles.css"><link rel="stylesheet" href="penumbra_dashboard.css">
</head><body class="pnb-dash theme-wolfpack-dark is-dark">
<!-- Controls tile harness (2026-09-29): the dashboard's filter chips and switches
     (penumbra_dashboard.js + PenumbraTiles.strip) over the same stubbed server and
     framed-report double as dash.html. The chips and switches must WRITE the
     dashboard filter, read their state back from the box, reach the tiles through
     the ordinary routing, and be authored through the tile editor: added, saved,
     re-opened with what was saved, and refused when wrong. -->
<div id="dashApp" class="dash-app"><header class="dash-head" id="dashHead">
  <div class="dash-head-title" id="dashHeadTitle"></div>
  <div class="dash-head-actions" id="dashHeadActions"></div>
</header><main id="dashMain"></main></div>
<pre id="out">running</pre>
<script src="jquery-3.7.1.min.js"></script>
<script src="chart-4.5.1.min.js"></script>
<script>
var CALLS = [], ERRORS = [], REPLACED = [], AJAX = [], ALERTS = [];
window.onerror = function (m, src, line) { ERRORS.push('onerror: ' + m + ' @' + String(src).split('/').pop() + ':' + line); };
history.replaceState = function (s, t, u) { REPLACED.push(String(u)); };
window.alert = function (m) { ALERTS.push(String(m)); };
window.confirm = function () { return true; };
jQuery.fx.off = true;

var REP = {
  repA: [ { COLLEGE: 'Eng', AMOUNT: '10', STATUS: 'Open' }, { COLLEGE: 'Sci', AMOUNT: '20', STATUS: 'Open' },
          { COLLEGE: 'Eng', AMOUNT: '3', STATUS: 'Closed' }, { COLLEGE: 'Ag', AMOUNT: '200', STATUS: 'Closed' } ],
  repB: [ { NAME: 'Ada', AMOUNT: '7' }, { NAME: 'Bob', AMOUNT: '2' }, { NAME: 'Cy', AMOUNT: '150' } ]
};
// repC is past the unfiltered read's cap: 5,001 rows, and the one North row is
// the last, so a read of 5,000 rows cannot see it (the documented limit).
REP.repC = [];
for (var ri = 0; ri < 5001; ri++) { REP.repC.push({ REGION: ri < 2500 ? 'East' : (ri < 5000 ? 'West' : 'North'), N: String(ri) }); }
// The server's rules, small: a condition on a column the rows lack matches
// nothing, AND-precedence, a /regex/ value (case-insensitive, as both search
// engines read the strip's alternation), != negating it, and index.php's
// &dsearch= routing by column.
function cond(row, part) {
  var m = part.match(/^\s*(\w+)\s*(!=|=|>|<)\s*(.+?)\s*$/);
  if (!m) {
    var needle = part.trim().toLowerCase();
    return Object.keys(row).some(function (k) { return String(row[k]).toLowerCase().indexOf(needle) > -1; });
  }
  var v = row[m[1].toUpperCase()];
  if (v === undefined) { return false; }
  var rx = /^\/(.*)\/i?$/.exec(m[3]);
  if (rx) { var hit = new RegExp(rx[1].replace(/\\x2F/g, '/'), 'i').test(String(v)); return m[2] === '!=' ? !hit : hit; }
  if (m[2] === '=') { return String(v).toLowerCase() === m[3].toLowerCase(); }
  if (m[2] === '!=') { return String(v).toLowerCase() !== m[3].toLowerCase(); }
  var a = parseFloat(v), b = parseFloat(m[3]);
  return m[2] === '>' ? a > b : a < b;
}
function filt(rows, text) {
  if (!text) { return rows; }
  var ors = text.split(/\s+or\s+/i).map(function (s) { return s.split(/\s+and\s+/i); });
  return rows.filter(function (r) { return ors.some(function (ands) { return ands.every(function (p) { return cond(r, p); }); }); });
}
function routeStub(ds, cols) {
  var spec = JSON.parse(ds), keep = [], skipped = [];
  spec.f.forEach(function (fr) {
    var c = String(fr[0] || '').toUpperCase();
    if (!c || cols.indexOf(c) > -1) { keep.push(fr[1]); } else if (skipped.indexOf(c) < 0) { skipped.push(c); }
  });
  return { text: keep.length ? (spec.p || '') + keep.join(' and ') : '', skipped: skipped };
}
$.getJSON = function (url, params) {
  params = params || {};
  CALLS.push({ url: url, p: $.extend({}, params) });
  var d = $.Deferred();
  setTimeout(function () {
    if (url === 'index.php') {
      var rows = REP[params.id];
      if (!rows) { d.resolve({ data: [{ ERROR: 'Report Not Found (ID: ' + params.id + ')' }] }); return; }
      var resp = {};
      if (params.search) { rows = filt(rows, params.search); }
      if (params.dsearch) {
        var r = routeStub(params.dsearch, Object.keys(REP[params.id][0]));
        rows = filt(rows, r.text);
        resp.search_skipped = r.skipped;
      }
      if (params.limit && rows.length > params.limit) { resp.total_rows = rows.length; rows = rows.slice(0, params.limit); }
      resp.data = rows;
      d.resolve(resp);
    } else if (url === 'manage_dashboard.php') {
      d.resolve({ status: 'success', data: [] });
    } else { d.reject({ status: 404 }); }
  }, 10);
  return d.promise();
};
$.ajax = function (o) { AJAX.push(o); var d = $.Deferred(); d.resolve({ status: 'success' }); return d.promise(); };

const penumbra_dash_vars = {
  currentUserKey: 'tester', isAdmin: true, canCreate: true, reportGrantPatterns: [],
  shortId: 'ctl2', found: true, canEdit: true,
  // Opened from a bookmark that already carries a filter: every data tile's
  // first fetch is FILTERED, so without the unfiltered read the College chips
  // would offer Eng alone.
  urlSearchOverride: '?search=' + encodeURIComponent('COLLEGE = /^(?:Eng)$/'),
  shibboleth: { name: 'Ada', fname: 'Ada' },
  meta: { short_id: 'ctl2', title: 'Controls opened filtered', owner_id: 'tester', authorized: 'tester', updated_at: '' },
  state: { version: 1, theme: 'theme-default', refreshSeconds: 0, tiles: [
    { id: 'c1', type: 'controls', label: 'Filters', strip: ['College|COLLEGE', 'Name|NAME', 'Region|REGION', 'labels=left'], w: 12, h: 2 },
    { id: 'c2', type: 'controls', label: 'Switches only', toggles: [{ label: 'Big only', cond: 'AMOUNT > 5' }], w: 6, h: 1 },
    { id: 'c3', type: 'controls', label: 'Nowhere', strip: ['Nope|NOPE', 'labels=left'], w: 6, h: 1 },
    { id: 'd1', type: 'stat', report: 'repA', label: 'A total', agg: 'sum', column: 'AMOUNT', format: 'number', w: 4, h: 1, source: 'live' },
    { id: 'd3', type: 'stat', report: 'repA', label: 'A count', agg: 'count', format: 'number', w: 4, h: 1, source: 'live' },
    { id: 'd2', type: 'table', report: 'repB', label: 'People', columns: ['NAME', 'AMOUNT'], rows: 2, w: 4, h: 2, source: 'live' },
    { id: 'd4', type: 'table', report: 'repC', label: 'Regions', columns: ['REGION', 'N'], rows: 2, w: 4, h: 2, source: 'live' }
  ] },
  themes: [{ id: 'theme-default', label: 'Default Light', isDark: false }]
};
</script>
<script src="purify.min.js"></script><script src="penumbra_tiles.js"></script>
<script src="dash.js"></script>
<script>
var L = [];
function ok(n, c, x) { L.push((c ? 'PASS ' : 'FAIL ') + n + (x !== undefined && !c ? '  [' + x + ']' : '')); }
function eq(n, got, want) { ok(n, JSON.stringify(got) === JSON.stringify(want), 'got ' + JSON.stringify(got) + ' want ' + JSON.stringify(want)); }
function tile(id) { return $('.dash-tile[data-tile-id="' + id + '"]'); }
function stat(id) { return tile(id).find('.dash-stat-value').text(); }
function box() { return String($('#dashSearchInput').val()); }
function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function until(fn, ms) {
  var t0 = Date.now();
  return new Promise(function (res) {
    (function poll() { var v = false; try { v = fn(); } catch (e) { } if (v || Date.now() - t0 > ms) { res(!!v); } else { setTimeout(poll, 100); } })();
  });
}
function chips(id, col) {
  return tile(id).find('.pnb-fs-group[data-fs-col="' + col + '"] .pnb-fs-chip').map(function () { return $(this).attr('data-fs-val'); }).get();
}
function pressed(id, col) {
  return tile(id).find('.pnb-fs-group[data-fs-col="' + col + '"] .pnb-fs-chip[aria-pressed="true"]').map(function () { return $(this).attr('data-fs-val'); }).get();
}
// The unfiltered reads: a report fetch with neither search nor dsearch, capped.
function fills(id) { return CALLS.filter(function (c) { return c.url === 'index.php' && c.p.id === id && !c.p.dsearch && !c.p.search && String(c.p.limit) === '5000'; }).length; }
function publish() {
  var A = 'RES' + 'ULT>>', B = '<' + '<FIN';
  document.getElementById('out').textContent = A + L.join(' ;; ') + B;
}
until(function () { return stat('d1') !== '' && chips('c1', 'COLLEGE').length >= 3 && chips('c1', 'NAME').length >= 3 && chips('c1', 'REGION').length >= 2; }, 12000).then(function (ready) {
  ok('opened under a filter, the chips still fill', ready, 'd1=' + stat('d1') + ' college=' + JSON.stringify(chips('c1', 'COLLEGE')) + ' name=' + JSON.stringify(chips('c1', 'NAME')));
  eq('the tiles show the filtered rows', stat('d1'), '13');
  eq('College offers every college of the report, not just the filtered one', chips('c1', 'COLLEGE'), ['Ag', 'Eng', 'Sci']);
  eq('... with the filter pressed', pressed('c1', 'COLLEGE'), ['Eng']);
  eq('a table excerpt (2 rows) does not limit the chips: Name has all 3', chips('c1', 'NAME'), ['Ada', 'Bob', 'Cy']);
  eq('ONE unfiltered, capped read per report, not one per tile', [fills('repA'), fills('repB'), fills('repC')], [1, 1, 1]);
  eq('past the cap, the chips hold what the first 5,000 rows hold (North is row 5,001)', chips('c1', 'REGION'), ['East', 'West']);
  ok('the reads go out without the filter, capped at 5000', CALLS.some(function (c) { return c.p.id === 'repA' && String(c.p.limit) === '5000' && !c.p.dsearch; }));
  ok('a column no tile has shows "no values yet"', tile('c3').find('.pnb-fs-empty').text() === 'no values yet', tile('c3').find('.dash-tile-body').text());
  ok('a switches-only Controls tile draws its switch', tile('c2').find('.pnb-toggle-btn').length === 1 && tile('c2').find('.pnb-fstrip').length === 0);
  tile('c1').find('.pnb-fs-chip').filter(function () { return $(this).attr('data-fs-val') === 'Sci'; }).trigger('click');
  return until(function () { return stat('d1') === '33'; }, 5000);
}).then(function () {
  eq('a chip the filtered rows lacked works', [box(), stat('d1')], ['COLLEGE = /^(?:Eng|Sci)$/', '33']);
  eq('refetching under the new filter reads no more unfiltered rows, capped ones included', [fills('repA'), fills('repB'), fills('repC')], [1, 1, 1]);
  tile('c2').find('.pnb-toggle-btn').trigger('click');
  return until(function () { return stat('d1') === '30'; }, 5000);
}).then(function () {
  eq('the switch in another Controls tile adds to the same filter', box(), 'COLLEGE = /^(?:Eng|Sci)$/ and AMOUNT > 5');
  eq('both Controls tiles follow it', [pressed('c1', 'COLLEGE'), tile('c2').find('.pnb-toggle').attr('data-ts-on')], [['Eng', 'Sci'], '1']);
  return wait(3000);
}).then(function () {
  // A capped read (repC) never scores as a full one: without the once-per-report
  // flag every redraw would read it again, forever.
  eq('the reads are not repeated over time (a capped one included)', [fills('repA'), fills('repB'), fills('repC')], [1, 1, 1]);
  ok('no exception escaped', ERRORS.length === 0, ERRORS.join(' | '));
  publish();
}).catch(function (e) {
  L.push('HARNESS_ERROR: ' + (e && e.message ? e.message : e) + ' @ ' + String(e && e.stack || '').split('\n')[1]);
  publish();
});
</script></body></html>
