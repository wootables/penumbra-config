<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="main.css"><link rel="stylesheet" href="penumbra_tiles.css"><link rel="stylesheet" href="penumbra_dashboard.css">
</head><body class="pnb-dash theme-wolfpack-dark is-dark">
<!-- The (blank) chip on the Controls tile (2026-09-30, late): 'Label|COLUMN|blank'
     offers the rows whose cell is empty as a chip of its own - last, in italics,
     no count - writing an empty alternative (STATUS = /^(?:)$/, or /^(?:|Open)$/
     among values) that the tiles' reports match against their blank cells; on an
     exclude group it writes !=. The pressed state is read back from a typed
     filter (Enter, typing, Escape), Clear all releases it, and the tile editor's
     "blank" box is authored, saved and re-opened (off while range is ticked).
     Same stubbed server and scaffolding as controls3.html; that the two real
     search engines match /^(?:)$/ against an empty cell is filterstrip K / J.5. -->
<div id="dashApp" class="dash-app"><header class="dash-head" id="dashHead">
  <div class="dash-head-title" id="dashHeadTitle"></div>
  <div class="dash-head-actions" id="dashHeadActions"></div>
</header><main id="dashMain"></main></div>
<pre id="out">running</pre>
<script src="jquery-3.7.1.min.js"></script>
<script src="chart-4.5.1.min.js"></script>
<script>
var CALLS = [], ERRORS = [], REPLACED = [], AJAX = [], ALERTS = [];
window.onerror = function (m, src, line) { ERRORS.push('onerror: ' + m + ' @' + String(src).split('/').pop() + ':' + line); };
history.replaceState = function (s, t, u) { REPLACED.push(String(u)); };
window.alert = function (m) { ALERTS.push(String(m)); };
window.confirm = function () { return true; };
jQuery.fx.off = true;

// repA: two rows with no STATUS (20 and 200) and one with no COLLEGE; repB: one
// row with no NAME.
var REP = {
  repA: [ { COLLEGE: 'Eng', AMOUNT: '10',  STATUS: 'Open' },
          { COLLEGE: 'Sci', AMOUNT: '20',  STATUS: '' },
          { COLLEGE: 'Eng', AMOUNT: '3',   STATUS: 'Closed' },
          { COLLEGE: '',    AMOUNT: '200', STATUS: '' } ],
  repB: [ { NAME: 'Ada', AMOUNT: '7' }, { NAME: '', AMOUNT: '2' }, { NAME: 'Cy', AMOUNT: '150' } ]
};
// A small server: the strip's /^(?:A|B)$/ alternation (an empty alternative
// matches an empty cell, as both real engines do), != on it, AND-precedence,
// and &dsearch= routing.
function num(v) {
  var t = String(v).trim(), neg = /^\(.*\)$/.test(t);
  t = t.replace(/[()$,%]/g, '');
  if (!/^-?\d*\.?\d+$/.test(t)) { return null; }
  return (neg ? -1 : 1) * parseFloat(t);
}
function cond(row, part) {
  var m = part.match(/^\s*(\w+)\s*(>=|<=|!=|=|>|<)\s*(.+?)\s*$/);
  if (!m) { return false; }
  var v = row[m[1].toUpperCase()];
  if (v === undefined) { return false; }
  var rx = /^\/(.*)\/i?$/.exec(m[3]);
  if (rx) { var hit = new RegExp(rx[1], 'i').test(String(v)); return m[2] === '!=' ? !hit : hit; }
  var a = num(v), b = num(m[3]);
  if (a === null || b === null) { return m[2] === '=' ? String(v).toLowerCase() === m[3].toLowerCase() : false; }
  switch (m[2]) { case '>=': return a >= b; case '<=': return a <= b; case '>': return a > b; case '<': return a < b; case '=': return a === b; default: return a !== b; }
}
function filt(rows, text) {
  if (!text) { return rows; }
  var ors = text.split(/\s+or\s+/i).map(function (s) { return s.split(/\s+and\s+/i); });
  return rows.filter(function (r) { return ors.some(function (ands) { return ands.every(function (p) { return cond(r, p); }); }); });
}
function routeStub(ds, cols) {
  var spec = JSON.parse(ds), keep = [], skipped = [];
  spec.f.forEach(function (fr) {
    var c = String(fr[0] || '').toUpperCase();
    if (!c || cols.indexOf(c) > -1) { keep.push(fr[1]); } else if (skipped.indexOf(c) < 0) { skipped.push(c); }
  });
  return { text: keep.length ? (spec.p || '') + keep.join(' and ') : '', skipped: skipped };
}
$.getJSON = function (url, params) {
  params = params || {};
  CALLS.push({ url: url, p: $.extend({}, params) });
  var d = $.Deferred();
  setTimeout(function () {
    if (url === 'index.php') {
      var rows = REP[params.id];
      if (!rows) { d.resolve({ data: [{ ERROR: 'Report Not Found (ID: ' + params.id + ')' }] }); return; }
      var resp = { columns: Object.keys(REP[params.id][0]).concat(['#']) };
      if (params.search) { rows = filt(rows, params.search); }
      if (params.dsearch) {
        var r = routeStub(params.dsearch, Object.keys(REP[params.id][0]));
        rows = filt(rows, r.text);
        resp.search_skipped = r.skipped;
      }
      if (params.limit && rows.length > params.limit) { resp.total_rows = rows.length; rows = rows.slice(0, params.limit); }
      resp.data = rows;
      d.resolve(resp);
    } else if (url === 'manage_dashboard.php') {
      d.resolve({ status: 'success', data: [] });
    } else { d.reject({ status: 404 }); }
  }, 10);
  return d.promise();
};
$.ajax = function (o) { AJAX.push(o); var d = $.Deferred(); d.resolve({ status: 'success' }); return d.promise(); };

const penumbra_dash_vars = {
  currentUserKey: 'tester', isAdmin: true, canCreate: true, reportGrantPatterns: [],
  shortId: 'ctl4', found: true, canEdit: true,
  shibboleth: { name: 'Ada', fname: 'Ada' },
  meta: { short_id: 'ctl4', title: 'Blank chips', owner_id: 'tester', authorized: 'tester', updated_at: '' },
  state: { version: 1, theme: 'theme-default', refreshSeconds: 0, tiles: [
    { id: 'c1', type: 'controls', label: 'Filters', strip: ['Status|STATUS|blank', 'Name|NAME|blank|exclude', 'College|COLLEGE', 'labels=left'], w: 12, h: 2 },
    { id: 'd1', type: 'stat', report: 'repA', label: 'A total', agg: 'sum', column: 'AMOUNT', format: 'number', w: 4, h: 1, source: 'live' },
    { id: 'd2', type: 'table', report: 'repB', label: 'People', columns: ['NAME', 'AMOUNT'], rows: 5, w: 4, h: 2, source: 'live' }
  ] },
  themes: [{ id: 'theme-default', label: 'Default Light', isDark: false }]
};
</script>
<script src="purify.min.js"></script><script src="penumbra_tiles.js"></script>
<script src="dash.js"></script>
<script>
var L = [];
function ok(n, c, x) { L.push((c ? 'PASS ' : 'FAIL ') + n + (x !== undefined && !c ? '  [' + x + ']' : '')); }
function eq(n, got, want) { ok(n, JSON.stringify(got) === JSON.stringify(want), 'got ' + JSON.stringify(got) + ' want ' + JSON.stringify(want)); }
function tile(id) { return $('.dash-tile[data-tile-id="' + id + '"]'); }
function stat(id) { return tile(id).find('.dash-stat-value').text(); }
function note() { return $('#dashFilterNote').text(); }
function box() { return String($('#dashSearchInput').val()); }
function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function until(fn, ms) {
  var t0 = Date.now();
  return new Promise(function (res) {
    (function poll() { var v = false; try { v = fn(); } catch (e) { } if (v || Date.now() - t0 > ms) { res(!!v); } else { setTimeout(poll, 100); } })();
  });
}
function cs($e, pseudo) { return ($e && $e.length) ? getComputedStyle($e[0], pseudo || null) : {}; }
function G(col) { return tile('c1').find('.pnb-fs-group[data-fs-col="' + col + '"]'); }
function chips(col) { return G(col).find('.pnb-fs-chip').map(function () { return $(this).attr('data-fs-val'); }).get(); }
function chip(col, v) { return G(col).find('.pnb-fs-chip').filter(function () { return $(this).attr('data-fs-val') === v; }); }
function BL(col) { return G(col).find('.pnb-fs-chip.pnb-fs-blank'); }
function pressed(col) { return G(col).find('.pnb-fs-chip[aria-pressed="true"]').map(function () { return $(this).attr('data-fs-val'); }).get(); }
function names() { return tile('d2').find('tbody tr').map(function () { return $(this).find('td').first().text(); }).get(); }
function lastState() {
  var a = AJAX[AJAX.length - 1];
  try { return JSON.parse(JSON.parse(a.data).state_data); } catch (e) { return null; }
}
function savedTile(st, id) { return st ? st.tiles.filter(function (x) { return x.id === id; })[0] || null : null; }
function rowBlank() {
  return $('#teCtlFields .dash-ctl-row').map(function () {
    return [[$(this).find('.teCtlCol').val(), $(this).find('.teCtlBlank').is(':checked'), $(this).find('.teCtlBlank').prop('disabled')]];
  }).get();
}
function publish() {
  var A = 'RES' + 'ULT>>', B2 = '<' + '<FIN';
  document.getElementById('out').textContent = A + L.join(' ;; ') + B2;
}

until(function () { return stat('d1') === '233' && tile('d2').find('tbody tr').length === 3 && chips('STATUS').length === 3 && chips('NAME').length === 3; }, 12000).then(function (ready) {
  ok('the tiles loaded and the chips drew', ready, 'stat=' + stat('d1') + ' status=' + JSON.stringify(chips('STATUS')) + ' name=' + JSON.stringify(chips('NAME')));
  // ══════ A. drawing ══════
  eq('a blank field lists its values A to Z, then the (blank) chip', chips('STATUS'), ['Closed', 'Open', '']);
  eq('... in every blank group, and the group says so', [chips('NAME'), G('NAME').attr('data-fs-blank'), G('STATUS').attr('data-fs-blank')], [['Ada', 'Cy', ''], '1', '1']);
  eq('a field without the option offers no blank chip (repA has a blank COLLEGE)', [chips('COLLEGE'), G('COLLEGE').attr('data-fs-blank')], [['Eng', 'Sci'], undefined]);
  eq('the chip reads (blank), counts the two rows with no status (single-source counts, 2026-10-01), a title naming the rows', [BL('STATUS').find('.pnb-fs-v').text(), BL('STATUS').find('.pnb-fs-n').text(), BL('STATUS').attr('title')], ['(blank)', '2', 'Rows with no Status value']);
  ok('... in italics (computed)', cs(BL('STATUS').find('.pnb-fs-v')).fontStyle === 'italic', cs(BL('STATUS').find('.pnb-fs-v')).fontStyle);
  // ══════ B. a click ══════
  BL('STATUS').trigger('click');
  return until(function () { return stat('d1') === '220'; }, 5000);
}).then(function () {
  eq('the blank chip writes the empty alternation', box(), 'STATUS = /^(?:)$/');
  eq('... and the stat sums the rows with no status (20 + 200)', stat('d1'), '220');
  ok('the people table (no STATUS there) is not reached, and the note says so', tile('d2').find('tbody tr').length === 3 && note().indexOf('People (its report has no STATUS column)') > -1, note());
  eq('the chip reads as pressed, and only it', [BL('STATUS').attr('aria-pressed'), tile('c1').find('.pnb-fs-chip[aria-pressed="true"]').length], ['true', 1]);
  chip('STATUS', 'Open').trigger('click');
  return until(function () { return stat('d1') === '230'; }, 5000);
}).then(function () {
  eq('a value joins the blank in the alternation', box(), 'STATUS = /^(?:|Open)$/');
  BL('STATUS').trigger('click');
  return until(function () { return stat('d1') === '10'; }, 5000);
}).then(function () {
  eq('clicking the pressed blank chip releases it', box(), 'STATUS = /^(?:Open)$/');
  // ══════ C. exclude + blank ══════
  BL('NAME').trigger('click');
  return until(function () { return tile('d2').find('tbody tr').length === 2; }, 5000);
}).then(function () {
  eq('on an exclude group the blank chip leaves the empty cells out', box(), 'STATUS = /^(?:Open)$/ and NAME != /^(?:)$/');
  eq('... the people table keeps the two named rows', names(), ['Ada', 'Cy']);
  eq('... and the stat, whose report has no NAME, keeps its own filter', stat('d1'), '10');
  // ══════ D. the state read back from the box ══════
  $('#dashSearchInput').val('STATUS = /^(?:Closed|)$/').trigger($.Event('keydown', { key: 'Enter' }));
  return until(function () { return stat('d1') === '223'; }, 5000);
}).then(function () {
  eq('a typed empty alternative presses the blank chip beside the value (3 + 20 + 200)', [pressed('STATUS'), stat('d1')], [['Closed', ''], '223']);
  eq('... and the exclude group is released', [pressed('NAME'), tile('d2').find('tbody tr').length], [[], 3]);
  $('#dashSearchInput').val('STATUS = /^(?:)$/ and NAME != /^(?:|Ada)$/').trigger('input');
  return wait(400);
}).then(function () {
  eq('typing follows before Enter', [pressed('STATUS'), pressed('NAME')], [[''], ['Ada', '']]);
  $('#dashSearchInput').trigger('focus').trigger($.Event('keydown', { key: 'Escape' }));
  return wait(400);
}).then(function () {
  eq('Escape puts the filter in force back, and the chips with it', [box(), pressed('STATUS'), pressed('NAME')], ['STATUS = /^(?:Closed|)$/', ['Closed', ''], []]);
  tile('c1').find('.pnb-fs-clearall').trigger('click');
  return until(function () { return box() === '' && stat('d1') === '233'; }, 5000);
}).then(function () {
  eq('Clear all releases the blank chip with the rest', [box(), tile('c1').find('.pnb-fs-chip[aria-pressed="true"]').length, stat('d1')], ['', 0, '233']);
  // ══════ E. authoring: the editor's blank box ══════
  $('#dashEditBtn').trigger('click');
  tile('c1').find('.dash-tt-btn[data-act="edit"]').trigger('click');
  return until(function () { return $('#teCtlFields').length === 1; }, 3000);
}).then(function () {
  eq('the editor re-opens the blank boxes as saved', rowBlank(), [['STATUS', true, false], ['NAME', true, false], ['COLLEGE', false, false]]);
  var $r = $('#teCtlFields .dash-ctl-row').eq(2);
  $r.find('.teCtlRange').prop('checked', true).trigger('change');
  eq('ticking range turns blank off, with exclude and show', rowBlank()[2], ['COLLEGE', false, true]);
  $r.find('.teCtlRange').prop('checked', false).trigger('change');
  eq('... and unticking it turns blank back on', rowBlank()[2], ['COLLEGE', false, false]);
  $r.find('.teCtlBlank').prop('checked', true);
  $('#teApply').trigger('click');
  return until(function () { return $('#dashOverlay').length === 0 && G('COLLEGE').attr('data-fs-blank') === '1'; }, 3000);
}).then(function () {
  eq('Apply: the College group now ends with a blank chip', chips('COLLEGE'), ['Eng', 'Sci', '']);
  $('#dashSaveBtn').trigger('click');
  var c1 = savedTile(lastState(), 'c1');
  eq('saved: the argument list carries blank (after exclude)', c1 && c1.strip, ['Status|STATUS|blank', 'Name|NAME|exclude|blank', 'College|COLLEGE|blank', 'labels=left']);
  tile('c1').find('.dash-tt-btn[data-act="edit"]').trigger('click');
  return until(function () { return $('#teCtlFields').length === 1; }, 3000);
}).then(function () {
  eq('re-opened: as saved', rowBlank(), [['STATUS', true, false], ['NAME', true, false], ['COLLEGE', true, false]]);
  $('.dash-panel-close').trigger('click');
  BL('COLLEGE').trigger('click');
  return until(function () { return stat('d1') === '200'; }, 5000);
}).then(function () {
  eq('the new blank chip filters like the others (the row with no college)', [box(), stat('d1')], ['COLLEGE = /^(?:)$/', '200']);
  ok('no exception escaped', ERRORS.length === 0, ERRORS.join(' | '));
  publish();
}).catch(function (e) {
  L.push('HARNESS_ERROR: ' + (e && e.message ? e.message : e) + ' @ ' + String(e && e.stack || '').split('\n')[1]);
  publish();
});
</script></body></html>
