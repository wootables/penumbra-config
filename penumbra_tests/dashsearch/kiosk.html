<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="main.css"><link rel="stylesheet" href="penumbra_tiles.css"><link rel="stylesheet" href="penumbra_dashboard.css">
</head><body class="pnb-dash theme-wolfpack-dark is-dark">
<!-- A ?kiosk=1 address opens kiosk view directly (2026-10-01). Before this the boot
     path downgraded every kiosk=1 address to the normal view, because kiosk lived
     only in true fullscreen and a fresh document cannot request that. Now: the
     chrome-free view at once (body.dash-kiosk, an empty action bar, the corner
     exit, the kiosk refresh default, the countdown pinned to the viewport, the
     address kept), a hint, the browser's full screen asked for ONCE on the first
     click or key press (stubbed here: a fresh document in headless Edge has no
     gesture either) - every gesture while windowed, a click or a key INSIDE an
     embedded frame too (kiosklink2: seen live, the first click landed in a frame),
     the hint a button that stays until full screen is granted - Esc leaving the
     windowed kiosk (inside a frame too) and restoring everything, the Kiosk
     button's own link carrying kiosk=1, the button path, and the full-screen Esc
     exit arriving as fullscreenchange. Same stubbed server as
     controls4.html. The address is V.urlSearchOverride (a page cannot fake its URL). -->
<div id="dashApp" class="dash-app"><header class="dash-head" id="dashHead">
  <div class="dash-head-title" id="dashHeadTitle"></div>
  <div class="dash-head-actions" id="dashHeadActions"></div>
</header><main id="dashMain"></main></div>
<pre id="out">running</pre>
<script src="jquery-3.7.1.min.js"></script>
<script src="chart-4.5.1.min.js"></script>
<script>
var CALLS = [], ERRORS = [], REPLACED = [], AJAX = [], ALERTS = [], FS = [];
window.onerror = function (m, src, line) { ERRORS.push('onerror: ' + m + ' @' + String(src).split('/').pop() + ':' + line); };
history.replaceState = function (s, t, u) { REPLACED.push(String(u)); };
window.alert = function (m) { ALERTS.push(String(m)); };
window.confirm = function () { return true; };
jQuery.fx.off = true;
// Headless Edge's window fills its (small) screen: pretend a wall display's
// browser window that does not, so the hint and the gesture request are exercised.
try { Object.defineProperty(window.screen, 'width', { value: 1920, configurable: true }); Object.defineProperty(window.screen, 'height', { value: 1080, configurable: true }); } catch (e) { }
document.documentElement.requestFullscreen = function () { FS.push('request'); return Promise.resolve(); };
var FSEL = null;
try { Object.defineProperty(document, 'fullscreenElement', { get: function () { return FSEL; }, configurable: true }); } catch (e) { }
function fsChange(on) { FSEL = on ? document.documentElement : null; document.dispatchEvent(new Event('fullscreenchange')); }

var REP = {
  repA: [ { COLLEGE: 'Eng', AMOUNT: '10', STATUS: 'Open' }, { COLLEGE: 'Sci', AMOUNT: '20', STATUS: 'Open' },
          { COLLEGE: 'Eng', AMOUNT: '3', STATUS: 'Closed' }, { COLLEGE: 'Ag', AMOUNT: '200', STATUS: 'Closed' } ],
  repB: [ { NAME: 'Ada', AMOUNT: '7' }, { NAME: 'Bob', AMOUNT: '2' }, { NAME: 'Cy', AMOUNT: '150' } ]
};
function num(v) { var t = String(v).trim(); return /^-?\d*\.?\d+$/.test(t) ? parseFloat(t) : null; }
function cond(row, part) {
  var m = part.match(/^\s*(\w+)\s*(>=|<=|!=|=|>|<)\s*(.+?)\s*$/);
  if (!m) { return false; }
  var v = row[m[1].toUpperCase()];
  if (v === undefined) { return false; }
  var rx = /^\/(.*)\/i?$/.exec(m[3]);
  if (rx) { var hit = new RegExp(rx[1], 'i').test(String(v)); return m[2] === '!=' ? !hit : hit; }
  var a = num(v), b = num(m[3]);
  if (a === null || b === null) { return m[2] === '=' ? String(v).toLowerCase() === m[3].toLowerCase() : false; }
  switch (m[2]) { case '>=': return a >= b; case '<=': return a <= b; case '>': return a > b; case '<': return a < b; case '=': return a === b; default: return a !== b; }
}
function filt(rows, text) {
  if (!text) { return rows; }
  var ors = text.split(/\s+or\s+/i).map(function (s) { return s.split(/\s+and\s+/i); });
  return rows.filter(function (r) { return ors.some(function (ands) { return ands.every(function (p) { return cond(r, p); }); }); });
}
function routeStub(ds, cols) {
  var spec = JSON.parse(ds), keep = [], skipped = [];
  spec.f.forEach(function (fr) {
    var c = String(fr[0] || '').toUpperCase();
    if (!c || cols.indexOf(c) > -1) { keep.push(fr[1]); } else if (skipped.indexOf(c) < 0) { skipped.push(c); }
  });
  return { text: keep.length ? (spec.p || '') + keep.join(' and ') : '', skipped: skipped };
}
$.getJSON = function (url, params) {
  params = params || {};
  CALLS.push({ url: url, p: $.extend({}, params) });
  var d = $.Deferred();
  setTimeout(function () {
    if (url === 'index.php') {
      var rows = REP[params.id];
      if (!rows) { d.resolve({ data: [{ ERROR: 'Report Not Found (ID: ' + params.id + ')' }] }); return; }
      var resp = { columns: Object.keys(REP[params.id][0]).concat(['#']) };
      if (params.search) { rows = filt(rows, params.search); }
      if (params.dsearch) { var r = routeStub(params.dsearch, Object.keys(REP[params.id][0])); rows = filt(rows, r.text); resp.search_skipped = r.skipped; }
      if (params.limit && rows.length > params.limit) { resp.total_rows = rows.length; rows = rows.slice(0, params.limit); }
      resp.data = rows;
      d.resolve(resp);
    } else if (url === 'manage_dashboard.php') {
      d.resolve({ status: 'success', data: [] });
    } else { d.reject({ status: 404 }); }
  }, 10);
  return d.promise();
};
$.ajax = function (o) { AJAX.push(o); var d = $.Deferred(); d.resolve({ status: 'success' }); return d.promise(); };

const penumbra_dash_vars = {
  currentUserKey: 'tester', isAdmin: true, canCreate: true, reportGrantPatterns: [],
  shortId: 'kio1', found: true, canEdit: true,
  urlSearchOverride: '?kiosk=1',
  shibboleth: { name: 'Ada', fname: 'Ada' },
  meta: { short_id: 'kio1', title: 'Kiosk link', owner_id: 'tester', authorized: 'tester', updated_at: '' },
  state: { version: 1, theme: 'theme-default', refreshSeconds: 0, tiles: [
    { id: 'd1', type: 'stat', report: 'repA', label: 'A total', agg: 'sum', column: 'AMOUNT', format: 'number', w: 4, h: 1, source: 'live' },
    { id: 'd2', type: 'table', report: 'repB', label: 'People', columns: ['NAME', 'AMOUNT'], rows: 5, w: 4, h: 2, source: 'live' }
  ] },
  themes: [{ id: 'theme-default', label: 'Default Light', isDark: false }]
};
</script>
<script src="purify.min.js"></script><script src="penumbra_tiles.js"></script>
<script src="dash.js"></script>
<script>
var L = [];
function ok(n, c, x) { L.push((c ? 'PASS ' : 'FAIL ') + n + (x !== undefined && !c ? '  [' + x + ']' : '')); }
function eq(n, got, want) { ok(n, JSON.stringify(got) === JSON.stringify(want), 'got ' + JSON.stringify(got) + ' want ' + JSON.stringify(want)); }
function tile(id) { return $('.dash-tile[data-tile-id="' + id + '"]'); }
function stat(id) { return tile(id).find('.dash-stat-value').text(); }
function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function until(fn, ms) {
  var t0 = Date.now();
  return new Promise(function (res) {
    (function poll() { var v = false; try { v = fn(); } catch (e) { } if (v || Date.now() - t0 > ms) { res(!!v); } else { setTimeout(poll, 100); } })();
  });
}
function cs($e) { return ($e && $e.length) ? getComputedStyle($e[0]) : {}; }
function lastUrl() { return REPLACED.length ? REPLACED[REPLACED.length - 1] : ''; }
function publish() {
  var A = 'RES' + 'ULT>>', B2 = '<' + '<FIN';
  document.getElementById('out').textContent = A + L.join(' ;; ') + B2;
}

until(function () { return stat('d1') === '233' && tile('d2').find('tbody tr').length === 3; }, 12000).then(function (ready) {
  ok('the tiles loaded under the kiosk address', ready, 'stat=' + stat('d1'));
  // ══════ A. the address opens kiosk view at once ══════
  ok('the body is in kiosk view and the header is hidden (computed)', $('body').hasClass('dash-kiosk') && cs($('#dashHead')).display === 'none', $('body').attr('class') + ' / ' + cs($('#dashHead')).display);
  eq('the action bar is empty', $('#dashHeadActions').children().length, 0);
  ok('the corner exit is there and leads to the normal view', $('.dash-kiosk-exit').length === 1 && String($('.dash-kiosk-exit').attr('href')).indexOf('kiosk=1') === -1, $('.dash-kiosk-exit').attr('href'));
  ok('the address keeps kiosk=1', lastUrl().indexOf('kiosk=1') > -1 && lastUrl().indexOf('id=kio1') > -1, lastUrl());
  ok('the countdown is pinned to the viewport (the kiosk refresh default is in force)', $('#dashCountdown').length === 1 && $('#dashCountdown').hasClass('dash-cd-fixed'), $('#dashCountdown').attr('class'));
  ok('a hint button says a click takes it full screen (the window does not fill the screen)', $('.dash-kiosk-hint').length === 1 && $('.dash-kiosk-hint').is('button') && $('.dash-kiosk-hint').text().indexOf('Click for full screen') > -1, $('.dash-kiosk-hint').prop('outerHTML'));
  eq('no full screen was requested without a gesture', FS.length, 0);
  // ══════ B. the first gesture asks for full screen, once ══════
  $(document).trigger($.Event('keydown', { key: 'Shift' }));
  eq('a modifier alone is not the gesture', FS.length, 0);
  $('#dashMain').trigger('click');
  eq('a click requests full screen; the hint stays until it is granted', [FS.length, $('.dash-kiosk-hint').length], [1, 1]);
  $('.dash-kiosk-hint').trigger('click');
  $(document).trigger($.Event('keydown', { key: 'a' }));
  eq('the hint button and a key ask again while the kiosk is still windowed', FS.length, 3);
  ok('kiosk view is still on (the stub granted nothing visible)', $('body').hasClass('dash-kiosk'), $('body').attr('class'));
  // ══════ C. a frame added later is wired: a click inside asks, Esc inside leaves ══════
  var fr = document.createElement('iframe'); fr.className = 'dash-embed'; fr.setAttribute('srcdoc', '<p id="in">inside</p>');
  document.getElementById('dashMain').appendChild(fr);
  return until(function () { return fr.contentDocument && fr.contentDocument.getElementById('in') && fr.contentDocument.__pnbKiosk === true; }, 4000);
}).then(function (armed) {
  ok('a frame added after boot gets the kiosk listeners once it has loaded', armed, String(armed));
  var fr = document.querySelector('#dashMain iframe.dash-embed');
  fr.contentDocument.getElementById('in').dispatchEvent(new MouseEvent('click', { bubbles: true }));
  eq('a click inside the frame asks for full screen too', FS.length, 4);
  fr.contentDocument.getElementById('in').dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
  return wait(200);
}).then(function () {
  ok('Esc inside the frame leaves kiosk view: header back, exit and hint gone', !$('body').hasClass('dash-kiosk') && cs($('#dashHead')).display !== 'none' && $('.dash-kiosk-exit').length === 0 && $('.dash-kiosk-hint').length === 0, $('body').attr('class'));
  var n = FS.length; $('#dashMain').trigger('click');
  eq('out of kiosk, a click asks nothing', FS.length, n);
  ok('the action bar is back with the Kiosk button, whose link is a direct kiosk link', $('#dashHeadActions').children().length > 0 && $('a.dash-btn[href*="kiosk=1"]').length === 1, $('#dashHeadActions').html().substring(0, 120));
  ok('the address lost kiosk=1', lastUrl().indexOf('kiosk=1') === -1 && lastUrl().indexOf('id=kio1') > -1, lastUrl());
  ok('the countdown is back in the title band with the author\'s interval (Off)', $('#dashCountdown').length === 0 || !$('#dashCountdown').hasClass('dash-cd-fixed'), $('#dashCountdown').attr('class'));
  // ══════ D. the button path, and the full-screen Esc exit ══════
  $('a.dash-btn[href*="kiosk=1"]')[0].click();
  return until(function () { return $('body').hasClass('dash-kiosk'); }, 3000);
}).then(function (on) {
  ok('the Kiosk button enters kiosk view once the (stubbed) full screen is granted, with no hint', on && $('.dash-kiosk-hint').length === 0, $('body').attr('class'));
  fsChange(true);
  window.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
  ok('in full screen, Esc on the window is left to the browser', $('body').hasClass('dash-kiosk'), $('body').attr('class'));
  fsChange(false);
  return wait(200);
}).then(function () {
  ok('leaving full screen (fullscreenchange) ends kiosk view', !$('body').hasClass('dash-kiosk') && $('.dash-kiosk-exit').length === 0, $('body').attr('class'));
  // ══════ E. Esc on the page itself leaves a windowed kiosk (the window listener, at capture) ══════
  $('a.dash-btn[href*="kiosk=1"]')[0].click();
  return until(function () { return $('body').hasClass('dash-kiosk'); }, 3000);
}).then(function (on) {
  ok('back in kiosk view through the button, windowed (the stub granted nothing visible)', on, $('body').attr('class'));
  window.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true }));
  return wait(200);
}).then(function () {
  ok('Esc on the page itself leaves a windowed kiosk too', !$('body').hasClass('dash-kiosk') && $('.dash-kiosk-exit').length === 0 && $('#dashHeadActions').children().length > 0, $('body').attr('class'));
  ok('the tiles kept their rows through it all', stat('d1') === '233' && tile('d2').find('tbody tr').length === 3, stat('d1'));
  ok('no exception escaped', ERRORS.length === 0, ERRORS.join(' | '));
  publish();
}).catch(function (e) {
  L.push('HARNESS_ERROR: ' + (e && e.message ? e.message : e) + ' @ ' + String(e && e.stack || '').split('\n')[1]);
  publish();
});
</script></body></html>
