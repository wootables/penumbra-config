<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="main.css"><link rel="stylesheet" href="penumbra_tiles.css"><link rel="stylesheet" href="penumbra_dashboard.css">
</head><body class="pnb-dash theme-wolfpack-dark is-dark">
<!-- Chip COUNTS on the Controls tile (2026-10-01): a count only when every tile that
     has the column reads ONE report - STATUS and TYPE (repA alone), NAME (repB alone)
     count; COLLEGE (repA and repC) does not; ZIP (repD, 5,001 rows, reached only by a
     table excerpt, so the fill read is capped) does not. With nothing else filtering
     the group the counts come from the full unfiltered rows already held (no extra
     read); a pressed chip in another group sends ONE capped read per group with the
     other conditions routed as a tile's are (CALLS shows it), cached, and the chips
     redraw with the narrowed numbers; the group's own selection never narrows its own
     counts; a refresh forgets the reads. The editor's Counts box: off -> nocounts
     saved, no numbers, re-opened unticked. Same stubbed server as controls4.html. -->
<div id="dashApp" class="dash-app"><header class="dash-head" id="dashHead">
  <div class="dash-head-title" id="dashHeadTitle"></div>
  <div class="dash-head-actions" id="dashHeadActions"></div>
</header><main id="dashMain"></main></div>
<pre id="out">running</pre>
<script src="jquery-3.7.1.min.js"></script>
<script src="chart-4.5.1.min.js"></script>
<script>
var CALLS = [], ERRORS = [], REPLACED = [], AJAX = [], ALERTS = [];
window.onerror = function (m, src, line) { ERRORS.push('onerror: ' + m + ' @' + String(src).split('/').pop() + ':' + line); };
history.replaceState = function (s, t, u) { REPLACED.push(String(u)); };
window.alert = function (m) { ALERTS.push(String(m)); };
window.confirm = function () { return true; };
jQuery.fx.off = true;

var REP = {
  repA: [ { COLLEGE: 'Eng', AMOUNT: '10',  STATUS: 'Open',   TYPE: 'New' },
          { COLLEGE: 'Sci', AMOUNT: '20',  STATUS: 'Open',   TYPE: 'Renewal' },
          { COLLEGE: 'Eng', AMOUNT: '3',   STATUS: 'Closed', TYPE: 'New' },
          { COLLEGE: 'Ag',  AMOUNT: '200', STATUS: 'Closed', TYPE: 'New' },
          { COLLEGE: 'Eng', AMOUNT: '5',   STATUS: 'Open',   TYPE: 'New' } ],
  repB: [ { NAME: 'Ada', AMOUNT: '7' }, { NAME: 'Bob', AMOUNT: '2' }, { NAME: 'Cy', AMOUNT: '150' } ],
  repC: [ { COLLEGE: 'Eng', AMOUNT: '1' }, { COLLEGE: 'Vet', AMOUNT: '1' } ],
  repD: []
};
for (var zi = 0; zi < 5001; zi++) { REP.repD.push({ ZIP: 'Z' + (zi % 3), AMOUNT: '1' }); }
function num(v) { var t = String(v).trim(); return /^-?\d*\.?\d+$/.test(t) ? parseFloat(t) : null; }
function cond(row, part) {
  var m = part.match(/^\s*(\w+)\s*(>=|<=|!=|=|>|<)\s*(.+?)\s*$/);
  if (!m) { return false; }
  var v = row[m[1].toUpperCase()];
  if (v === undefined) { return false; }
  var rx = /^\/(.*)\/i?$/.exec(m[3]);
  if (rx) { var hit = new RegExp(rx[1], 'i').test(String(v)); return m[2] === '!=' ? !hit : hit; }
  var a = num(v), b = num(m[3]);
  if (a === null || b === null) { return m[2] === '=' ? String(v).toLowerCase() === m[3].toLowerCase() : false; }
  switch (m[2]) { case '>=': return a >= b; case '<=': return a <= b; case '>': return a > b; case '<': return a < b; case '=': return a === b; default: return a !== b; }
}
function filt(rows, text) {
  if (!text) { return rows; }
  var ors = text.split(/\s+or\s+/i).map(function (s) { return s.split(/\s+and\s+/i); });
  return rows.filter(function (r) { return ors.some(function (ands) { return ands.every(function (p) { return cond(r, p); }); }); });
}
function routeStub(ds, cols) {
  var spec = JSON.parse(ds), keep = [], skipped = [];
  spec.f.forEach(function (fr) {
    var c = String(fr[0] || '').toUpperCase();
    if (!c || cols.indexOf(c) > -1) { keep.push(fr[1]); } else if (skipped.indexOf(c) < 0) { skipped.push(c); }
  });
  return { text: keep.length ? (spec.p || '') + keep.join(' and ') : '', skipped: skipped };
}
$.getJSON = function (url, params) {
  params = params || {};
  CALLS.push({ url: url, p: $.extend({}, params) });
  var d = $.Deferred();
  setTimeout(function () {
    if (url === 'index.php') {
      var rows = REP[params.id];
      if (!rows) { d.resolve({ data: [{ ERROR: 'Report Not Found (ID: ' + params.id + ')' }] }); return; }
      var resp = { columns: Object.keys(REP[params.id][0]).concat(['#']) };
      if (params.search) { rows = filt(rows, params.search); }
      if (params.dsearch) { var r = routeStub(params.dsearch, Object.keys(REP[params.id][0])); rows = filt(rows, r.text); resp.search_skipped = r.skipped; }
      if (params.limit && rows.length > params.limit) { resp.total_rows = rows.length; rows = rows.slice(0, params.limit); }
      resp.data = rows;
      d.resolve(resp);
    } else if (url === 'manage_dashboard.php') {
      d.resolve({ status: 'success', data: [] });
    } else { d.reject({ status: 404 }); }
  }, 10);
  return d.promise();
};
$.ajax = function (o) { AJAX.push(o); var d = $.Deferred(); d.resolve({ status: 'success' }); return d.promise(); };

const penumbra_dash_vars = {
  currentUserKey: 'tester', isAdmin: true, canCreate: true, reportGrantPatterns: [],
  shortId: 'ctl5', found: true, canEdit: true,
  shibboleth: { name: 'Ada', fname: 'Ada' },
  meta: { short_id: 'ctl5', title: 'Chip counts', owner_id: 'tester', authorized: 'tester', updated_at: '' },
  state: { version: 1, theme: 'theme-default', refreshSeconds: 0, tiles: [
    { id: 'c1', type: 'controls', label: 'Filters', strip: ['College|COLLEGE', 'Status|STATUS', 'Type|TYPE', 'Name|NAME', 'Zip|ZIP', 'labels=left'], w: 12, h: 2 },
    { id: 's1', type: 'stat', report: 'repA', label: 'A total', agg: 'sum', column: 'AMOUNT', format: 'number', w: 3, h: 1, source: 'live' },
    { id: 's3', type: 'stat', report: 'repC', label: 'C total', agg: 'sum', column: 'AMOUNT', format: 'number', w: 3, h: 1, source: 'live' },
    { id: 't1', type: 'table', report: 'repB', label: 'People', columns: ['NAME', 'AMOUNT'], rows: 5, w: 3, h: 2, source: 'live' },
    { id: 't4', type: 'table', report: 'repD', label: 'Zips', columns: ['ZIP', 'AMOUNT'], rows: 5, w: 3, h: 2, source: 'live' }
  ] },
  themes: [{ id: 'theme-default', label: 'Default Light', isDark: false }]
};
</script>
<script src="purify.min.js"></script><script src="penumbra_tiles.js"></script>
<script src="dash.js"></script>
<script>
var L = [];
function ok(n, c, x) { L.push((c ? 'PASS ' : 'FAIL ') + n + (x !== undefined && !c ? '  [' + x + ']' : '')); }
function eq(n, got, want) { ok(n, JSON.stringify(got) === JSON.stringify(want), 'got ' + JSON.stringify(got) + ' want ' + JSON.stringify(want)); }
function tile(id) { return $('.dash-tile[data-tile-id="' + id + '"]'); }
function stat(id) { return tile(id).find('.dash-stat-value').text(); }
function box() { return String($('#dashSearchInput').val()); }
function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function until(fn, ms) {
  var t0 = Date.now();
  return new Promise(function (res) {
    (function poll() { var v = false; try { v = fn(); } catch (e) { } if (v || Date.now() - t0 > ms) { res(!!v); } else { setTimeout(poll, 100); } })();
  });
}
function G(col) { return tile('c1').find('.pnb-fs-group[data-fs-col="' + col + '"]'); }
function chips(col) { return G(col).find('.pnb-fs-chip').map(function () { return $(this).attr('data-fs-val') + (($(this).find('.pnb-fs-n').length) ? ':' + $(this).find('.pnb-fs-n').text() : ''); }).get(); }
function chip(col, v) { return G(col).find('.pnb-fs-chip').filter(function () { return $(this).attr('data-fs-val') === v; }); }
function countReads() { return CALLS.filter(function (c) { return c.url === 'index.php' && c.p.limit === 5000 && c.p.dsearch; }).map(function (c) { return c.p.id + ' ' + JSON.parse(c.p.dsearch).f.map(function (f) { return f[0] + '=' + f[1]; }).join(' & '); }); }
function lastState() { var a = AJAX[AJAX.length - 1]; try { return JSON.parse(JSON.parse(a.data).state_data); } catch (e) { return null; } }
function savedTile(st, id) { return st ? st.tiles.filter(function (x) { return x.id === id; })[0] || null : null; }
function publish() {
  var A = 'RES' + 'ULT>>', B2 = '<' + '<FIN';
  document.getElementById('out').textContent = A + L.join(' ;; ') + B2;
}

until(function () { return stat('s1') === '238' && stat('s3') === '2' && tile('t1').find('tbody tr').length === 3 && chips('ZIP').length === 3 && chips('STATUS').length === 2 && chips('NAME').length === 3 && /:/.test(chips('NAME')[0]); }, 15000).then(function (ready) {
  ok('the tiles loaded and the chips drew with their first counts', ready, 'stat=' + stat('s1') + ' zip=' + JSON.stringify(chips('ZIP')) + ' status=' + JSON.stringify(chips('STATUS')) + ' name=' + JSON.stringify(chips('NAME')));
  // ══════ A. which groups count ══════
  eq('a column one report holds counts its rows (STATUS from the stat tile\'s full rows)', chips('STATUS'), ['Closed:2', 'Open:3']);
  eq('... TYPE too', chips('TYPE'), ['New:4', 'Renewal:1']);
  eq('... NAME from the fill read of a report reached only by a table excerpt', chips('NAME'), ['Ada:1', 'Bob:1', 'Cy:1']);
  eq('a column two reports hold shows no count (one number could not mean anything)', chips('COLLEGE'), ['Ag', 'Eng', 'Sci', 'Vet']);
  eq('a capped read (5,001 rows behind a table excerpt) shows the values but no count', chips('ZIP'), ['Z0', 'Z1', 'Z2']);
  eq('no count read went out: nothing else filters any group yet', countReads(), []);
  // ══════ B. a pressed chip narrows the OTHER groups through one read each ══════
  chip('STATUS', 'Open').trigger('click');
  return until(function () { return stat('s1') === '35' && chips('TYPE').join() === 'New:2,Renewal:1'; }, 6000);
}).then(function () {
  eq('the filter applied (10 + 20 + 5)', [box(), stat('s1')], ['STATUS = /^(?:Open)$/', '35']);
  eq('TYPE counts what the pressed STATUS leaves', chips('TYPE'), ['New:2', 'Renewal:1']);
  eq("STATUS keeps its full counts: a group's own selection never narrows itself", chips('STATUS'), ['Closed:2', 'Open:3']);
  eq('NAME is unchanged (its report has no STATUS, the server kept every row)', chips('NAME'), ['Ada:1', 'Bob:1', 'Cy:1']);
  var reads = countReads();
  ok('one capped read per OTHER counting group went through the server with the condition routed (TYPE, NAME, ZIP): none for STATUS itself, none for COLLEGE (two reports)', reads.length === 3 && reads.every(function (r) { return /STATUS=STATUS = \/\^\(\?:Open\)\$\//.test(r); }) && reads.filter(function (r) { return r.indexOf('repA ') === 0; }).length === 1, JSON.stringify(reads));
  ok('COLLEGE still shows no count, ZIP neither', chips('COLLEGE').join() === 'Ag,Eng,Sci,Vet' && chips('ZIP').join() === 'Z0,Z1,Z2', chips('COLLEGE').join() + ' / ' + chips('ZIP').join());
  var n0 = countReads().length;
  chip('TYPE', 'New').trigger('click');
  return until(function () { return box() === 'STATUS = /^(?:Open)$/ and TYPE = /^(?:New)$/' && chips('STATUS').join() === 'Closed:2,Open:2'; }, 6000);
}).then(function () {
  eq('a second group pressed: STATUS now counts what TYPE leaves (Closed 2 of New, Open 2 of New)', chips('STATUS'), ['Closed:2', 'Open:2']);
  eq('... and TYPE keeps counting what STATUS leaves', chips('TYPE'), ['New:2', 'Renewal:1']);
  ok('the reads are cached by their other-conditions text: TYPE\'s read (others = STATUS) was not repeated', countReads().filter(function (r) { return r === 'repA STATUS=STATUS = /^(?:Open)$/'; }).length === 1, JSON.stringify(countReads()));
  tile('c1').find('.pnb-fs-clearall').trigger('click');
  return until(function () { return box() === '' && chips('TYPE').join() === 'New:4,Renewal:1'; }, 6000);
}).then(function () {
  eq('Clear all: the full counts come back from the rows already held', [chips('STATUS'), chips('TYPE')], [['Closed:2', 'Open:3'], ['New:4', 'Renewal:1']]);
  // ══════ C. the editor's Counts box ══════
  $('#dashEditBtn').trigger('click');
  tile('c1').find('.dash-tt-btn[data-act="edit"]').trigger('click');
  return until(function () { return $('#teCtlFields').length === 1; }, 3000);
}).then(function () {
  eq('the editor opens with Counts on', $('#teCtlCounts').is(':checked'), true);
  $('#teCtlCounts').prop('checked', false);
  $('#teApply').trigger('click');
  return until(function () { return $('#dashOverlay').length === 0 && chips('STATUS').join() === 'Closed,Open'; }, 3000);
}).then(function () {
  eq('Counts off: no numbers on any chip', [chips('STATUS'), chips('NAME')], [['Closed', 'Open'], ['Ada', 'Bob', 'Cy']]);
  $('#dashSaveBtn').trigger('click');
  var c1 = savedTile(lastState(), 'c1');
  eq('saved: the argument list carries nocounts', c1 && c1.strip, ['College|COLLEGE', 'Status|STATUS', 'Type|TYPE', 'Name|NAME', 'Zip|ZIP', 'labels=left', 'nocounts']);
  tile('c1').find('.dash-tt-btn[data-act="edit"]').trigger('click');
  return until(function () { return $('#teCtlFields').length === 1; }, 3000);
}).then(function () {
  eq('re-opened: Counts unticked', $('#teCtlCounts').is(':checked'), false);
  $('#teCtlCounts').prop('checked', true);
  $('#teApply').trigger('click');
  return until(function () { return $('#dashOverlay').length === 0 && chips('STATUS').join() === 'Closed:2,Open:3'; }, 3000);
}).then(function () {
  eq('ticked again: the counts are back', chips('STATUS'), ['Closed:2', 'Open:3']);
  ok('no exception escaped', ERRORS.length === 0, ERRORS.join(' | '));
  publish();
}).catch(function (e) {
  L.push('HARNESS_ERROR: ' + (e && e.message ? e.message : e) + ' @ ' + String(e && e.stack || '').split('\n')[1]);
  publish();
});
</script></body></html>
