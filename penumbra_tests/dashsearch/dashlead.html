<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="main.css"><link rel="stylesheet" href="penumbra_tiles.css"><link rel="stylesheet" href="penumbra_dashboard.css">
</head><body class="pnb-dash theme-wolfpack-dark is-dark">
<!-- The short form COLUMN value at LOAD (2026-09-30): the dashboard opens with
     ?search=COLLEGE Eng in its address, before any tile has answered. No tile
     can say yet whether COLLEGE is a column, so the filter first goes out as a
     global term; once the report that has COLLEGE answers, the tiles whose
     report lacks it are sent the filter again, routed by the column - and show
     every row with a "not filtered" reason instead of the 0 rows a search of
     every cell for the words gave. Same scaffolding as dash.html (stub server,
     stub.html frames); the stub server reads the short form as both engines
     do: COLUMN contains value where the row has the column, the words
     everywhere otherwise. -->
<div id="dashApp" class="dash-app"><header class="dash-head" id="dashHead">
  <div class="dash-head-title" id="dashHeadTitle"></div>
  <div class="dash-head-actions" id="dashHeadActions"></div>
</header><main id="dashMain"></main></div>
<pre id="out">running</pre>
<script src="jquery-3.7.1.min.js"></script>
<script src="chart-4.5.1.min.js"></script>
<script>
var CALLS = [], ERRORS = [], REPLACED = [];
window.onerror = function (m, src, line) { ERRORS.push('onerror: ' + m + ' @' + String(src).split('/').pop() + ':' + line); };
history.replaceState = function (s, t, u) { REPLACED.push(String(u)); };

var REP = {
  repA: [ { COLLEGE: 'Eng', AMOUNT: '10', STATUS: 'Open' }, { COLLEGE: 'Sci', AMOUNT: '20', STATUS: 'Open' },
          { COLLEGE: 'Eng', AMOUNT: '3', STATUS: 'Closed' }, { COLLEGE: 'Ag', AMOUNT: '200', STATUS: 'Closed' } ],
  repB: [ { NAME: 'Ada', AMOUNT: '7' }, { NAME: 'Bob', AMOUNT: '2' }, { NAME: 'Cy', AMOUNT: '150' } ]
};
function cond(row, part) {
  var m = part.match(/^\s*(\w+)\s*(=|>|<)\s*(.+?)\s*$/);
  if (!m) {
    // The short form COLUMN value (contains) on a row that has the column, as both engines read it.
    var b = part.match(/^\s*(\w+)\s+(\S+)\s*$/);
    if (b && row[b[1].toUpperCase()] !== undefined) { return String(row[b[1].toUpperCase()]).toLowerCase().indexOf(b[2].toLowerCase()) > -1; }
    var needle = part.trim().toLowerCase();
    return Object.keys(row).some(function (k) { return String(row[k]).toLowerCase().indexOf(needle) > -1; });
  }
  var v = row[m[1].toUpperCase()];
  if (v === undefined) { return false; }
  if (m[2] === '=') { return String(v).toLowerCase() === m[3].toLowerCase(); }
  var a = parseFloat(v), b2 = parseFloat(m[3]);
  return m[2] === '>' ? a > b2 : a < b2;
}
function filt(rows, text) {
  if (!text) { return rows; }
  var ors = text.split(/\s+or\s+/i).map(function (s) { return s.split(/\s+and\s+/i); });
  return rows.filter(function (r) { return ors.some(function (ands) { return ands.every(function (p) { return cond(r, p); }); }); });
}
function routeStub(ds, cols) {
  var spec = JSON.parse(ds), keep = [], skipped = [];
  spec.f.forEach(function (fr) {
    var c = String(fr[0] || '').toUpperCase();
    if (!c || cols.indexOf(c) > -1) { keep.push(fr[1]); } else if (skipped.indexOf(c) < 0) { skipped.push(c); }
  });
  return { text: keep.length ? (spec.p || '') + keep.join(' and ') : '', skipped: skipped };
}
$.getJSON = function (url, params) {
  params = params || {};
  CALLS.push({ url: url, p: $.extend({}, params) });
  var d = $.Deferred();
  setTimeout(function () {
    if (url === 'index.php') {
      var rows = REP[params.id];
      if (!rows) { d.resolve({ data: [{ ERROR: 'Report Not Found (ID: ' + params.id + ')' }] }); return; }
      var resp = {};
      if (params.search) { rows = filt(rows, params.search); }
      if (params.dsearch) {
        var r = routeStub(params.dsearch, Object.keys(REP[params.id][0]));
        rows = filt(rows, r.text);
        resp.search_skipped = r.skipped;
      }
      if (params.limit && rows.length > params.limit) { resp.total_rows = rows.length; rows = rows.slice(0, params.limit); }
      resp.data = rows;
      d.resolve(resp);
    } else if (url === 'manage_dashboard.php') {
      d.resolve({ status: 'success', data: [] });
    } else { d.reject({ status: 404 }); }
  }, 10);
  return d.promise();
};
$.ajax = function () { var d = $.Deferred(); d.resolve({ status: 'success' }); return d.promise(); };

const penumbra_dash_vars = {
  currentUserKey: 'tester', isAdmin: true, canCreate: true, reportGrantPatterns: [],
  shortId: 'demo', found: true, canEdit: true,
  urlSearchOverride: '?fy=2026&search=COLLEGE%20Eng',
  shibboleth: { name: 'Ada', fname: 'Ada' },
  meta: { short_id: 'demo', title: 'Lead demo', owner_id: 'tester', authorized: 'tester', updated_at: '' },
  state: { version: 1, theme: 'theme-default', refreshSeconds: 0, tiles: [
    { id: 'd1', type: 'stat',  report: 'repA', label: 'A total', agg: 'sum', column: 'AMOUNT', format: 'number', w: 4, h: 1, source: 'live' },
    { id: 'd2', type: 'table', report: 'repB', label: 'People', columns: ['NAME', 'AMOUNT'], rows: 5, w: 4, h: 2, source: 'live' },
    { id: 'd7', type: 'note',  label: '', text: 'a note', w: 4, h: 1 },
    { id: 'e1', type: 'embed', report: 'repA', label: 'A table', show: 'table', w: 6, h: 3, autoHeight: false },
    { id: 'e2', type: 'embed', report: 'repB', label: 'B full', show: 'both', w: 6, h: 3, autoHeight: false }
  ] },
  themes: [{ id: 'theme-default', label: 'Default Light', isDark: false }]
};
</script>
<script src="purify.min.js"></script><script src="penumbra_tiles.js"></script>
<script>
(function () {
  var real = PenumbraTiles.embedUrl;
  PenumbraTiles.embedUrl = function (spec, opts) { return String(real.call(PenumbraTiles, spec, opts)).replace(/^index\.php\?/, 'stub.html?'); };
})();
</script>
<script src="dash.js"></script>
<script>
var L = [];
function ok(n, c, x) { L.push((c ? 'PASS ' : 'FAIL ') + n + (x !== undefined && !c ? '  [' + x + ']' : '')); }
function eq(n, got, want) { ok(n, JSON.stringify(got) === JSON.stringify(want), 'got ' + JSON.stringify(got) + ' want ' + JSON.stringify(want)); }
function tile(id) { return $('.dash-tile[data-tile-id="' + id + '"]'); }
function frame(id) { return tile(id).find('iframe.dash-embed')[0] || null; }
function fwin(id) { var f = frame(id); try { return f ? f.contentWindow : null; } catch (e) { return null; } }
function booted(id) { var w = fwin(id); try { return !!(w && w.__boot); } catch (e) { return false; } }
function stat(id) { return tile(id).find('.dash-stat-value').text(); }
function calls(id) { return CALLS.filter(function (c) { return c.url === 'index.php' && c.p.id === id; }).map(function (c) { return c.p; }); }
function lastCall(id) { var c = calls(id); return c.length ? c[c.length - 1] : null; }
function search(id) { try { return fwin(id).document.getElementById('tableSearch').value; } catch (e) { return 'x'; } }
function note() { return $('#dashFilterNote').text(); }
function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function until(fn, ms) {
  var t0 = Date.now();
  return new Promise(function (res) {
    (function poll() { var v = false; try { v = fn(); } catch (e) { } if (v || Date.now() - t0 > ms) { res(!!v); } else { setTimeout(poll, 100); } })();
  });
}
function enter(text) {
  $('#dashSearchInput').val(text).trigger('input');
  $('#dashSearchInput').trigger($.Event('keydown', { key: 'Enter' }));
}
function publish() {
  var A = 'RES' + 'ULT>>', B = '<' + '<FIN';
  document.getElementById('out').textContent = A + L.join(' ;; ') + B;
}
var DS0 = '{"p":"","f":[["","COLLEGE Eng"]]}';
var DS1 = '{"p":"","f":[["COLLEGE","COLLEGE Eng"]]}';
var DSN = '{"p":"","f":[["NAME","NAME Ada"]]}';
function e2Routed() {
  var w = fwin('e2'), last = (w && w.__applied || []).slice(-1)[0] || null;
  return (!!last && last.dsearch === DS1) || (frame('e2').getAttribute('src') || '').indexOf('dsearch=' + encodeURIComponent(DS1)) > -1;
}

setTimeout(function () { window.scrollTo(0, document.body.scrollHeight); }, 250);
setTimeout(function () { window.scrollTo(0, 0); }, 600);

until(function () { return ['e1', 'e2'].every(booted) && stat('d1') !== ''; }, 9000).then(function (ready) {
  ok('every frame and data tile loaded', ready, ['e1', 'e2'].map(function (id) { return id + ':' + booted(id); }).join(' ') + ' d1=' + stat('d1'));
  eq('the box shows the filter from the address', $('#dashSearchInput').val(), 'COLLEGE Eng');
  var first = calls('repB')[0] || null;
  ok('at load the short form went out as a global term: no tile had answered yet', !!first && first.dsearch === DS0, JSON.stringify(first));
  // ══════ the report that has COLLEGE answers: the others are sent the filter again, routed ══════
  return until(function () { return tile('d2').find('tbody tr').length === 3 && search('e2') === '' && e2Routed(); }, 6000);
}).then(function (moved) {
  ok('the tile without the column was sent the filter again, routed by the column', moved && (lastCall('repB') || {}).dsearch === DS1, JSON.stringify(calls('repB')));
  ok('it shows every row (the column is not its to filter by)', tile('d2').find('tbody tr').length === 3, tile('d2').find('tbody').text());
  eq('the report with the column read it as COLLEGE contains Eng', stat('d1'), '13');
  eq('the report with the column was fetched once, not again for the resolved list', calls('repA').filter(function (p) { return !!p.dsearch; }).length, 1);
  ok('the note names the tiles the short form does not reach', note().indexOf('People (its report has no COLLEGE column)') > -1 && note().indexOf('B full (its report has no COLLEGE column)') > -1, note());
  ok('the note leaves out the tiles it reaches', note().indexOf('A total') === -1 && note().indexOf('A table') === -1, note());
  eq('the framed reports: applied where the column is, left out where it is not', [search('e1'), search('e2')], ['COLLEGE Eng', '']);
  ok('the framed report without the column received the routed list', e2Routed(), JSON.stringify((fwin('e2').__applied || []).slice(-1)));

  // ══════ typed after load: every tile is known, so the short form routes at once ══════
  enter('NAME Ada');
  return until(function () { return stat('d1') === '233' && tile('d2').find('tbody tr').length === 1; }, 5000);
}).then(function () {
  return wait(400);
}).then(function () {
  ok('a short form typed once the tiles are known goes out routed at once', (lastCall('repA') || {}).dsearch === DSN && (lastCall('repB') || {}).dsearch === DSN, JSON.stringify([lastCall('repA'), lastCall('repB')]));
  eq('the report without NAME keeps every row; the one with it filters', [stat('d1'), tile('d2').find('tbody tr').length], ['233', 1]);
  ok('the note names the tiles without NAME', note().indexOf('A total (its report has no NAME column)') > -1 && note().indexOf('A table (its report has no NAME column)') > -1 && note().indexOf('People') === -1, note());
  eq('the framed reports follow', [search('e1'), search('e2')], ['', 'NAME Ada']);

  // ══════ words no tile has as a column ══════
  enter('Zed grant');
  return wait(700);
}).then(function () {
  ok('words no tile has as a column stay a global term on every tile', (lastCall('repA') || {}).dsearch === '{"p":"","f":[["","Zed grant"]]}', JSON.stringify(lastCall('repA')));
  ok('and no tile is marked not filtered for them', note() === '' && $('.dash-nofilter-badge').length === 0, note());
  ok('no exception escaped', ERRORS.length === 0, ERRORS.join(' | '));
  publish();
}).catch(function (e) {
  L.push('HARNESS_ERROR: ' + (e && e.message ? e.message : e) + ' @ ' + String(e && e.stack || '').split('\n')[1]);
  publish();
});
</script></body></html>
