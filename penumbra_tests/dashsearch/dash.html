// A small emulation of the server: the literal rule (a condition on a column the
// rows lack matches nothing), AND-precedence, and index.php's &dsearch= routing.
function cond(row, part) {
  var m = part.match(/^\s*(\w+)\s*(=|>|<)\s*(.+?)\s*$/);
  if (!m) {
    // The short form COLUMN value (contains) on a row that has the column, as both engines read it.
    var b = part.match(/^\s*(\w+)\s+(\S+)\s*$/);
    if (b && row[b[1].toUpperCase()] !== undefined) { return String(row[b[1].toUpperCase()]).toLowerCase().indexOf(b[2].toLowerCase()) > -1; }
    var needle = part.trim().toLowerCase();
    return Object.keys(row).some(function (k) { return String(row[k]).toLowerCase().indexOf(needle) > -1; });
  }
  var v = row[m[1].toUpperCase()];
  if (v === undefined) { return false; }
  // COL = /regex/ (what a chip or a clicked value writes), as the engines read it.
  var rx = new RegExp('^/(.*)/([a-z]*)$').exec(m[3]);
  if (m[2] === '=' && rx) { return new RegExp(rx[1], rx[2].indexOf('i') > -1 ? rx[2] : rx[2] + 'i').test(String(v)); }
  if (m[2] === '=') { return String(v).toLowerCase() === m[3].toLowerCase(); }
  var a = parseFloat(v), b = parseFloat(m[3]);
  return m[2] === '>' ? a > b : a < b;
}
function filt(rows, text) {
  if (!text) { return rows; }
  var ors = text.split(/\s+or\s+/i).map(function (s) { return s.split(/\s+and\s+/i); });
  return rows.filter(function (r) { return ors.some(function (ands) { return ands.every(function (p) { return cond(r, p); }); }); });
}

  spec.f.forEach(function (fr) {

    if (!c || cols.indexOf(c) > -1) { keep.push(fr[1]); } else if (skipped.indexOf(c) < 0) { skipped.push(c); }
  });
  return { text: keep.length ? (spec.p || '') + keep.join(' and ') : '', skipped: skipped };
}

function clickBar(ch, label) {
  var idx = ch.data.labels.indexOf(label), el = ch.getDatasetMeta(0).data[idx];
  var pt = el.getCenterPoint ? el.getCenterPoint() : { x: el.x, y: el.y }, r = ch.canvas.getBoundingClientRect();
  // Chart.js hands DOM events to its listeners on an animation frame, which
  // headless virtual time starves: hit-test the bar's centre as a chart event
  // (a chart event carries its own x/y) and call the hook the chart was built
  // with (renderChart's onClick option).
  var native = new MouseEvent('click', { bubbles: true, cancelable: true, clientX: r.left + pt.x, clientY: r.top + pt.y });
  var cev = { type: 'click', native: native, x: pt.x, y: pt.y };
  var els = ch.getElementsAtEventForMode(cev, 'nearest', { intersect: true }, false);

    // ââââââ G. the short form COLUMN value routes by its leading column (the tiles are known) ââââââ

  }).then(function () {
    return wait(400);
  }).then(function () {
    var DSL = '{"p":"","f":[["COLLEGE","COLLEGE Eng"]]}';

    ok('a report without the column keeps every row instead of searching its cells for the words', tile('d2').find('tbody tr').length === 3, tile('d2').find('tbody').text());

       [fwin('e1').document.getElementById('tableSearch').value, fwin('e2').document.getElementById('tableSearch').value], ['COLLEGE Eng', '']);
    enter('Zed grant');

  }).then(function () {
    ok('words no tile has as a column stay a global term on every tile', String((lastCall('repA') || {}).dsearch).indexOf('["","Zed grant"]') > -1, JSON.stringify(lastCall('repA')));

    return until(function () { return stat('d1') === '233'; }, 4000);
  }).then(function () {

  }).then(function () {
    return until(function () { return stat('d1') === '13'; }, 4000);
  }).then(function () {
    return wait(300);
  }).then(function () {
    ok('a bar click writes the exact-value condition', $('#dashSearchInput').val() === 'COLLEGE = /^(?:Eng)$/', JSON.stringify(window.__clk));

    return clickBar(Chart.getChart(tile('c1').find('canvas')[0]), 'Eng');
  }).then(function () {
    return until(function () { return stat('d1') === '233'; }, 4000);
  }).then(function () {
    eq('the same bar again releases it', $('#dashSearchInput').val(), '');

    return wait(300);
  }).then(function () {

  }).then(function () {
    // ══════ K. cross-filtering from the keyboard (WCAG 2.1.1, 2026-10-15) ══════

    $('.pnb-toast-card').remove();
    var $rows = tile('d2').find('tbody tr');

    var $hint = tile('d2').find('.dash-table-kbdhint');
    ok('K: a hint under the table names the keys while a row has focus', $hint.length === 1 && !$hint.prop('hidden') && /Enter filters the dashboard/.test($hint.text())

    $(ada).trigger($.Event('keydown', { key: 'ArrowRight' }));

    $(document.activeElement).trigger($.Event('keydown', { key: 'ArrowRight' }));
    ok('K: Right again moves to the next column', document.activeElement && $(document.activeElement).attr('data-col') === 'AMOUNT', document.activeElement && document.activeElement.outerHTML);
    $(document.activeElement).trigger($.Event('keydown', { key: 'ArrowLeft' }));
    ok('K: Left goes back', document.activeElement && $(document.activeElement).attr('data-col') === 'NAME' && $(document.activeElement).text() === 'Ada', document.activeElement && document.activeElement.outerHTML);
    $(document.activeElement).trigger($.Event('keydown', { key: 'Enter' }));
    return until(function () { return tile('d2').find('tbody tr').length === 1; }, 4000).then(function () { return wait(300); });
  }).then(function () {
    eq('K: Enter on a focused cell filters by its column and value, as a click does', $('#dashSearchInput').val(), 'NAME = /^(?:Ada)$/');
    ok('K: the result is announced', /Filtered every tile by NAME = Ada/.test($('#dashLive').text()), $('#dashLive').text());
    var ae = document.activeElement;
    ok('K: focus is put back on the same value in the redrawn table', !!ae && ae.tagName === 'TD' && $(ae).attr('data-col') === 'NAME' && $(ae).text() === 'Ada' && $.contains(tile('d2')[0], ae), ae && ae.outerHTML);
    $(ae).trigger($.Event('keydown', { key: 'Enter' }));
    return until(function () { return tile('d2').find('tbody tr').length === 3; }, 4000).then(function () { return wait(300); });
  }).then(function () {
    eq('K: Enter on the same value again releases it', $('#dashSearchInput').val(), '');
    ok('K: the release is announced', /Released NAME = Ada/.test($('#dashLive').text()), $('#dashLive').text());
    var bob = tile('d2').find('tbody tr').filter(function () { return $(this).children('td').first().text() === 'Bob'; })[0];

    $(bob).trigger($.Event('keydown', { key: ' ' }));
    return until(function () { return tile('d2').find('tbody tr').length === 1; }, 4000).then(function () { return wait(300); });
  }).then(function () {
    eq('K: Space on a row filters by its first plain value', $('#dashSearchInput').val(), 'NAME = /^(?:Bob)$/');
    $('#dashSearchClear').trigger('click');
    return until(function () { return stat('d1') === '233' && tile('d2').find('tbody tr').length === 3; }, 4000).then(function () { return wait(500); });
  }).then(function () {
    var $btn = tile('c1').find('.dash-xf-btn');

    var $m = $('#dashXfMenu'), $it = $m.find('[role="menuitemcheckbox"]');

       $it.map(function () { return $(this).text(); }).get().join(',') + ' | ' + (document.activeElement && document.activeElement.outerHTML));
    $it.filter(function () { return /Eng$/.test($(this).text()); }).trigger('click');

  }).then(function () {
    var $btn = tile('c1').find('.dash-xf-btn');

    ok('K: the menu closes, focus back on the Filter button, announced', $('#dashXfMenu').length === 0 && document.activeElement === $btn[0] && $btn.attr('aria-expanded') === 'false'
       && /Filtered every tile by COLLEGE = Eng/.test($('#dashLive').text()), (document.activeElement && document.activeElement.outerHTML) + ' | ' + $('#dashLive').text());
    $btn.trigger('click');
    var on = $('#dashXfMenu [role="menuitemcheckbox"][aria-checked="true"]');
    ok('K: the value in force reads checked when the menu opens again', on.length === 1 && /Eng$/.test(on.text()), on.length + ':' + on.text());
    document.activeElement.dispatchEvent(new KeyboardEvent('keydown', { key: 'Escape', bubbles: true, cancelable: true }));
    ok('K: Escape closes the menu and returns focus to its button', $('#dashXfMenu').length === 0 && document.activeElement === $btn[0] && $btn.attr('aria-expanded') === 'false', document.activeElement && document.activeElement.outerHTML);
    $('#dashSearchClear').trigger('click');
    return until(function () { return stat('d1') === '233'; }, 4000);
  }).then(function () {
    ok('no exception escaped', ERRORS.length === 0, ERRORS.join(' | '));
    publish();
  });
}).catch(function (e) {
  L.push('HARNESS_ERROR: ' + (e && e.message ? e.message : e) + ' @ ' + String(e && e.stack || '').split('\n')[1]);
  publish();
});
