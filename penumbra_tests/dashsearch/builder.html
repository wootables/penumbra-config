// A row's values in a nested column (every sub-row of every @@JSON cell).
function nestedVals(row, col) {
  var out = [];
  Object.keys(row).forEach(function (k) {
    var s = String(row[k]), at = s.indexOf('@@JSON'), t;
    if (at < 0) { return; }
    try { t = JSON.parse(s.slice(at + 6)); } catch (e) { return; }
    (t || []).forEach(function (o) { if (o && o[col] != null) { out.push(String(o[col]).replace(/^@@HTML/, '').replace(/<[^>]*>/g, '')); } });
  });
  return out;
}
function cond(row, part) {
  var m = part.match(/^\s*(\w+)\s*(=|>|<)\s*(.+?)\s*$/);
  if (!m) {
    var needle = part.trim().toLowerCase();
    return Object.keys(row).some(function (k) { return String(row[k]).toLowerCase().indexOf(needle) > -1; });
  }
  var v = row[m[1].toUpperCase()];
  if (v === undefined) {
    return nestedVals(row, m[1].toUpperCase()).some(function (nv) { return cond({ V: nv }, 'V ' + m[2] + ' ' + m[3]); });
  }
  if (m[2] === '=') { return String(v).toLowerCase() === m[3].toLowerCase(); }
  var a = parseFloat(v), b = parseFloat(m[3]);

    });
  });

}
