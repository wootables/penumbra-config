<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="main.css"><link rel="stylesheet" href="penumbra_tiles.css"><link rel="stylesheet" href="penumbra_dashboard.css">
</head><body class="pnb-dash theme-wolfpack-dark is-dark">
<!-- Range fields on the Controls tile (2026-09-30): 'Label|COLUMN|range' is a from /
     to pair that writes COL >= X and COL <= Y into the dashboard filter - numbers
     as plain digits, dates as ISO days from the browser's date picker. The pair
     commits together (Enter, or focus leaving it), a bad value is marked, a box
     being typed in is never redrawn over, the kinds come from the tiles' values,
     and the tile editor's "range" box is authored, saved and re-opened. Whether
     the two search engines read these texts alike is filterstrip's section J. -->
<div id="dashApp" class="dash-app"><header class="dash-head" id="dashHead">
  <div class="dash-head-title" id="dashHeadTitle"></div>
  <div class="dash-head-actions" id="dashHeadActions"></div>
</header><main id="dashMain"></main></div>
<pre id="out">running</pre>
<script src="jquery-3.7.1.min.js"></script>
<script src="chart-4.5.1.min.js"></script>
<script>
var CALLS = [], ERRORS = [], REPLACED = [], AJAX = [], ALERTS = [];
window.onerror = function (m, src, line) { ERRORS.push('onerror: ' + m + ' @' + String(src).split('/').pop() + ':' + line); };
history.replaceState = function (s, t, u) { REPLACED.push(String(u)); };
window.alert = function (m) { ALERTS.push(String(m)); };
window.confirm = function () { return true; };
jQuery.fx.off = true;

var REP = {
  repA: [ { COLLEGE: 'Eng', AMOUNT: '100',       OPENED: '01/15/2024', STATUS: 'Open' },
          { COLLEGE: 'Sci', AMOUNT: '$1,250.50', OPENED: '02/01/2024', STATUS: 'Open' },
          { COLLEGE: 'Eng', AMOUNT: '(500)',     OPENED: '12/31/2023', STATUS: 'Closed' },
          { COLLEGE: 'Ag',  AMOUNT: '2,000',     OPENED: '2024-03-11', STATUS: 'Closed' },
          { COLLEGE: 'Sci', AMOUNT: '300',       OPENED: '15-JAN-24',  STATUS: 'Open' } ],
  repB: [ { NAME: 'Ada', AMOUNT: '7' }, { NAME: 'Bob', AMOUNT: '250' }, { NAME: 'Cy', AMOUNT: '150' } ]
};
// A small server: numbers and dates compared as numbers and days (the real two
// engines are proven to agree on these texts by filterstrip's section J), the
// strip's /^(?:A|B)$/ alternation, AND-precedence, and &dsearch= routing.
var MON = { JAN: 1, FEB: 2, MAR: 3, APR: 4, MAY: 5, JUN: 6, JUL: 7, AUG: 8, SEP: 9, OCT: 10, NOV: 11, DEC: 12 };
function p2(n) { return (n < 10 ? '0' : '') + n; }
function day(v) {
  var m;
  if ((m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(v))) { return m[1] + '-' + p2(+m[2]) + '-' + p2(+m[3]); }
  if ((m = /^(\d{1,2})\/(\d{1,2})\/(\d{4})$/.exec(v))) { return m[3] + '-' + p2(+m[1]) + '-' + p2(+m[2]); }
  if ((m = /^(\d{1,2})-([A-Za-z]{3})-(\d{2})$/.exec(v))) { var y = +m[3]; return (y >= 69 ? 1900 + y : 2000 + y) + '-' + p2(MON[m[2].toUpperCase()]) + '-' + p2(+m[1]); }
  return null;
}
function num(v) {
  var t = String(v).trim(), neg = /^\(.*\)$/.test(t);
  t = t.replace(/[()$,%]/g, '');
  if (!/^-?\d*\.?\d+$/.test(t)) { return null; }
  return (neg ? -1 : 1) * parseFloat(t);
}
function cond(row, part) {
  var m = part.match(/^\s*(\w+)\s*(>=|<=|!=|=|>|<)\s*(.+?)\s*$/);
  if (!m) { return false; }
  var v = row[m[1].toUpperCase()];
  if (v === undefined) { return false; }
  var rx = /^\/(.*)\/i?$/.exec(m[3]);
  if (rx) { var hit = new RegExp(rx[1], 'i').test(String(v)); return m[2] === '!=' ? !hit : hit; }
  var a = num(v), b = num(m[3]);
  if (a === null || b === null) { a = day(String(v)); b = day(m[3]); if (a === null || b === null) { return m[2] === '=' ? String(v).toLowerCase() === m[3].toLowerCase() : false; } }
  switch (m[2]) { case '>=': return a >= b; case '<=': return a <= b; case '>': return a > b; case '<': return a < b; case '=': return a === b; default: return a !== b; }
}
function filt(rows, text) {
  if (!text) { return rows; }
  var ors = text.split(/\s+or\s+/i).map(function (s) { return s.split(/\s+and\s+/i); });
  return rows.filter(function (r) { return ors.some(function (ands) { return ands.every(function (p) { return cond(r, p); }); }); });
}
function routeStub(ds, cols) {
  var spec = JSON.parse(ds), keep = [], skipped = [];
  spec.f.forEach(function (fr) {
    var c = String(fr[0] || '').toUpperCase();
    if (!c || cols.indexOf(c) > -1) { keep.push(fr[1]); } else if (skipped.indexOf(c) < 0) { skipped.push(c); }
  });
  return { text: keep.length ? (spec.p || '') + keep.join(' and ') : '', skipped: skipped };
}
$.getJSON = function (url, params) {
  params = params || {};
  CALLS.push({ url: url, p: $.extend({}, params) });
  var d = $.Deferred();
  setTimeout(function () {
    if (url === 'index.php') {
      var rows = REP[params.id];
      if (!rows) { d.resolve({ data: [{ ERROR: 'Report Not Found (ID: ' + params.id + ')' }] }); return; }
      var resp = { columns: Object.keys(REP[params.id][0]).concat(['#']) };
      if (params.search) { rows = filt(rows, params.search); }
      if (params.dsearch) {
        var r = routeStub(params.dsearch, Object.keys(REP[params.id][0]));
        rows = filt(rows, r.text);
        resp.search_skipped = r.skipped;
      }
      if (params.limit && rows.length > params.limit) { resp.total_rows = rows.length; rows = rows.slice(0, params.limit); }
      resp.data = rows;
      d.resolve(resp);
    } else if (url === 'manage_dashboard.php') {
      d.resolve({ status: 'success', data: [] });
    } else { d.reject({ status: 404 }); }
  }, 10);
  return d.promise();
};
$.ajax = function (o) { AJAX.push(o); var d = $.Deferred(); d.resolve({ status: 'success' }); return d.promise(); };

const penumbra_dash_vars = {
  currentUserKey: 'tester', isAdmin: true, canCreate: true, reportGrantPatterns: [],
  shortId: 'ctl3', found: true, canEdit: true,
  shibboleth: { name: 'Ada', fname: 'Ada' },
  meta: { short_id: 'ctl3', title: 'Range controls', owner_id: 'tester', authorized: 'tester', updated_at: '' },
  state: { version: 1, theme: 'theme-default', refreshSeconds: 0, tiles: [
    { id: 'c1', type: 'controls', label: 'Filters', strip: ['Amount|AMOUNT|range', 'Opened|OPENED|range', 'College|COLLEGE', 'labels=left'], w: 12, h: 2 },
    { id: 'd1', type: 'stat', report: 'repA', label: 'A total', agg: 'sum', column: 'AMOUNT', format: 'number', w: 4, h: 1, source: 'live' },
    { id: 'd2', type: 'table', report: 'repB', label: 'People', columns: ['NAME', 'AMOUNT'], rows: 5, w: 4, h: 2, source: 'live' }
  ] },
  themes: [{ id: 'theme-default', label: 'Default Light', isDark: false }]
};
</script>
<script src="purify.min.js"></script><script src="penumbra_tiles.js"></script>
<script src="dash.js"></script>
<script>
var L = [];
function ok(n, c, x) { L.push((c ? 'PASS ' : 'FAIL ') + n + (x !== undefined && !c ? '  [' + x + ']' : '')); }
function eq(n, got, want) { ok(n, JSON.stringify(got) === JSON.stringify(want), 'got ' + JSON.stringify(got) + ' want ' + JSON.stringify(want)); }
function tile(id) { return $('.dash-tile[data-tile-id="' + id + '"]'); }
function stat(id) { return tile(id).find('.dash-stat-value').text(); }
function note() { return $('#dashFilterNote').text(); }
function box() { return String($('#dashSearchInput').val()); }
function wait(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
function until(fn, ms) {
  var t0 = Date.now();
  return new Promise(function (res) {
    (function poll() { var v = false; try { v = fn(); } catch (e) { } if (v || Date.now() - t0 > ms) { res(!!v); } else { setTimeout(poll, 100); } })();
  });
}
function cs($e, pseudo) { return ($e && $e.length) ? getComputedStyle($e[0], pseudo || null) : {}; }
function G(col) { return tile('c1').find('.pnb-fs-group[data-fs-col="' + col + '"]'); }
function B(col, b) { return G(col).find('.pnb-fs-bound[data-fs-bound="' + b + '"]'); }
function enterIn($i) { $i.trigger('focus').trigger($.Event('keydown', { key: 'Enter' })); }
function lastState() {
  var a = AJAX[AJAX.length - 1];
  try { return JSON.parse(JSON.parse(a.data).state_data); } catch (e) { return null; }
}
function savedTile(st, id) { return st ? st.tiles.filter(function (x) { return x.id === id; })[0] || null : null; }
function rowRange() {
  return $('#teCtlFields .dash-ctl-row').map(function () {
    return [[$(this).find('.teCtlCol').val(), $(this).find('.teCtlRange').is(':checked'), $(this).find('.teCtlEx').prop('disabled'), $(this).find('.teCtlTop').prop('disabled')]];
  }).get();
}
function publish() {
  var A = 'RES' + 'ULT>>', B2 = '<' + '<FIN';
  document.getElementById('out').textContent = A + L.join(' ;; ') + B2;
}

until(function () { return stat('d1') !== '' && tile('d2').find('tbody tr').length === 3 && G('OPENED').attr('data-fs-kind') === 'date' && G('AMOUNT').attr('data-fs-kind') === 'number'; }, 12000).then(function (ready) {
  ok('the tiles loaded and the range kinds were learned from their values', ready, 'amount=' + G('AMOUNT').attr('data-fs-kind') + ' opened=' + G('OPENED').attr('data-fs-kind'));
  // ══════ A. drawing ══════
  eq('a number range: two text boxes, the tiles\' span as hints (repA and repB together)', [B('AMOUNT', 'min').attr('type'), B('AMOUNT', 'min').attr('placeholder'), B('AMOUNT', 'max').attr('placeholder')],
     ['text', (-500).toLocaleString(), (2000).toLocaleString()]);
  eq('a date range: two date pickers, the span in the title', [B('OPENED', 'min').attr('type'), B('OPENED', 'max').attr('title')], ['date', 'The data runs 2023-12-31 to 2024-03-11']);
  ok('the chips beside them still draw', G('COLLEGE').find('.pnb-fs-chip').length === 3, String(G('COLLEGE').find('.pnb-fs-chip').length));
  ok('the boxes wear the pill on the dark theme (computed: 999px radius, dark scheme)', cs(B('AMOUNT', 'min')).borderTopLeftRadius === '999px' && cs(B('OPENED', 'min')).colorScheme === 'dark',
     cs(B('AMOUNT', 'min')).borderTopLeftRadius + ' ' + cs(B('OPENED', 'min')).colorScheme);
  // ══════ B. Enter commits ══════
  B('AMOUNT', 'min').val('100');
  enterIn(B('AMOUNT', 'min'));
  return until(function () { return stat('d1') === '3,650.50'; }, 5000);
}).then(function () {
  eq('Enter writes the bound into the dashboard filter', box(), 'AMOUNT >= 100');
  eq('... applies it: the stat sums what is left (100 + 1,250.50 + 2,000 + 300)', stat('d1'), '3,650.50');
  eq('... and the table tile of repB follows (250, 150)', tile('d2').find('tbody tr').length, 2);
  ok('... and the tile is drawn again at once, focus still in the box: the range shows its clear, the strip a Clear all', G('AMOUNT').find('.pnb-fs-clear').length === 1 && tile('c1').find('.pnb-fs-clearall').length === 1,
     'clear=' + G('AMOUNT').find('.pnb-fs-clear').length + ' clearall=' + tile('c1').find('.pnb-fs-clearall').length);
  ok('focus stays on the box through the redraw', document.activeElement === B('AMOUNT', 'min')[0] && B('AMOUNT', 'min').val() === '100', document.activeElement && (document.activeElement.outerHTML || '').substring(0, 90));
  // ══════ C. the pair commits together ══════
  B('OPENED', 'min').val('2024-01-15').trigger('focus');
  B('OPENED', 'max').trigger('focus');
  return wait(300);
}).then(function () {
  eq('moving from one box to the other writes nothing yet', box(), 'AMOUNT >= 100');
  B('OPENED', 'max').val('2024-02-01');
  $('#dashSearchInput').trigger('focus');
  return until(function () { return box().indexOf('OPENED <=') > -1; }, 5000);
}).then(function () {
  eq('focus leaving the pair writes both, as ISO days', box(), 'AMOUNT >= 100 and OPENED >= 2024-01-15 and OPENED <= 2024-02-01');
  return until(function () { return stat('d1') === '1,650.50'; }, 5000);
}).then(function () {
  eq('... and the stat follows (100 + 1,250.50 + 300)', stat('d1'), '1,650.50');
  ok('the note names the tile whose report has no OPENED', note().indexOf('People (its report has no OPENED column)') > -1, note());
  // ══════ D. a bad value, and a box being typed in ══════
  B('AMOUNT', 'max').val('abc');
  enterIn(B('AMOUNT', 'max'));
  eq('a box that is not a number is marked at once', B('AMOUNT', 'max').attr('aria-invalid'), 'true');
  return wait(250);
}).then(function () {
  eq('... and nothing is written', box(), 'AMOUNT >= 100 and OPENED >= 2024-01-15 and OPENED <= 2024-02-01');
  B('AMOUNT', 'max').val('999').trigger('focus');
  $('#dashSearchInput').val(box() + ' and COLLEGE = /^(?:Eng)$/').trigger('input');
  return wait(500);
}).then(function () {
  eq('a redraw never runs over a box being typed in', B('AMOUNT', 'max').val(), '999');
  B('AMOUNT', 'max').val('');
  $('#dashSearchInput').trigger('focus').trigger($.Event('keydown', { key: 'Escape' }));
  return wait(400);
}).then(function () {
  eq('Escape puts the filter in force back, and the boxes with it', [box(), B('AMOUNT', 'min').val(), B('OPENED', 'max').val()], ['AMOUNT >= 100 and OPENED >= 2024-01-15 and OPENED <= 2024-02-01', '100', '2024-02-01']);
  // ══════ E. a year bound on a date field is not a day: it stays typed ══════
  $('#dashSearchInput').val('OPENED <= 2024').trigger($.Event('keydown', { key: 'Enter' }));
  return until(function () { return box() === 'OPENED <= 2024' && stat('d1') !== ''; }, 5000);
}).then(function () {
  eq('a year bound leaves the pickers empty', [B('OPENED', 'min').val(), B('OPENED', 'max').val()], ['', '']);
  G('COLLEGE').find('.pnb-fs-chip').filter(function () { return $(this).attr('data-fs-val') === 'Eng'; }).trigger('click');
  return until(function () { return box() !== 'OPENED <= 2024'; }, 5000);
}).then(function () {
  eq('... and stays typed after the strip conditions when a chip is pressed', box(), 'COLLEGE = /^(?:Eng)$/ and OPENED <= 2024');
  // ══════ F. clear ══════
  $('#dashSearchInput').val('AMOUNT >= 100 and AMOUNT <= 1000 and OPENED >= 2024-01-01 and COLLEGE = /^(?:Sci)$/').trigger($.Event('keydown', { key: 'Enter' }));
  return until(function () { return G('AMOUNT').find('.pnb-fs-clear').length === 1; }, 5000);
}).then(function () {
  G('AMOUNT').find('.pnb-fs-clear').trigger('click');
  return until(function () { return box().indexOf('AMOUNT') === -1; }, 5000);
}).then(function () {
  eq("a range's clear takes out its two bounds only", box(), 'OPENED >= 2024-01-01 and COLLEGE = /^(?:Sci)$/');
  tile('c1').find('.pnb-fs-clearall').trigger('click');
  return until(function () { return box() === ''; }, 5000);
}).then(function () {
  eq('Clear all takes out ranges and chips', box(), '');
  // ══════ G. authoring: the editor's range box ══════
  $('#dashEditBtn').trigger('click');
  tile('c1').find('.dash-tt-btn[data-act="edit"]').trigger('click');
  return until(function () { return $('#teCtlFields').length === 1; }, 3000);
}).then(function () {
  eq('the editor re-opens a range as ticked, with exclude and show off', rowRange(), [['AMOUNT', true, true, true], ['OPENED', true, true, true], ['COLLEGE', false, false, false]]);
  $('#teCtlFields .dash-ctl-row').eq(2).find('.teCtlRange').prop('checked', true).trigger('change');
  eq('ticking range turns exclude and show off', rowRange()[2], ['COLLEGE', true, true, true]);
  $('#teApply').trigger('click');
  return until(function () { return $('#dashOverlay').length === 0; }, 3000);
}).then(function () {
  ok('a range on a text column is refused by name, on the tile', tile('c1').find('.dash-tile-err').text().indexOf('COLLEGE holds text, so it cannot be a range') > -1, tile('c1').find('.dash-tile-body').text().substring(0, 160));
  tile('c1').find('.dash-tt-btn[data-act="edit"]').trigger('click');
  return until(function () { return $('#teCtlFields').length === 1; }, 3000);
}).then(function () {
  var $r = $('#teCtlFields .dash-ctl-row').eq(2);
  $r.find('.teCtlRange').prop('checked', false).trigger('change');
  $r.find('.teCtlEx').prop('checked', true);
  $('#teApply').trigger('click');
  return until(function () { return $('#dashOverlay').length === 0 && G('COLLEGE').attr('data-fs-mode') === 'ex'; }, 3000);
}).then(function () {
  $('#dashSaveBtn').trigger('click');
  var c1 = savedTile(lastState(), 'c1');
  eq('saved: the argument list with the ranges and an exclude group', c1 && c1.strip, ['Amount|AMOUNT|range', 'Opened|OPENED|range', 'College|COLLEGE|exclude', 'labels=left']);
  tile('c1').find('.dash-tt-btn[data-act="edit"]').trigger('click');
  return until(function () { return $('#teCtlFields').length === 1; }, 3000);
}).then(function () {
  eq('re-opened: as saved', rowRange(), [['AMOUNT', true, true, true], ['OPENED', true, true, true], ['COLLEGE', false, false, false]]);
  $('.dash-panel-close').trigger('click');
  ok('no exception escaped', ERRORS.length === 0, ERRORS.join(' | '));
  publish();
}).catch(function (e) {
  L.push('HARNESS_ERROR: ' + (e && e.message ? e.message : e) + ' @ ' + String(e && e.stack || '').split('\n')[1]);
  publish();
});
</script></body></html>
