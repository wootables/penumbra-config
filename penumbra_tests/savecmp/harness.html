<!-- savecmp (2026-10-23): the cmpsort / cmpmenu harness (a report preloaded through penumbra_vars.preloadedState and
     run by the boot through the stubbed query.php; what a snapshot comparison renders into; the REAL analysis
     <template>, which run.py copies out of index.php) with a column to group by (DEPT), the grouping dialog's fields
     as the grplist harness has them (the comparison's Clear regroups through them) and its Presets chip slot, and
     the Server Save dialog's fields (the real Save is clicked; the stubbed $.ajax keeps what it posts).
     ?mode=grouped  the report saved grouped (DEPT) and sorted; phase 1: captures made during a comparison
     ?mode=flat     the report saved flat and sorted; phase 1
     ?mode=rqgrouped  (cmprq) the report saved grouped and sorted, as ?mode=grouped: new queries run during comparisons
     ?mode=rqsnapab   (cmprq) the same report booted with &snapab=55,56: its A-vs-B drawn from the two stored snapshots
                      (manage_snapshots.php?action=load answered below) before its own query ever runs
     ?mode=saved    phase 2: #pre= holds the state a Save posted, preloaded as a saved report is
     ?mode=state    phase 2: ?state= is a link's state (no preloaded state)
     ?mode=view     phase 2: ?id=&view= is a link to the view over a plain report (no grouping, no sort)
     &exp=grouped|flat   phase 2: the view the page must come back in -->

<script>
  (function () {
    // phase 1 pages start clean; a phase 2 page keeps nothing from phase 1 either (another browser profile is not
    // needed: the stores below are per page load, and the presets a phase 1 page saved are not read here)
    try { localStorage.clear(); sessionStorage.clear(); } catch (e) {}
  })();
  window.PENUMBRA_THEMES = { 'theme-default': { label: 'Default' } };
  window.PENUMBRA_THEME_IDS = ['theme-default'];
  window.PENUMBRA_THEME_ALIASES = {};
  window.PENUMBRA_LANDING_DEFAULT_THEME = 'theme-default';
  (function () {
    var q = new URLSearchParams(location.search);
    window.__MODE = q.get('mode') || 'grouped';
    window.__EXP = q.get('exp') || '';
  })();
</script>

<script>
  // The live side. ID is the comparison key; DEPT groups the report (East 1+3, West 2+4, North 5+6); NOTE's order
  // (u v w x y z = IDs 6 5 4 1 2 3) is none of the others'.
  window.__COLS = ['ID', 'DEPT', 'NAME', 'AMOUNT', 'QTY', 'NOTE'];
  window.__LIVE = [
    { ID: '1', DEPT: 'East',  NAME: 'Alpha',   AMOUNT: '$100.00', QTY: '1', NOTE: 'x' },
    { ID: '2', DEPT: 'West',  NAME: 'Bravo',   AMOUNT: '$200.00', QTY: '2', NOTE: 'y' },
    { ID: '3', DEPT: 'East',  NAME: 'Charlie', AMOUNT: '$300.00', QTY: '3', NOTE: 'z' },
    { ID: '4', DEPT: 'West',  NAME: 'Delta',   AMOUNT: '$400.00', QTY: '4', NOTE: 'w' },
    { ID: '5', DEPT: 'North', NAME: 'Echo',    AMOUNT: '$500.00', QTY: '5', NOTE: 'v' },
    { ID: '6', DEPT: 'North', NAME: 'Foxtrot', AMOUNT: '$600.00', QTY: '6', NOTE: 'u' }
  ];
  // The snapshot: 1-2 identical (Unchanged), 3 had another AMOUNT and 4 another QTY (Modified), 5-6 absent (New),
  // 7-8 gone since (Removed).
  window.__SNAP = [
    { ID: '1', DEPT: 'East',  NAME: 'Alpha',   AMOUNT: '$100.00', QTY: '1',  NOTE: 'x' },
    { ID: '2', DEPT: 'West',  NAME: 'Bravo',   AMOUNT: '$200.00', QTY: '2',  NOTE: 'y' },
    { ID: '3', DEPT: 'East',  NAME: 'Charlie', AMOUNT: '$150.00', QTY: '3',  NOTE: 'z' },
    { ID: '4', DEPT: 'West',  NAME: 'Delta',   AMOUNT: '$400.00', QTY: '40', NOTE: 'w' },
    { ID: '7', DEPT: 'East',  NAME: 'Golf',    AMOUNT: '$700.00', QTY: '7',  NOTE: 't' },
    { ID: '8', DEPT: 'West',  NAME: 'Hotel',   AMOUNT: '$800.00', QTY: '8',  NOTE: 's' }
  ];
  window.__QUERY = 'SELECT ID, DEPT, NAME, AMOUNT, QTY, NOTE FROM SAVECMP_FIXTURE';
  window.penumbra_vars = {
    isAdmin: true, isGlobalAdmin: true, canEditReport: false, currentUserKey: 'harness', shibboleth: { ouc: '', dept: '', fname: 'Harness' },
    tables: { oracle: [], pins: [], infoed: [], hr: [], fin: [] },
    imports: [], reports: [], themes: {}, prompts: {}, grants: [], reportTags: [],
    totalExemptions: ['AMOUNT', 'QTY']
  };
  // The report's own view (phase 1) and the views a phase 2 page must come back in: the report table sorted by
  // NOTE descending (its column 5); grouped: by DEPT, summed AMOUNT, the groups Z-A, one level open, List, the
  // top 2 groups and the rest as (Other).
  window.__REPORT_SORT = [{ colIdentifier: 'NOTE', colIndex: 5, direction: 'desc' }];
  window.__REPORT_GROUP = { groupBy: 'DEPT', groupAgg: { column: 'AMOUNT', type: 'sum' }, groupSort: { key: 'label', dir: 'desc' },
                            groupStartDepth: 1, groupLayout: 'list', groupLimit: { n: 2, dir: 'top', other: true, minRows: 0 } };
  function __base() {
    return { name: 'savecmp', query: window.__QUERY, reportTitle: 'Save during a comparison',
             theme: 'theme-default', density: 'standard', sortCriteria: [], noLimit: true,
             rowExpandDefault: false, resolverLinksDefault: false, rowsPerPage: '200', reportSnippet: '' };
  }
  (function () {
    var m = window.__MODE, st = null;
    if (m === 'grouped' || m === 'flat' || m === 'rqgrouped' || m === 'rqsnapab') {
      st = __base();
      st.sortCriteria = JSON.parse(JSON.stringify(window.__REPORT_SORT));
      if (m === 'grouped' || m === 'rqgrouped' || m === 'rqsnapab') { var g = JSON.parse(JSON.stringify(window.__REPORT_GROUP)); Object.keys(g).forEach(function (k) { st[k] = g[k]; }); }
    } else if (m === 'saved') {
      var h = String(location.hash || '');
      try { st = JSON.parse(decodeURIComponent(h.replace(/^#pre=/, ''))); } catch (e) { window.__PRE_ERR = String(e); }
    } else if (m === 'view') {
      st = __base();
    }
    if (st) window.penumbra_vars.preloadedState = st;
  })();
  // query.php answers with the live rows; save_server_state.php's posts are kept; nothing else is expected.
  window.__queryDone = 0;
  window.__ajaxLog = [];
  window.__posts = [];
  jQuery.ajax = function (a, b) {
    var opts = (typeof a === 'string') ? jQuery.extend({ url: a }, b || {}) : (a || {});
    var url = String(opts.url || '');
    window.__ajaxLog.push(url);
    if (/save_server_state\.php/.test(url)) window.__posts.push({ url: url, data: opts.data });
    var d = jQuery.Deferred();
    var isQuery = /query\.php/.test(url);
    var resp = isQuery ? { data: JSON.parse(JSON.stringify(window.__LIVE)) } : {};
    if (/save_server_state\.php/.test(url)) {
      // as the endpoint answers an overwrite of the report this page holds
      var sid = 'savecmp'; try { sid = JSON.parse(opts.data).short_id || sid; } catch (e) {}
      resp = { success: true, new_id: sid, is_new: false, numeric_id: 1 };
    }
    // (cmprq) a stored snapshot, as the ?snapab= boot loads one: #55 holds the snapshot rows, any other the live rows
    if (/manage_snapshots\.php/.test(url) && /[?&]action=load(&|$)/.test(url)) {
      var snapId = (/[?&]snap_id=(\d+)/.exec(url) || [])[1] || '';
      var srows = snapId === '55' ? window.__SNAP : window.__LIVE;
      resp = { status: 'success', data: { SNAP_DATA: JSON.stringify(srows.map(function (r) { return { rowData: r }; })), SNAP_NAME: 'Stored snapshot ' + snapId,
               CREATED_AT: '2026-10-20T09:00:00', COLUMN_NAMES: window.__COLS.join(','), ROW_COUNT: srows.length, COLUMN_COUNT: window.__COLS.length } };
    }
    setTimeout(function () {
      try { if (opts.success) opts.success(resp, 'success', { status: 200 }); } catch (e) { window.__errors.push('ajax success threw: ' + String(e)); }
      try { if (opts.complete) opts.complete({ status: 200 }, 'success'); } catch (e) { window.__errors.push('ajax complete threw: ' + String(e)); }
      d.resolve(resp, 'success', { status: 200 });
      if (isQuery) window.__queryDone++;
    }, 0);
    var p = d.promise(); p.abort = function () {}; return p;
  };
  jQuery.getJSON = function (u, x, cb) { return jQuery.ajax({ url: u, success: (typeof x === 'function') ? x : cb }); };
  jQuery.post = function (u, x, cb) { return jQuery.ajax({ url: u, success: (typeof x === 'function') ? x : cb }); };
  jQuery.get = jQuery.post;
  jQuery.fx.off = true;
  window.ResizeObserver = function () { this.observe = function () {}; this.unobserve = function () {}; this.disconnect = function () {}; };
  window.IntersectionObserver = function () { this.observe = function () {}; this.unobserve = function () {}; this.disconnect = function () {}; };
  if (!window.matchMedia) {
    window.matchMedia = function () { return { matches: false, addListener: function () {}, removeListener: function () {}, addEventListener: function () {}, removeEventListener: function () {} }; };
  }
  // the clipboard the view link's Copy would write to (never asked here, kept for safety)
  window._pnbClipboard = function () { return { writeText: function () { return Promise.resolve(); } }; };
  window.__errors = [];
  window.__rejections = [];
  window.onerror = function (m, src, line) { window.__errors.push(String(m) + ' @' + String(src).split('/').pop() + ':' + line); return true; };
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    window.__rejections.push(String((r && r.message) || r) + ' @' + String((r && r.stack) || '').split('\n').slice(1, 2).join('').trim());
    e.preventDefault();
  });
  window.confirm = function () { return true; };
  window.alert = function () {};
  window.prompt = function () { return null; };
</script>
