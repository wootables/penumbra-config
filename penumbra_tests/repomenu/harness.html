<button type="button" id="spClearStorage" style="display:none">Clear</button>
<script>
// index.php declares this as a top-level const (global lexical scope): the module reads it by bare name
const penumbra_vars = { isAdmin: false, isGlobalAdmin: false, repoMode: false, currentUserKey: 'tester', shibboleth: { ouc: '' } };
window.__ERR = [];
window.addEventListener('error', function (e) { window.__ERR.push(String(e.message) + ' @' + (e.filename || '').split('/').pop() + ':' + e.lineno + ':' + e.colno); });
window.addEventListener('unhandledrejection', function (e) { window.__ERR.push('rejection: ' + String(e.reason)); });
</script>
