<!-- admesc suite (2026-10-02): the admin console's show/hide (toggleSmartAdminView)
     on pages that never rendered the console. index.php renders #admWrapper only
     for an editor of the loaded report ($canEditLoadedReport); a viewer, an editor
     previewing with &noadm, and a non-admin on the home screen get the hidden stub
     below instead (index.php's `<?php else: ?>` branch, verbatim). Escape (section D
     of the capture handler), a file import and the snapshot views still call
     toggleSmartAdminView for everyone - client error 2026-10-02 12:00:50, jjornl
     &noadm, Escape in a journal row note: "Cannot read properties of undefined
     (reading 'getBoundingClientRect')".
     ?page=viewer  report page, no console (penumbra_vars.isAdmin false, noadm)
     ?page=home    home screen, non-admin: the landing cards, no report, no console
     ?page=editor  report page WITH the console (the path that must keep working)
     The REAL main.js boots through the real run path (stubbed query.php +
     manage_journal.php) on jrowfeat's 36-row journal fixture. -->

<script>
  window.PENUMBRA_THEMES = { 'theme-default': { label: 'Default' } };
  window.PENUMBRA_THEME_IDS = ['theme-default'];
  window.PENUMBRA_THEME_ALIASES = {};
  window.PENUMBRA_LANDING_DEFAULT_THEME = 'theme-default';
  (function () {
    var P = new URLSearchParams(location.search);
    var PAGE = window.__PAGE = P.get('page') || 'viewer';
    window.__SCN = P.get('scn') || 'rownote';
    // The browser already holds the ADMIN's real console preference (closed), as it
    // did on jjornl: the bplimon tab previewing with &noadm is an admin's browser.
    // A page with no console must leave it alone; ?pref= seeds another value.
    try { localStorage.clear(); localStorage.setItem('penumbra_admin_open', P.get('pref') || 'false'); } catch (e) {}

    var hdr = document.getElementById('reportHeaderContainer');
    if (PAGE === 'editor') {
      // index.php: <body class="admin-view">, #admWrapper right after the report
      // header, the console eye in the floating rail.
      document.body.classList.add('admin-view');
      hdr.insertAdjacentHTML('afterend',
        '<div id="admWrapper" class="admin-view"><div id="admin-flex-container" style="display: flex; align-items: stretch; height: auto;">' +
        '<div id="tableSelectorContent"></div>' +
        '<div id="editorTabs" style="flex-grow: 1;"><textarea id="sqlQuery"></textarea><textarea id="reportSnippet"></textarea>' +
        '<textarea id="reportTitle"></textarea><textarea id="reportSubtitle"></textarea><button id="executeQuery">Run</button>' +
        '<div style="height:240px">console body</div></div></div></div>');
      document.getElementById('floatingBtnDragHandle').insertAdjacentHTML('afterend',
        '<button id="toggleAdminViewBtn" title="(ESC) Currently showing admin controls. Click to hide.">' +
        '<svg id="toggle-icon-hide" width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"></circle></svg>' +
        '<svg id="toggle-icon-show" width="24" height="24" viewBox="0 0 24 24" style="display: none;"><line x1="1" y1="1" x2="23" y2="23"></line></svg></button>');
    } else {
      // index.php's `<?php else: ?>` branch for a page without the console, verbatim.
      hdr.insertAdjacentHTML('afterend',
        '<div style="display:none;">' +
        '<textarea id="sqlQuery"></textarea><textarea id="reportSnippet"></textarea><textarea id="reportTitle"></textarea>' +
        '<textarea id="reportSubtitle"></textarea><button id="executeQuery"></button><div id="editorTabs"></div>' +
        '<button id="toggleLimitBtn" class="toolbar-icon is-active"></button></div>');
    }
    if (PAGE === 'home') {
      // The home screen's landing cards (index.php renders them with no ?id / ?state).
      document.getElementById('errorBox').insertAdjacentHTML('beforebegin',
        '<div class="landing-container pnl-landing"><div class="pnl-head"><h2 id="pnlWelcome">Welcome back</h2></div>' +
        '<div class="pnl-cards" style="height:300px">Jump back in</div></div>');
    }

    var SEP = '␟';
    window.__SEP = SEP;
    // --- jrowfeat's fixture: 36 IRB-protocol-like rows, key PROTOCOL NO. + PROTOCOL TYPE ---
    var COLS = ['PROTOCOL NO.', 'PROTOCOL TYPE', 'TITLE', 'APPROVAL DATE', 'STATUS', 'AMOUNT'];
    var W = ['Alpha', 'Bravo', 'Charlie', 'Delta', 'Echo', 'Foxtrot', 'Golf', 'Hotel', 'India'];
    var rows = [];
    for (var i = 1; i <= 36; i++) {
      var r = {};
      r['PROTOCOL NO.'] = String(25400 + (i % 18));
      r['PROTOCOL TYPE'] = i <= 18 ? 'Exempt' : (i <= 30 ? 'Expedited' : 'Amendment/Renewal');
      r['TITLE'] = W[i % W.length] + ' study ' + i;
      r['APPROVAL DATE'] = (1 + (i % 12)) + '/' + (1 + (i % 27)) + '/2026';
      r['STATUS'] = (i % 4 === 0) ? 'Closed' : 'Approved';
      r['AMOUNT'] = '$' + (1000 + i * 37) + '.00';
      rows.push(r);
    }
    window.__rowsFixture = rows;
    window.__keyOf = function (r) { return r['PROTOCOL NO.'] + SEP + r['PROTOCOL TYPE']; };
    var K3 = window.__keyOf(rows[2]);
    window.__J = { toggles: { toggle1: {} }, counts: {}, notes: {}, posts: [] };
    window.__J.toggles.toggle1[K3] = { by: 'pat', at: '2026-10-01 09:00:00' };
    window.__J.counts[K3] = 1;
    window.__J.notes[K3] = [{ ID: 901, REPORT_ID: 7, SCOPE: 'row', ROW_KEY: K3, NOTE_TEXT: 'First look done.', CREATED_BY: 'pat', CREATED_AT: '2026-10-01 09:05:00', PARENT_ID: null }];
    window.__NOTED = K3;
    var order = []; for (var c = 0; c < COLS.length; c++) order.push(c);
    var st = {
      name: 'jjornl', query: 'SELECT * FROM JR_FIXTURE', reportTitle: 'Console-less page fixture',
      theme: 'theme-default', density: 'standard',
      visibleColumns: ['#', 0, 1, 2, 3, 4], columnOrder: order,
      sortCriteria: [], noLimit: true, rowExpandDefault: false, resolverLinksDefault: true,
      rowsPerPage: '200', reportSnippet: '',
      viewOptions: { journalEnabled: true, journalKeyColumns: ['PROTOCOL NO.', 'PROTOCOL TYPE'],
                     journalToggles: [{ key: 'toggle1', label: 'Reviewed' }], journalRowNotes: true }
    };
    var editor = PAGE === 'editor';
    window.penumbra_vars = {
      isAdmin: editor, isGlobalAdmin: editor, canEditReport: editor, noadm: PAGE === 'viewer',
      currentUserKey: 'harness', shibboleth: { ouc: '', dept: '' },
      tables: { oracle: [], pins: [], infoed: [], hr: [], fin: [] },
      imports: [], reports: [], themes: {}, prompts: {}, grants: [],
      totalExemptions: [],
      journal: { installed: true, enabled: true, total: 0, unseen: 0 },
      journalAccess: true,
      preloadedState: PAGE === 'home' ? null : st
    };
    window.__queryResponse = { data: rows };
  })();
  window.__queryDone = 0;
  window.__ajaxLog = [];
</script>

<script>
  // Fake server. query.php -> the fixture; manage_journal.php -> window.__J; anything else -> {}.
  function __jrJournal(url, opts) {
    var m = /[?&]action=([a-z_]+)/.exec(url);
    var action = m ? m[1] : null, body = null;
    if (!action && opts.data) { try { body = JSON.parse(opts.data); action = body.action; } catch (e) { } }
    var J = window.__J;
    if (action === 'toggles') return { status: 'success', installed: true, toggles: JSON.parse(JSON.stringify(J.toggles)) };
    if (action === 'row_notes') return { status: 'success', counts: JSON.parse(JSON.stringify(J.counts)), notes: JSON.parse(JSON.stringify(J.notes)) };
    if (action === 'summary') return { status: 'success', installed: true, total: 0, unseen: 0 };
    if (action === 'toggle_history') return { status: 'success', events: [] };
    if (action === 'access_list') return { status: 'success', users: [] };
    if (body) J.posts.push(body);
    return { status: 'success' };
  }
  jQuery.ajax = function (a, b) {
    var opts = (typeof a === 'string') ? jQuery.extend({ url: a }, b || {}) : (a || {});
    var url = String(opts.url || '');
    window.__ajaxLog.push(url);
    var d = jQuery.Deferred();
    var isQuery = /query\.php/.test(url);
    var isJournal = /manage_journal\.php/.test(url);
    var isPeople = /get_email_recipients\.php/.test(url);
    var resp = isQuery ? window.__queryResponse : (isJournal ? __jrJournal(url, opts) : (isPeople ? [{ username: 'pat', name: 'Pat Doe' }] : {}));
    setTimeout(function () {
      try { if (opts.success) opts.success(resp, 'success', { status: 200 }); } catch (e) { window.__errors.push('ajax success threw: ' + String(e)); }
      try { if (opts.complete) opts.complete({ status: 200 }, 'success'); } catch (e) { window.__errors.push('ajax complete threw: ' + String(e)); }
      d.resolve(resp, 'success', { status: 200 });
      if (isQuery) window.__queryDone++;
    }, isJournal ? 30 : 0);
    var p = d.promise(); p.abort = function () {}; return p;
  };
  jQuery.getJSON = function (u, x, cb) { return jQuery.ajax({ url: u, success: (typeof x === 'function') ? x : cb }); };
  jQuery.post = function (u, x, cb) { return jQuery.ajax({ url: u, success: (typeof x === 'function') ? x : cb }); };
  jQuery.get = jQuery.post;
  jQuery.fx.off = true;
  window.__errors = [];
  window.__rejections = [];
  // Every uncaught error, with the line it came from - the incident's was a TypeError
  // thrown inside the capture-phase keydown listener (reported, not propagated).
  window.addEventListener('error', function (e) {
    if (!e || !e.message) return;
    window.__errors.push(String(e.message) + ' @' + String(e.filename || '').split('/').pop() + ':' + e.lineno + ':' + e.colno);
  });
  window.onerror = function () { return true; };
  // Errors main.js CATCHES and only logs (the import's "Parse error:" catch swallowed this bug).
  window.__consoleErrors = [];
  (function () {
    var ce = console.error;
    console.error = function () {
      try { window.__consoleErrors.push(Array.prototype.map.call(arguments, function (a) { return (a && a.message) ? String(a.message) : String(a); }).join(' ')); } catch (e) { }
      return ce.apply(console, arguments);
    };
  })();
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    window.__rejections.push(String((r && r.message) || r));
    e.preventDefault();
  });
  window.__confirms = [];
  window.confirm = function (m) { window.__confirms.push(String(m)); return true; };
  window.alert = function (m) { window.__errors.push('alert: ' + m); };
  window.prompt = function () { return null; };
  if (typeof window.stackHeaders !== 'function') window.stackHeaders = function () {};
</script>
