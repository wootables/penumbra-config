    tables: { oracle: [], pins: [], infoed: [], hr: [], fin: [] },

  window.confirm = function (m) { (window.__dialogs = window.__dialogs || []).push('confirm: ' + m); return true; };
  window.prompt = function (m) { (window.__dialogs = window.__dialogs || []).push('prompt: ' + m); return null; };

<script src="main_patched.js"></script>
<script>
(function () {
  var ONLY = '__ONLY__';
  function report(txt) { document.getElementById('out').textContent = txt; }
  var results = [];
  function assert(name, cond, detail) { results.push({ name: name, pass: !!cond, detail: detail === undefined ? '' : String(detail) }); }
  function eq(name, got, want) { var g = JSON.stringify(got), w = JSON.stringify(want); assert(name, g === w, 'got ' + g + ' | want ' + w); }
  function section(tag, fn) {
    if (ONLY && ONLY !== tag) return;
    try { return fn(); } catch (e) { assert(tag + ' section ran to the end', false, String(e) + ' ' + String(e.stack || '').split('\n').slice(1, 4).join(' | ')); }
  }
  async function asection(tag, fn) {
    try { return await fn(); } catch (e) { assert(tag + ' section ran to the end', false, String(e) + ' ' + String(e.stack || '').split('\n').slice(1, 4).join(' | ')); }
  }
  function M(o) { var m = new Map(); Object.keys(o).forEach(function (k) { m.set(k, o[k]); }); return m; }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  // ---- the fixture: 160 deterministic rows ------------------------------------------
  var seed = 20261013;
  function rnd() { seed = (seed * 1103515245 + 12345) % 2147483648; return seed / 2147483648; }
  function pick(a) { return a[Math.floor(rnd() * a.length)]; }
  var DEPTS = ['Engineering', 'Engineering', 'Engineering', 'Sciences', 'Sciences', 'Agriculture', 'Agriculture', 'Design',
               'Education', 'Humanities', 'Management', 'Textiles', 'Vet Med', 'Other', ''];
  var STATUS = ['Awarded', 'Awarded', 'Pending', 'Declined'];
  var STATES = ['NC', 'NC', 'NC', 'VA', 'SC', 'GA', 'North Carolina', 'TX', 'CA', 'Georgia (State)'];
  function money(v) { var s = '$' + Math.abs(v).toLocaleString('en-US'); return v < 0 ? '-' + s : s; }
  function ymd(d) { return d.toISOString().slice(0, 10); }
  var FIX = [];
  for (var k = 0; k < 160; k++) {
    var amtRoll = rnd(), amt;
    if (amtRoll < 0.06) amt = '';
    else if (amtRoll < 0.1) amt = '$0';
    else if (amtRoll < 0.18) amt = money(-Math.round(rnd() * 20000));
    else amt = money(Math.round(rnd() * 250000));
    var start = new Date(Date.UTC(2023, 0, 1) + Math.floor(rnd() * 1300) * 86400000);
    var end = new Date(start.getTime() + Math.floor(30 + rnd() * 700) * 86400000);
    var fyNum = start.getUTCMonth() >= 6 ? start.getUTCFullYear() + 1 : start.getUTCFullYear();
    FIX.push(M({ '#': String(k + 1), DEPT: pick(DEPTS), STATUS: pick(STATUS), FY: 'FY ' + fyNum, AMOUNT: amt,
      AWARD_ID: 'P-' + (1 + Math.floor(rnd() * 40)), STATE: pick(STATES), N: String(1 + Math.floor(rnd() * 100)),
      START_DATE: ymd(start), END_DATE: ymd(end) }));
  }
  // The table the builder lists its columns from.
  (function () {
    var cols = ['#', 'DEPT', 'STATUS', 'FY', 'AMOUNT', 'AWARD_ID', 'STATE', 'N', 'START_DATE', 'END_DATE'];
    var html = FIX.map(function (m) { return '<tr>' + cols.map(function (c) { return '<td data-column="' + c + '">' + (m.get(c) || '') + '</td>'; }).join('') + '</tr>'; }).join('');
    document.querySelector('#resultsTable tbody').innerHTML = html;
  })();

  // ---- the app's own reading of a cell, for the expected aggregates --------------------
  function cleanTxt(v) {
    var s = String(v == null ? '' : v);
    if (s.indexOf('@@HTML') === 0 || s.indexOf('@@JSON') === 0) s = s.slice(6);
    s = s.replace(/<[^>]*>/g, '').trim();
    return s;
  }
  function aggOf(rows, agg, yCol) {
    var F = window.__CI;
    var Y = String(yCol || '').toUpperCase();
    if (agg === 'count') return rows.length;
    if (agg === 'distinct') {
      var seen = Object.create(null), n = 0;
      rows.forEach(function (r) { var t = cleanTxt(r.get(Y)); if (t && !seen[t]) { seen[t] = 1; n++; } });
      return n;
    }
    var nums = [];
    rows.forEach(function (r) { var v = F.parseNum(r.get(Y)); if (typeof v === 'number' && isFinite(v)) nums.push(v); });
    if (agg === 'sum') return nums.reduce(function (s, v) { return s + v; }, 0);
    if (!nums.length) return 0;
    if (agg === 'avg') return nums.reduce(function (s, v) { return s + v; }, 0) / nums.length;
    if (agg === 'min') return Math.min.apply(null, nums);
    if (agg === 'max') return Math.max.apply(null, nums);
    if (agg === 'median') { var s = nums.slice().sort(function (a, b) { return a - b; }), h = Math.floor(s.length / 2); return s.length % 2 ? s[h] : (s[h - 1] + s[h]) / 2; }
    return NaN;
  }
  function elemValue(type, raw) {
    if (raw == null) return null;
    if (typeof raw === 'number') return raw;
    if (Array.isArray(raw)) return (raw.length === 2 && typeof raw[0] === 'number') ? raw[1] - raw[0] : null;
    if (typeof raw === 'object') {
      if (raw._l && typeof raw._l.flow === 'number') return raw._l.flow;
      if (typeof raw.v === 'number') return raw.v;
      if (typeof raw._value === 'number') return raw._value;
      if (typeof raw.value === 'number') return raw.value;
      if (typeof raw.y === 'number') return raw.y;
    }
    return null;
  }

  var CANVAS = 'ci_c';
  function buildAndRender(cfg, rows) {
    var F = window.__CI;
    var data = F.chartData(rows, cfg.xAxis, cfg.yAxis || 'none', cfg.groupBy || 'none', cfg.agg, cfg.limit, cfg.type,
      cfg.sortBy || 'value', cfg.sortDir || 'desc', 'default', !!cfg.normalize, !!cfg.otherBucket, cfg.comboSeries || null,
      cfg.funnelMode || '', cfg);
    if (data && (data._noData || data._groupByError)) return { data: data, chart: null };
    var _pre = JSON.stringify(((data.datasets || [])[0] || {}).data || []).slice(0, 200);
    var old = Chart.getChart(CANVAS); if (old) old.destroy();
    F.renderSnip(CANVAS, cfg.type, data, 'T', true, true, 'top', 'end', false, !!cfg.stacked, !!cfg.horizontal, 'top', false,
      !!cfg.normalize, '', '', '', false, '', '', cfg.comboSeries || null, false, '');
    $('#' + CANVAS).data('vizConfig', cfg).data('sourceRowData', rows);
    return { data: data, chart: Chart.getChart(CANVAS), pre: _pre };
  }

  // ---- C: clicks add up -------------------------------------------------------------------
  // One config per line: name, then the vizConfig fields the renderer and the drill read.
  var C_CONFIGS = [
    ['bar sum',                 { type: 'bar', xAxis: 'DEPT', yAxis: 'AMOUNT', agg: 'sum', limit: 9999 }],
    ['bar sum top 5 + Other',   { type: 'bar', xAxis: 'DEPT', yAxis: 'AMOUNT', agg: 'sum', limit: 5, otherBucket: true }],
    ['bar count top 4 + Other', { type: 'bar', xAxis: 'DEPT', yAxis: 'none', agg: 'count', limit: 4, otherBucket: true }],
    ['bar avg',                 { type: 'bar', xAxis: 'DEPT', yAxis: 'AMOUNT', agg: 'avg', limit: 9999 }],
    ['bar min',                 { type: 'bar', xAxis: 'DEPT', yAxis: 'AMOUNT', agg: 'min', limit: 9999 }],
    ['bar max',                 { type: 'bar', xAxis: 'DEPT', yAxis: 'AMOUNT', agg: 'max', limit: 9999 }],
    ['bar median',              { type: 'bar', xAxis: 'DEPT', yAxis: 'AMOUNT', agg: 'median', limit: 9999 }],
    ['bar distinct ids',        { type: 'bar', xAxis: 'DEPT', yAxis: 'AWARD_ID', agg: 'distinct', limit: 9999 }],
    ['bar grouped sum',         { type: 'bar', xAxis: 'DEPT', yAxis: 'AMOUNT', groupBy: 'STATUS', agg: 'sum', limit: 9999 }],
    ['bar grouped stacked',     { type: 'bar', xAxis: 'DEPT', yAxis: 'AMOUNT', groupBy: 'STATUS', agg: 'sum', limit: 6, stacked: true, otherBucket: true }],
    ['bar horizontal count',    { type: 'bar', xAxis: 'STATE', yAxis: 'none', agg: 'count', limit: 9999, horizontal: true }],
    ['bar by fiscal year (START_DATE:fy)', { type: 'bar', xAxis: 'START_DATE:fy', yAxis: 'AMOUNT', agg: 'sum', limit: 9999, sortBy: 'label', sortDir: 'asc' }],
    ['bar by N:bin',            { type: 'bar', xAxis: 'N:bin', yAxis: 'none', agg: 'count', limit: 9999, sortBy: 'label', sortDir: 'asc' }],
    ['bar grouped by FY',       { type: 'bar', xAxis: 'STATUS', yAxis: 'AMOUNT', groupBy: 'FY', agg: 'sum', limit: 9999 }],
    ['line sum by FY',          { type: 'line', xAxis: 'FY', yAxis: 'AMOUNT', agg: 'sum', limit: 9999, sortBy: 'label', sortDir: 'asc' }],
    ['line grouped count',      { type: 'line', xAxis: 'FY', yAxis: 'none', groupBy: 'STATUS', agg: 'count', limit: 9999, sortBy: 'label', sortDir: 'asc' }],
    ['pie sum top 5 + Other',   { type: 'pie', xAxis: 'DEPT', yAxis: 'AMOUNT', agg: 'sum', limit: 5, otherBucket: true }],
    ['pie count',               { type: 'pie', xAxis: 'STATUS', yAxis: 'none', agg: 'count', limit: 9999 }],
    ['doughnut count + Other',  { type: 'doughnut', xAxis: 'STATE', yAxis: 'none', agg: 'count', limit: 4, otherBucket: true }],
    ['doughnut grouped (sunburst) sum', { type: 'doughnut', xAxis: 'DEPT', yAxis: 'AMOUNT', groupBy: 'STATUS', agg: 'sum', limit: 4 }],
    ['doughnut grouped (sunburst) count', { type: 'doughnut', xAxis: 'STATUS', yAxis: 'none', groupBy: 'DEPT', agg: 'count', limit: 9999 }],
    ['radar count',             { type: 'radar', xAxis: 'DEPT', yAxis: 'none', agg: 'count', limit: 9999 }],
    ['treemap sum',             { type: 'treemap', xAxis: 'DEPT', yAxis: 'AMOUNT', agg: 'sum', limit: 9999 }],
    ['treemap grouped count',   { type: 'treemap', xAxis: 'DEPT', yAxis: 'none', groupBy: 'STATUS', agg: 'count', limit: 9999 }],
    ['treemap top 4 + Other',   { type: 'treemap', xAxis: 'DEPT', yAxis: 'none', agg: 'count', limit: 4, otherBucket: true }],
    ['histogram of N',          { type: 'histogram', xAxis: 'N', yAxis: 'none', agg: 'count', limit: 10 }],
    // compact bin labels (25K - 50K) the drill used to parse back - and could not
    ['histogram of AMOUNT',     { type: 'histogram', xAxis: 'AMOUNT', yAxis: 'none', agg: 'count', limit: 8 }],
    // a REAL "Other" tile kept beside the bucket: the plugin merged same-named leaves
    ['treemap top 8 + Other keeps a real Other', { type: 'treemap', xAxis: 'DEPT', yAxis: 'none', agg: 'count', limit: 8, otherBucket: true }],
    ['pie top 6 + Other keeps a real Other', { type: 'pie', xAxis: 'DEPT', yAxis: 'AMOUNT', agg: 'sum', limit: 6, otherBucket: true }],
    // a Y column with no numbers at all: 0 everywhere, never NaN
    ['bar sum of a text column', { type: 'bar', xAxis: 'DEPT', yAxis: 'STATUS', agg: 'sum', limit: 9999 }],
    ['bar avg of a text column', { type: 'bar', xAxis: 'DEPT', yAxis: 'STATUS', agg: 'avg', limit: 9999 }],
    ['waterfall sum by FY',     { type: 'waterfall', xAxis: 'FY', yAxis: 'AMOUNT', agg: 'sum', limit: 9999, sortBy: 'label', sortDir: 'asc' }],
    ['funnel count',            { type: 'funnel', xAxis: 'STATUS', yAxis: 'none', agg: 'count', limit: 9999 }],
    ['bullet sum',              { type: 'bullet', xAxis: 'DEPT', yAxis: 'AMOUNT', agg: 'sum', limit: 5, referenceLine: '100000' }],
    ['map sum',                 { type: 'map', xAxis: 'STATE', yAxis: 'AMOUNT', agg: 'sum', limit: 9999, vizOptions: '{"map":"us-grid"}' }],
    ['map count',               { type: 'map', xAxis: 'STATE', yAxis: 'none', agg: 'count', limit: 9999, vizOptions: '{"map":"us-grid"}' }],
    ['sankey sum 3 stages',     { type: 'sankey', xAxis: 'DEPT', yAxis: 'AMOUNT', groupBy: 'STATUS', agg: 'sum', limit: 4, vizOptions: '{"stages":["FY"]}' }],
    ['sankey count',            { type: 'sankey', xAxis: 'STATUS', yAxis: 'none', groupBy: 'STATE', agg: 'count', limit: 3 }],
    ['sankey bucketed stage',   { type: 'sankey', xAxis: 'DEPT', yAxis: 'none', groupBy: 'START_DATE:fy', agg: 'count', limit: 3 }]
  ];

  function runC() {
    var F = window.__CI;
    C_CONFIGS.forEach(function (pair) {
      var name = pair[0], cfg = pair[1];
      section('C', function () {
        var rows = FIX;
        var br = buildAndRender(cfg, rows);
        if (!br.chart) { assert('C ' + name + ': renders', false, JSON.stringify(br.data && (br.data._noData || br.data._groupByError))); return; }
        var chart = br.chart;
        var probeRows = F.probe(rows, [cfg.xAxis, cfg.groupBy]);
        var checked = 0, noCrit = 0, noVal = 0, bad = [];
        chart.data.datasets.forEach(function (ds, d) {
          if (ds._isTrendLine) return;
          var meta = chart.getDatasetMeta(d);
          (meta.data || []).forEach(function (el, i) {
            var raw = ds.data[i];
            var v = elemValue(cfg.type, raw);
            // A map tile's value is kept beside the point (data._mapTiles, same
            // order); an absent state is null = no rows.
            if (cfg.type === 'map') { var tile = (br.data._mapTiles || [])[i]; v = tile ? (tile.value == null ? 0 : tile.value) : null; }
            var crit = F.criteria(chart, { datasetIndex: d, index: i }, cfg);
            if (!crit) { noCrit++; return; }
            if (v === null || !isFinite(v)) { noVal++; return; }
            var match = rows.filter(function (r, ri) { return crit.rowFilter(probeRows[ri]); });
            var want = aggOf(match, cfg.agg, cfg.yAxis);
            checked++;
            if (!(Math.abs(v - want) <= 0.005 + 1e-9 * Math.abs(want))) {
              var lbl = (chart.data.labels || [])[i];
              bad.push('[' + d + ',' + i + '] ' + (lbl != null ? lbl : '') + ' ' + (crit.titleParts || []).join(' & ') + ' drew ' + v + ' rows say ' + want + ' (' + match.length + ' rows)');
            }
          });
        });
        assert('C ' + name + ': every clicked element lists rows that add up to it (' + checked + ' checked, ' + noCrit + ' unclickable, ' + noVal + ' no value)',
          checked > 0 && bad.length === 0, bad.slice(0, 4).join(' || ') + (bad.length > 4 ? ' || +' + (bad.length - 4) + ' more' : '') +
          (bad.length ? ' || BUILT labels=' + JSON.stringify(br.data.labels || []) + ' PRE=' + br.pre + ' data0=' + JSON.stringify(((br.data.datasets || [])[0] || {}).data || []).slice(0, 300) +
            ' CHART labels=' + JSON.stringify(chart.data.labels || []) : ''));
      });
    });
  }

  // ---- the builder, opened the way the Chart button opens it (minus AJAX) ----------------
  function openBuilder() {
    var F = window.__CI;
    window.vizCachedData = FIX;
    F.resetViz();
    F.populateCols();
    $('.viz-type-option').removeClass('active');
    $('.viz-type-option[data-type="bar"]').addClass('active');
  }
  function setv(sel, v) { var $e = $(sel); if (!$e.length) throw new Error('no element ' + sel); $e.val(v).trigger('change'); if ($e.is('select') && $e.val() !== v) throw new Error(sel + ' has no option ' + v); }
  function check(sel, on) { $(sel).prop('checked', !!on).trigger('change'); }
  function clickType(t) { var $o = $('.viz-type-option[data-type="' + t + '"]'); if (!$o.length) throw new Error('no type tile ' + t); $o.trigger('click'); }

  // Per type: the axes plus that type's own settings, set through its own controls.
  var R_SETUPS = {
    bar: function () { setv('#vizXAxis', 'DEPT'); clickType('bar'); setv('#vizYAxis', 'AMOUNT'); setv('#vizAggregation', 'sum'); setv('#vizGroupBy', 'STATUS'); check('#vizStacked', true); check('#vizHorizontal', true); setv('#vizLimit', '6'); check('#vizOtherBucket', true); },
    line: function () { setv('#vizXAxis', 'FY'); clickType('line'); setv('#vizYAxis', 'AMOUNT'); setv('#vizAggregation', 'avg'); setv('#vizGroupBy', 'STATUS'); check('#vizFill', true); setv('#vizTrendLine', 'regression'); setv('#vizReferenceLine', '100000|Goal'); setv('#vizSortBy', 'label'); setv('#vizSortDir', 'asc'); },
    pie: function () { setv('#vizXAxis', 'DEPT'); clickType('pie'); setv('#vizAggregation', 'count'); setv('#vizLimit', '5'); check('#vizOtherBucket', true); setv('#vizLegend', 'bottom'); },
    doughnut: function () { setv('#vizXAxis', 'DEPT'); clickType('doughnut'); setv('#vizYAxis', 'AMOUNT'); setv('#vizAggregation', 'sum'); setv('#vizGroupBy', 'STATUS'); setv('#vizLimit', '4'); },
    scatter: function () { setv('#vizXAxis', 'N'); clickType('scatter'); setv('#vizYAxis', 'AMOUNT'); setv('#vizBubbleSize', 'N'); },
    radar: function () { setv('#vizXAxis', 'DEPT'); clickType('radar'); setv('#vizAggregation', 'count'); },
    combo: function () { setv('#vizXAxis', 'FY'); setv('#vizYAxis', 'AMOUNT'); clickType('combo'); check('#vizDualAxis', true); },
    butterfly: function () { setv('#vizXAxis', 'DEPT'); setv('#vizYAxis', 'AMOUNT'); clickType('butterfly'); },
    treemap: function () { setv('#vizXAxis', 'DEPT'); clickType('treemap'); setv('#vizYAxis', 'AMOUNT'); setv('#vizAggregation', 'sum'); setv('#vizGroupBy', 'STATUS'); },
    histogram: function () { setv('#vizXAxis', 'N'); clickType('histogram'); setv('#vizLimit', '8'); },
    waterfall: function () { setv('#vizXAxis', 'FY'); clickType('waterfall'); setv('#vizYAxis', 'AMOUNT'); setv('#vizAggregation', 'sum'); },
    funnel: function () { setv('#vizXAxis', 'STATUS'); clickType('funnel'); setv('#vizAggregation', 'count'); },
    gauge: function () { clickType('gauge'); setv('#vizYAxis', 'AMOUNT'); setv('#vizAggregation', 'sum'); setv('#vizReferenceLine', '5000000|Goal'); $('#vizGaugeBands').val('2000000|4000000').trigger('input').trigger('change'); },
    bullet: function () { setv('#vizXAxis', 'DEPT'); clickType('bullet'); setv('#vizYAxis', 'AMOUNT'); setv('#vizAggregation', 'sum'); setv('#vizReferenceLine', '1000000'); },
    box: function () { setv('#vizXAxis', 'DEPT'); clickType('box'); setv('#vizYAxis', 'AMOUNT'); setv('#vizBoxWhiskers', 'minmax'); },
    gantt: function () { setv('#vizXAxis', 'AWARD_ID'); clickType('gantt'); setv('#vizYAxis', 'START_DATE'); setv('#vizGanttEnd', 'END_DATE'); setv('#vizReferenceLine', 'today'); setv('#vizSortBy', 'duration'); },
    map: function () { setv('#vizXAxis', 'STATE'); clickType('map'); setv('#vizYAxis', 'AMOUNT'); setv('#vizAggregation', 'sum'); setv('#vizMapBins', 'equal'); check('#vizMapLabels', false); },
    sankey: function () { setv('#vizXAxis', 'DEPT'); clickType('sankey'); setv('#vizYAxis', 'AMOUNT'); setv('#vizAggregation', 'sum'); setv('#vizSankeyTo', 'STATUS'); setv('#vizSankeyStage3', 'FY'); setv('#vizLimit', '5'); }
  };
  // Settings every type carries, applied after the type's own.
  function commonSettings(t) {
    $('#vizTitle').val('RT ' + t).trigger('change');
    if (!$('#vizNumStyle').prop('disabled')) setv('#vizNumStyle', 'compact');
    $('#vizFilterExpression').val('STATUS != Declined').trigger('input').trigger('change');
  }

  function runR() {
    var F = window.__CI;
    Object.keys(R_SETUPS).forEach(function (t) {
      section('R', function () {
        openBuilder(); R_SETUPS[t](); commonSettings(t);
        var code1 = window.vizBuildCodeFromForm();
        assert('R ' + t + ': the builder emits a vis() call of its own type', code1.indexOf("vis('" + (t === 'line' && $('#vizFill').is(':checked') ? 'area' : t) + "'") === 0, code1.slice(0, 80));
        F.setSnippet(code1);
        var parsed = F.enumVis();
        if (!parsed.length) { assert('R ' + t + ': the emitted call parses', false, code1.slice(0, 120)); return; }
        var cfg1 = parsed[0].config;
        openBuilder(); F.restore(cfg1);
        var code2 = window.vizBuildCodeFromForm();
        eq('R ' + t + ': vis() -> parse -> reopen -> vis() is the same call', code2, code1);
        // Presets: snapshot -> apply on a fresh builder -> snapshot again, and the call it emits.
        openBuilder(); R_SETUPS[t](); commonSettings(t);
        var s1 = F.snapshot();

        if (crit && $bd) {

          var m = FIX.filter(function (r, ri) { return crit.rowFilter(probe[ri]); }).length;
          assert('K ' + cs[0] + ': ...for that point (' + m + ' rows)', $bd.text().indexOf('(' + m + ' row') !== -1, $bd.find('.infobox-title, h3, h2').first().text().slice(0, 160));
        }
        // The breakdown's headers: tab stops, Enter sorts, aria-sort says so (item 3's shared template).
        if ($bd) {
          var $th = $bd.find('.infobox-drill-table thead th').eq(1);
          assert('K ' + cs[0] + ': breakdown headers are tab stops with aria-sort', $th.attr('tabindex') === '0' && $th.attr('aria-sort') === 'none', 'tabindex=' + $th.attr('tabindex') + ' aria-sort=' + $th.attr('aria-sort'));
          var kd = $.Event('keydown', { which: 13, keyCode: 13, key: 'Enter' }); $th.trigger(kd);
          eq('K ' + cs[0] + ': Enter on a header sorts it (aria-sort)', $th.attr('aria-sort'), 'descending');
          $th.trigger($.Event('keydown', { which: 32, keyCode: 32, key: ' ' }));
          eq('K ' + cs[0] + ': Space steps the same cycle', $th.attr('aria-sort'), 'ascending');
        }
        $('.infobox-overlay').remove();
        // "Drill down..." = the canvas click: the column popup (or the breakdown where it cannot drill).
        $sub = openMenu(rr.canvas);
        nOver = $('.infobox-overlay').length; $('.chart-drill-popup').remove();
        $sub.children('li.ctx-drill-cat').first().find('.ctx-point-act[data-act="open"]').trigger('click');
        assert('K ' + cs[0] + ': "Drill down" opens what a click opens', $('.chart-drill-popup').length === 1 || $('.infobox-overlay').length === nOver + 1, '');
        $('.chart-drill-popup').remove(); $('.infobox-overlay').remove();
        // Notes: treemap is a notes type; the others are not (and must not offer any).
        $sub = openMenu(rr.canvas);
        var $notes = $sub.find('.ctx-drill-notes');
        if (cs[0].indexOf('treemap') === 0) {
          assert('K treemap: each tile offers its notes, with the count', $notes.length === $sub.children('li.ctx-drill-cat').length && /Notes \(2\)/.test($notes.first().text()), $notes.length + ' / ' + $notes.first().text());
          assert('K treemap: the entry itself says how many notes', /\(2 notes\)/.test($sub.children('li.ctx-drill-cat').first().children('.ctx-cat-label').text()), $sub.children('li.ctx-drill-cat').first().children('.ctx-cat-label').text());
          OPENED.length = 0; $notes.first().trigger('click');
          assert('K treemap: the notes entry opens that point\'s thread', OPENED.length === 1 && !!OPENED[0], JSON.stringify(OPENED));
        } else {
          eq('K ' + cs[0] + ': no notes offered on a chart type without point notes', $notes.length, 0);
        }
        $menu.hide();
      });
    }
    // A plain bar: its labels list keeps the drill columns and gains each category's notes.
    await asection('K', async function () {
      openBuilder(); setv('#vizXAxis', 'DEPT'); clickType('bar'); setv('#vizYAxis', 'AMOUNT'); setv('#vizAggregation', 'sum'); setv('#vizLimit', '9999');
      var rr = await renderReport(window.vizBuildCodeFromForm());
      if (!rr.chart) { assert('K bar: renders', false, rr.text); return; }
      var $sub = openMenu(rr.canvas);
      var $cat = $sub.children('li.ctx-drill-cat').first();
      assert('K bar: the drill columns are still listed', $cat.find('.ctx-drill-leaf').length > 0, $cat.text().slice(0, 100));
      assert('K bar: a category offers its notes (count) from the menu', /Notes \(2\)/.test($cat.find('.ctx-drill-notes').text()) && /\(2 notes\)/.test($cat.children('.ctx-cat-label').text()), $cat.children('.ctx-cat-label').text() + ' | ' + $cat.find('.ctx-drill-notes').text());
      OPENED.length = 0; $cat.find('.ctx-drill-notes').first().trigger('click');
      assert('K bar: ...and opens it', OPENED.length === 1, JSON.stringify(OPENED));
      $menu.hide();
    });
    P.chartNotesActive = saved.active; P.chartNoteCount = saved.count; P.openChartNote = saved.open;
  }

  async function run() {
    var F = window.__CI;
    if (!F || typeof F.chartData !== 'function') {
      report('RESULTS_JSON:' + JSON.stringify({ fatal: 'hooks unavailable: ' + (window.__CI_ERR || 'n/a'), pageErrors: window.__errors.slice(0, 6) }));
      return;
    }
    $('#visualizationLightbox').css('display', 'block');
    await asection('LIB', async function () {
      await F.loadScript('js/chart-4.5.1.min.js');
      await F.loadScript('js/chartjs-plugin-datalabels-2.0.0.min.js');
      await F.loadScript('js/chartjs-chart-treemap-3.1.0.min.js');
      await F.loadScript('js/chartjs-chart-sankey-0.19.1.min.js');
      await F.loadChartModule();
      if (window.ChartDataLabels) Chart.register(ChartDataLabels);
      assert('LIB Chart.js, the plugins and the chart module are up', typeof Chart === 'function' && window.PenumbraCharts && window.PenumbraCharts.armed);
    });
    window.vizCachedData = FIX;
    if (!ONLY || ONLY === 'C') runC();
    if (!ONLY || ONLY === 'R') runR();
    if (!ONLY || ONLY === 'L') runL();
    if (!ONLY || ONLY === 'P' || ONLY === 'A') await runPA();
    if (!ONLY || ONLY === 'F') await runF();
    if (!ONLY || ONLY === 'D') await runD();
    if (!ONLY || ONLY === 'K') await runK();
    // E (email / PDF) runs in the vischarts suite on these very calls and rows.
    Object.keys(EXPORT_CODES).forEach(function (t) { results.push({ name: 'EXPORT code ' + t, pass: true, detail: EXPORT_CODES[t], export: true }); });
    var cols = ['DEPT', 'STATUS', 'FY', 'AMOUNT', 'AWARD_ID', 'STATE', 'N', 'START_DATE', 'END_DATE'];
    results.push({ name: 'EXPORT fixture', pass: true, export: true,
      detail: [cols.join('|')].concat(FIX.map(function (m) { return cols.map(function (c) { return String(m.get(c) || '').replace(/\|/g, '/'); }).join('|'); })).join('\n') });
    report('RESULTS_JSON:' + JSON.stringify({ pageErrors: window.__errors.slice(0, 8), dialogs: (window.__dialogs || []).slice(0, 4), results: results }));
  }

  var tries = 0;
  (function wait() {
    tries++;
    if (window.__CI || tries > 60) {
      setTimeout(function () {
        run().catch(function (e) { report('RESULTS_JSON:' + JSON.stringify({ fatal: 'run threw: ' + e + ' ' + String(e.stack || '').split('\n').slice(0, 3).join(' | '), pageErrors: window.__errors.slice(0, 6) })); });
      }, 300);
    } else { setTimeout(wait, 100); }
  })();
})();
</script>
