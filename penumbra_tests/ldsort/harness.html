<!-- ldsort suite (2026-10-23) - a report's SAVED sort at load, by name.
     A saved sort keeps each level's colIndex: the column's place in the result when the report was saved. After
     the report's SQL added or moved a column, that place holds another column. Each scenario boots the REAL main.js
     (+ the REAL grouping module) through the REAL run path (a stubbed query.php) from a stored state whose
     sortCriteria names a column at a stale place, a gone column, a renamed one, '#', a journal column, a pivot's
     chain... and the driver reads the order, the marks and the page's sort back. The plumbing below is the grplist
     harness's (main.js binds the grouping dialog's fields at ready, so they come first). -->

<script>
  (function () { try { localStorage.clear(); } catch (e) {} })();
  window.PENUMBRA_THEMES = { 'theme-default': { label: 'Default' } };
  window.PENUMBRA_THEME_IDS = ['theme-default'];
  window.PENUMBRA_THEME_ALIASES = {};
  window.PENUMBRA_LANDING_DEFAULT_THEME = 'theme-default';
  (function () {
    var P = new URLSearchParams(location.search);
    var S = window.__SCN = P.get('scn') || 'flat';
    // --- the fixture: the grplist / hiddencols one (300 rows, 20 columns, 6 shown) --------------------------------
    var COLS = [
      'V_ID', 'V_NAME', 'V_AMOUNT', 'V_DATE', 'V_LINK', 'V_STATUS',            // 0-5 shown
      'H_TEXT', 'H_NUM', 'H_MONEY', 'H_DATE', 'H_HTML', 'H_JSON', 'H_ENT',     // 6-12 hidden
      'H_NL', 'H_NULL', 'H_GROUP', 'H_GROUP2', 'H_AMT', 'H_FLAG', 'H_CODE'     // 13-19 hidden
    ];
    var seed = 20260930;
    function rnd() { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; }
    function pick(a) { return a[Math.floor(rnd() * a.length)]; }
    var W = ['Alpha', 'Bravo', 'Charlie', 'Delta', 'Echo', 'Foxtrot', 'Golf', 'Hotel', 'India', 'Juliet', 'Kilo', 'Lima'];
    function money() { return '$' + (rnd() * 90000 + 100).toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ','); }
    function date() { var d = new Date(2021, 0, 1 + Math.floor(rnd() * 1500)); return (d.getMonth() + 1) + '/' + d.getDate() + '/' + d.getFullYear(); }
    function link() { var id = String(400000 + Math.floor(rnd() * 99999)); return '@@HTML<a href="https://oitras.oit.ncsu.edu/resolver/103?id=' + id + '" target="_new" class="resolver-link">' + id + '</a>'; }
    var rows = [];
    for (var i = 1; i <= 300; i++) {
      var r = {};
      // numname: a column named 2021 - an integer-like key, which JS puts FIRST in a row's keys (so in the result's
      // columns): every other column moves one place to the right, as when a report's SQL adds a column in front
      if (S === 'numname' || S === 'numurl' || S === 'numrenamed' || S === 'numsaved') r['2021'] = String(Math.floor(rnd() * 5000));
      r.V_ID = 'ID-' + String(1000 + i);
      r.V_NAME = pick(W) + ' ' + pick(W);
      r.V_AMOUNT = money();
      // casedup: a second column named v_amount (place 3): two columns can share a name but for its case (quoted
      // aliases); both headings read V_AMOUNT
      if (S === 'casedup') r.v_amount = money();
      r.V_DATE = date();
      r.V_LINK = link();
      r.V_STATUS = pick(['Open', 'Closed', 'Pending']);
      r.H_TEXT = pick(W) + ' ' + pick(W) + ' ' + i;
      r.H_NUM = String(Math.floor(rnd() * 1000));
      r.H_MONEY = money();
      r.H_DATE = date();
      r.H_HTML = link();
      var sub = []; for (var k = 0, n = 1 + Math.floor(rnd() * 3); k < n; k++) sub.push({ SUB_ID: 'S' + Math.floor(rnd() * 90), SUB_AMT: Math.floor(rnd() * 5000), SUB_NAME: pick(W) });
      r.H_JSON = (i % 7 === 0) ? null : '@@JSON' + JSON.stringify(sub);
      r.H_ENT = pick(['R&amp;D', 'plain', 'A &amp; B']);
      r.H_NL = pick(W) + '\n' + pick(W);
      r.H_NULL = (i % 3 === 0) ? null : ((i % 3 === 1) ? '' : pick(W));
      r.H_GROUP = (i % 11 === 0) ? null : pick(['North', 'South', 'East', 'West', 'Central']);
      r.H_GROUP2 = pick(['Tier 1', 'Tier 2', 'Tier 3']);
      r.H_AMT = String(Math.floor(rnd() * 20000) / 100);
      r.H_FLAG = rnd() < 0.3 ? 'Y' : 'N';
      r.H_CODE = pick(['AB', 'CD', 'EF', 'GH']) + '-' + Math.floor(rnd() * 99);
      rows.push(r);
    }
    window.__rowsFixture = rows;
    // --- the scenario's stored report ------------------------------------------------------------------------
    // order: the column order the report was SAVED with (every flat heading's place, as buildStateObject writes
    // it) - 20 places = the result's 20 columns; 21 = the report had one more column when it was saved
    function places(n) { var o = []; for (var c = 0; c < n; c++) o.push(c); return o; }
    var st = {
      name: 'ldfix', query: 'SELECT * FROM LD_FIXTURE', reportTitle: 'Saved sort fixture',
      theme: 'theme-default', density: 'standard',
      visibleColumns: ['#', 0, 1, 2, 3, 4, 5], columnOrder: places(20),
      sortCriteria: [], noLimit: true, rowExpandDefault: false, resolverLinksDefault: true,
      rowsPerPage: '200', reportSnippet: ''
    };
    // V_AMOUNT is place 2 of the result; the saved sorts below name it at place 1 (V_NAME's now): saved before the
    // SQL put a column in front of it
    var SORTS = {
      flat: [{ colIdentifier: 'V_AMOUNT', colIndex: 1, direction: 'desc' }],
      group: [{ colIdentifier: 'V_AMOUNT', colIndex: 1, direction: 'desc' }],
      multi: [{ colIdentifier: 'V_STATUS', colIndex: 4, direction: 'asc' }, { colIdentifier: 'V_AMOUNT', colIndex: 1, direction: 'desc' }],
      // gone: saved with H_GONE at place 1 (and V_AMOUNT at 3); the SQL has dropped H_GONE since (21 places saved)
      gone: [{ colIdentifier: 'H_GONE', colIndex: 1, direction: 'asc' }, { colIdentifier: 'V_AMOUNT', colIndex: 3, direction: 'desc' }],
      allgone: [{ colIdentifier: 'H_GONE', colIndex: 1, direction: 'asc' }, { colIdentifier: 'H_GONE2', colIndex: 3, direction: 'desc' }],
      // renamed: V_AMOUNT's alias was V_AMT_OLD when the report was saved - renamed in place (20 places, as now)
      renamed: [{ colIdentifier: 'V_AMT_OLD', colIndex: 2, direction: 'asc' }],
      renamedrq: [{ colIdentifier: 'V_AMT_OLD', colIndex: 2, direction: 'asc' }],
      // taken: V_OLD renamed in place, saved at 2 - the place the V_AMOUNT level after it names now (first, so that
      // without the check it would take the place, and its direction, before V_AMOUNT's level comes)
      taken: [{ colIdentifier: 'V_OLD', colIndex: 2, direction: 'asc' }, { colIdentifier: 'V_AMOUNT', colIndex: 1, direction: 'desc' }],
      // casename: an old save's name in the SQL's own case, at the right place
      casename: [{ colIdentifier: 'v_Amount', colIndex: 2, direction: 'asc' }],
      // numname: a click on the 2021 heading saves the NUMBER 2021 (jQuery's data() reads "2021" as one); saved at
      // place 3, before the column moved to the front
      numname: [{ colIdentifier: 2021, colIndex: 3, direction: 'asc' }],
      hash: [{ colIdentifier: '#', colIndex: '#', direction: 'desc' }],
      journal: [{ colIdentifier: '__JOURNAL_TOGGLE__toggle1', colIndex: '__JOURNAL_TOGGLE__toggle1', direction: 'asc' }, { colIdentifier: 'V_AMOUNT', colIndex: 1, direction: 'desc' }],
      // urlsort: a saved sort on a gone column, and the link's ?sort= in its place
      urlsort: [{ colIdentifier: 'H_GONE', colIndex: 1, direction: 'asc' }],
      // pivot: a pivot's chain names the pivot's own headings, never a source column
      pivot: [{ colIdentifier: 'Open::Sum', colIndex: 3, direction: 'desc' }],
      requery: [],
      // casedup: saved on V_AMOUNT (place 2) - the v_amount column at 3 shares its name but for its case
      casedup: [{ colIdentifier: 'V_AMOUNT', colIndex: 2, direction: 'desc' }],
      // numurl: the link's ?sort=2021|desc in place of any saved sort (2026-10-25, urlnum: the URL resolver names it
      // as a click on the heading does - the NUMBER 2021; it was the STRING)
      numurl: [],
      // numrenamed: the column named 2021 was Y_OLD when the report was saved (21 places, as now)
      numrenamed: [{ colIdentifier: 'Y_OLD', colIndex: 0, direction: 'asc' }],
      // numsaved (2026-10-25, urlnum): a level saved as the TEXT '2021' at its place - a save made from a ?sort= view
      // while the resolver named it so
      numsaved: [{ colIdentifier: '2021', colIndex: 0, direction: 'asc' }],
      // mycalc: renamed in place (as renamed) while this viewer has a calculated column of their own (MYCALC):
      // the result has one column more than the report saved, the columns a save keeps as many
      mycalc: [{ colIdentifier: 'V_AMT_OLD', colIndex: 2, direction: 'asc' }],
      // nameless: a level with no name (a hand-edited state), then V_AMOUNT at its old place
      nameless: [{ colIndex: 1, direction: 'asc' }, { colIdentifier: 'V_AMOUNT', colIndex: 1, direction: 'desc' }],
      // dup: two levels on one column (an old save's case and the heading's)
      dup: [{ colIdentifier: 'v_Amount', colIndex: 2, direction: 'asc' }, { colIdentifier: 'V_AMOUNT', colIndex: 2, direction: 'desc' }],
      // pivotgrp: a pivot report's chain, and the viewer's pinned grouping takes the load
      pivotgrp: [{ colIdentifier: 'Open::Sum', colIndex: 3, direction: 'desc' }]
    };
    st.sortCriteria = SORTS[S] || [];
    if (S === 'gone' || S === 'allgone' || S === 'urlsort') st.columnOrder = places(21);
    if (S === 'numname' || S === 'numurl' || S === 'numrenamed' || S === 'numsaved') { st.columnOrder = places(21); st.visibleColumns = ['#', 0, 1, 2, 3, 4, 5, 6]; }
    if (S === 'casedup') st.columnOrder = places(21);
    if (S === 'group') { st.groupBy = 'H_GROUP'; st.groupAgg = { column: 'H_AMT', type: 'sum' }; }
    if (S === 'pivot' || S === 'pivotgrp') {
      st.pivot = { v: 2, rows: ['H_GROUP'], cols: ['V_STATUS'], vals: 'H_AMT', agg: ['sum'], aggLabels: ['Sum'], aggColOverrides: ['H_AMT'],
                   aggFilters: null, aggFormulas: null, rowLayout: 'flat', colLayout: 'nested', sortOrder: 'asc', colSortOrder: 'asc',
                   stickyColCount: 1, totalColAggs: null, totalRowAggs: null, totalRowAggLabels: null, totalRowAggBaseIdx: null,
                   rankN: null, rankDir: null, rankAgg: null, rankOther: true, rankScope: null, noBreakdown: false, startExpanded: false, hideEmpty: false };
    }
    window.__STORED = st;
    window.penumbra_vars = {
      isAdmin: true, isGlobalAdmin: true, canEditReport: true, currentUserKey: 'harness', shibboleth: { ouc: '', dept: '' },
      tables: { oracle: [], pins: [], infoed: [], hr: [], fin: [] },
      imports: [], reports: [], themes: {}, prompts: {}, grants: [],
      totalExemptions: ['AMOUNT', 'H_AMT', 'H_NUM'],
      preloadedState: st
    };
    window.__queryResponse = { data: rows };
  })();
  window.__T = {};
  window.__queryDone = 0;
  window.__ajaxLog = [];
</script>

<script>
  jQuery.ajax = function (a, b) {
    var opts = (typeof a === 'string') ? jQuery.extend({ url: a }, b || {}) : (a || {});
    var url = String(opts.url || '');
    window.__ajaxLog.push(url);
    var d = jQuery.Deferred();
    var isQuery = /query\.php/.test(url);
    var resp = isQuery ? window.__queryResponse : (/help_content\.php/.test(url) ? '' : {});
    setTimeout(function () {
      try { if (opts.success) opts.success(resp, 'success', { status: 200 }); } catch (e) { window.__errors.push('ajax success threw: ' + String(e)); }
      try { if (opts.complete) opts.complete({ status: 200 }, 'success'); } catch (e) { window.__errors.push('ajax complete threw: ' + String(e)); }
      d.resolve(resp, 'success', { status: 200 });
      if (isQuery) window.__queryDone++;
    }, 0);
    var p = d.promise(); p.abort = function () {}; return p;
  };
  jQuery.getJSON = function (u, x, cb) { return jQuery.ajax({ url: u, success: (typeof x === 'function') ? x : cb }); };
  jQuery.post = function (u, x, cb) { return jQuery.ajax({ url: u, success: (typeof x === 'function') ? x : cb }); };
  jQuery.get = jQuery.post;
  jQuery.fx.off = true;
  window.__errors = [];
  window.__rejections = [];
  window.onerror = function (m, src, line) { window.__errors.push(String(m) + ' @' + String(src).split('/').pop() + ':' + line); return true; };
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    window.__rejections.push(String((r && r.message) || r) + ' @' + String((r && r.stack) || '').split('\n').slice(1, 2).join('').trim());
    e.preventDefault();
  });
  window.confirm = function () { return true; };
  window.alert = function (m) { window.__errors.push('alert: ' + m); };
  window.prompt = function () { return null; };
  if (typeof window.stackHeaders !== 'function') window.stackHeaders = function () {};
</script>

<script>
  // mycalc (run.py opens it with &id=ldcalc): the viewer's own calculated column, as the calc dialog saves it
  if (window.__SCN === 'mycalc') localStorage.setItem('penumbra_calc_columns', JSON.stringify({ ldcalc: [{ name: 'MYCALC', formula: '{H_NUM} * 2' }] }));
  // pivotgrp (&id=ldpiv): a group preset pinned to run on load, as the status bar's star pins it
  if (window.__SCN === 'pivotgrp') {
    try {
      window.PenumbraPresets.save('group', 'ldpiv', 'Mine', { levels: ['H_GROUP'], agg: null, sort: 'label|asc', limit: null, startDepth: 0, layout: 'stacked' });
      window.PenumbraPresets.setPin('layout', 'ldpiv', 'group', 'Mine');
    } catch (e) { window.__errors.push('preset seed: ' + String(e)); }
  }
</script>
