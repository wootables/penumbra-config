<!-- nestsort suite (2026-10-20): a nested-table (@@JSON) column sorts by how many rows
     its tables hold. The REAL main.js booted through the REAL run path (a stubbed
     query.php) on fixture.json (run.py writes it: 240 rows, a shown nested column of
     every shape, a hidden one, one with no table before row 211), plus the REAL header
     menu (penumbra_colmenu.js). ?scn=<name> picks the stored report state; driver.js
     runs that scenario and publishes window.__HCRESULT for run.py.
     The page shell is the sortpage / hiddencols one. -->

<script>
  (function () { try { localStorage.clear(); } catch (e) {} })();
  window.PENUMBRA_THEMES = { 'theme-default': { label: 'Default' } };
  window.PENUMBRA_THEME_IDS = ['theme-default'];
  window.PENUMBRA_THEME_ALIASES = {};
  window.PENUMBRA_LANDING_DEFAULT_THEME = 'theme-default';
  (function () {
    var P = new URLSearchParams(location.search);
    window.__SCN = P.get('scn') || 'boot';
    function getJson(u) { var x = new XMLHttpRequest(); x.open('GET', u, false); x.send(null); return JSON.parse(x.responseText); }
    var FX = getJson('fixture.json');
    window.__FX = FX;
    window.__CORPUS = getJson('corpus.json');
    window.__FUZZ = getJson('fuzz.json');
    var COLS = FX.cols;   // V_ID V_NAME V_STATUS N_JSON V_NUM L_JSON H_JSON
    var order = []; for (var c = 0; c < COLS.length; c++) order.push(c);
    var st = {
      name: 'nsfix', query: 'SELECT * FROM NS_FIXTURE', reportTitle: 'Nested sort fixture',
      theme: 'theme-default', density: 'standard',
      visibleColumns: ['#', 0, 1, 2, 3, 4, 5], columnOrder: order,
      sortCriteria: [], noLimit: true, rowExpandDefault: false, resolverLinksDefault: true,
      rowsPerPage: '200', reportSnippet: ''
    };
    var S = window.__SCN;
    if (S === 'saved') st.sortCriteria = [{ colIdentifier: 'N_JSON', colIndex: 3, direction: 'desc' }];
    if (S === 'savedhidden') st.sortCriteria = [{ colIdentifier: 'H_JSON', colIndex: 6, direction: 'asc' }];
    if (S === 'grouped') { st.groupBy = 'V_STATUS'; st.sortCriteria = [{ colIdentifier: 'N_JSON', colIndex: 3, direction: 'desc' }]; }
    if (S === 'custom') {
      st.customSortOrders = { N_JSON: { values: ['zzz', '@@JSON[]'] } };
      st.sortCriteria = [{ colIdentifier: 'N_JSON', colIndex: 3, direction: 'desc' }];
    }
    if (S === 'plain') st.sortCriteria = [{ colIdentifier: 'V_NUM', colIndex: 4, direction: 'desc' }];
    window.__STORED = st;
    window.penumbra_vars = {
      isAdmin: true, isGlobalAdmin: true, canEditReport: true, currentUserKey: 'harness', shibboleth: { ouc: '', dept: '' },
      tables: { oracle: [], pins: [], infoed: [], hr: [], fin: [] },
      imports: [], reports: [], themes: {}, prompts: {}, grants: [],
      totalExemptions: ['AMOUNT'],
      preloadedState: st
    };
    window.__queryResponse = { data: FX.rows };
  })();
  window.__queryDone = 0;
  window.__ajaxLog = [];
</script>

<script>
  jQuery.ajax = function (a, b) {
    var opts = (typeof a === 'string') ? jQuery.extend({ url: a }, b || {}) : (a || {});
    var url = String(opts.url || '');
    window.__ajaxLog.push(url);
    var d = jQuery.Deferred();
    var isQuery = /query\.php/.test(url);
    var resp = isQuery ? window.__queryResponse : {};
    setTimeout(function () {
      try { if (opts.success) opts.success(resp, 'success', { status: 200 }); } catch (e) { window.__errors.push('ajax success threw: ' + String(e)); }
      try { if (opts.complete) opts.complete({ status: 200 }, 'success'); } catch (e) { window.__errors.push('ajax complete threw: ' + String(e)); }
      d.resolve(resp, 'success', { status: 200 });
      if (isQuery) window.__queryDone++;
    }, 0);
    var p = d.promise(); p.abort = function () {}; return p;
  };
  jQuery.getJSON = function (u, x, cb) { return jQuery.ajax({ url: u, success: (typeof x === 'function') ? x : cb }); };
  jQuery.post = function (u, x, cb) { return jQuery.ajax({ url: u, success: (typeof x === 'function') ? x : cb }); };
  jQuery.get = jQuery.post;
  jQuery.fx.off = true;
  window.__clip = [];
  try {
    Object.defineProperty(navigator, 'clipboard', { configurable: true, value: {
      writeText: function (t) { window.__clip.push(String(t)); return Promise.resolve(); },
      write: function () { window.__clip.push('[rich]'); return Promise.resolve(); }
    } });
  } catch (e) { window.__clipErr = String(e); }
  window.__errors = [];
  window.__rejections = [];
  window.onerror = function (m, src, line) { window.__errors.push(String(m) + ' @' + String(src).split('/').pop() + ':' + line); return true; };
  window.addEventListener('unhandledrejection', function (e) {
    var r = e.reason;
    window.__rejections.push(String((r && r.message) || r) + ' @' + String((r && r.stack) || '').split('\n').slice(1, 2).join('').trim());
    e.preventDefault();
  });
  window.confirm = function () { return true; };
  window.alert = function (m) { window.__errors.push('alert: ' + m); };
  window.prompt = function () { return null; };
  if (typeof window.stackHeaders !== 'function') window.stackHeaders = function () {};
</script>
